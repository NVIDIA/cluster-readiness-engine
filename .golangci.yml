version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already enabled.
        - G104
        # G115 flags int -> int32 conversions. Node, step, and
        # interruption counts are bounded by cluster size and fit in int32.
        - G115
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: pkg/*
      # Tests and the golden-file helper read and write fixtures with
      # relaxed permissions. That is intended.
      - linters:
          - gosec
        path: _test\.go$
      - linters:
          - gosec
        path: pkg/testutil/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
