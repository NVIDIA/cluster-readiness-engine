apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gpu-cluster-cert
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 4
  # Uncomment when your workload images require a pull secret.
  # imagePullSecrets:
  #   - name: ngc-secret
  # Uncomment to carry a site-specific setting the catalog cannot know, for
  # example on a fabric with a known NVLink SHARP defect. Variables set here
  # apply to every category and win over whatever the catalog resolved; a
  # category can add or change one under its own options.env without losing
  # the ones set here.
  # env:
  #   - name: NCCL_NVLS_ENABLE
  #     value: "0"
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
