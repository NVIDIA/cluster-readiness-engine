#
# Dependabot keeps Go modules, pinned GitHub Actions, and the digest-pinned
# container base images current.
# Updates are grouped to keep the pull request count low.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait before adopting a new version. The common supply-chain attack is a
    # malicious release of a real package that bots pull within hours; a delay
    # gives the ecosystem time to spot and yank it. Patches wait the shortest
    # time because they carry most of the security fixes.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # TEMPORARY: hold the Kubernetes libraries at 0.36.x until
    # github.com/kubeflow/trainer/v2 ships a 1.37-compatible release.
    #
    # Kubernetes 1.37 removed the unused corev1.PodStatusResult type
    # (kubernetes/kubernetes#136271, listed under API Change in
    # CHANGELOG-1.37; it had no REST endpoint and had been unused since
    # 2015). Trainer still references it from its generated openapi, and we
    # import that package in api/v1alpha1/job_types.go, so bumping these
    # modules fails the build with "undefined: corev1.PodStatusResult" and
    # takes every CI job down with it. See the failure on #312.
    #
    # Nothing in our dependency graph actually wants 0.37; only Dependabot
    # proposes it. Trainer master is still on k8s v0.36.4 and the bump is
    # open in kubeflow/trainer#4005, itself blocked on kubeflow/trainer#4006.
    # Watch #4005: when it lands and a release follows, bump trainer and
    # delete this block in the same PR.
    #
    # Scoped to minor and major so 0.36.x patch updates keep flowing. Only
    # the modules that move with the Kubernetes minor are listed. k8s.io/klog
    # (v2.x), k8s.io/kube-openapi and k8s.io/utils (pseudo-versions), and the
    # independently versioned sigs.k8s.io modules are deliberately excluded
    # so they are not frozen by accident. controller-runtime is included
    # because 0.25.0 requires k8s.io/api v0.37.0.
    ignore:
      - dependency-name: "k8s.io/api"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/apiextensions-apiserver"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/apimachinery"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/apiserver"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/client-go"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/component-base"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "k8s.io/streaming"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  # No cooldown here: GitHub Actions is not one of the ecosystems that supports
  # it. Actions are pinned to commit SHAs, which Dependabot raises.
  #
  # NOT covered by any ecosystem below: tool versions pinned outside a manifest
  # Dependabot parses -- the *_VERSION variables in the Makefile (controller-gen,
  # addlicense, golangci-lint, govulncheck, gotestsum, gocover-cobertura) and
  # COSIGN_VERSION in publish.yml. Dependabot reads neither Makefiles nor
  # workflow `env:` values, so those pins are bumped by hand and must be checked
  # during release prep. Moving the Go tools into a `tools.go` build-tagged file
  # would place them in go.mod and bring them under the gomod ecosystem; that
  # adds direct dependencies and is deliberately left as a separate decision.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Raises the base-image digests in Dockerfile. Without this, pinning by
  # digest would hold the images at these bits and security fixes published
  # under the same tag would never arrive.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Docker supports default-days only; the semver bump keys are gomod-only.
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"
