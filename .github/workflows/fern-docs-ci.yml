# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changed-files:
    runs-on: linux-amd64-cpu8
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Diffed against the merge base with main, not against the previous head
      # of this branch. `github.event.before` describes one push, so a push that
      # merges main reports no docs change even when the branch's own commits
      # changed docs -- and the last run is the one the merge button reads.
      #
      # That is how a broken fern/ change reached main with Fern Check green:
      # the final push was a merge of main, the job was skipped, and a skipped
      # job is not a failed one. Every path that cannot answer the question now
      # answers "run the checks".
      - name: Check for docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags origin main; then
            echo "could not fetch main; running the checks rather than guessing"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git merge-base FETCH_HEAD HEAD || true)"
          if [ -z "${base}" ]; then
            echo "no merge base with main; running the checks rather than guessing"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "comparing against merge base ${base}"
          if git diff --name-only "${base}" HEAD | grep -qE '^(docs/|fern/)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  fern-check:
    name: Fern Check
    needs: changed-files
    if: github.repository == 'NVIDIA/cluster-readiness-engine' && needs.changed-files.outputs.docs == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, for the frozen version content below.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      # Authored content only. The frozen version content below is a copy of
      # docs/ at a release tag, so checking it here would report every finding
      # twice and fail on pages that can no longer be edited.
      - name: Check MDX safety
        run: |
          BAD=$(grep -rn '<img\b[^>]*[^/]>\|<img>' docs/ fern/ --include="*.md" --include="*.mdx" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-self-closing <img> tags found (MDX requires <img ... />):"
            echo "$BAD"
            exit 1
          fi

      # fern/docs.yml registers past releases whose navigation points into
      # fern/versions/<tag>-content/. That content is derived from the tag and
      # is not committed, so without this the checks below follow docs.yml into
      # a directory that does not exist and fail on every PR touching docs/ or
      # fern/ -- which is exactly what happened when v0.1.0 was registered.
      - name: Freeze registered version content
        run: ./hack/fern-freeze-versions.sh

      - name: Fern check
        run: fern check

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links
