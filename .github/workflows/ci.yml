name: CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        run: make lint

  build:
    name: Build
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: make build

      - name: Build ncrectl binary
        run: make build-ncrectl

  test:
    name: Test
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test tools
        run: |
          go install gotest.tools/gotestsum@latest
          go install github.com/boumenot/gocover-cobertura@latest

      - name: Run tests
        run: make test-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            unit-report.xml
            integration-report.xml
            coverage.xml
            cover-unit.out
            cover-integration.out
          if-no-files-found: ignore
