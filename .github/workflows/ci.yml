name: CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        run: make lint

  build:
    name: Build
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: make build

      - name: Build nvcrectl binary
        run: make build-nvcrectl

      # The same scan that gates publication in release.yml. Running it here on
      # every pull request exercises the mechanism continuously, instead of
      # first running it on the day someone cuts a tag and blocking a release.
      - name: Scan built binaries for malware
        env:
          CLAMAV_IMAGE: clamav/clamav:stable@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        run: |
          set -euo pipefail
          # --entrypoint is required. The image's default entrypoint is /init,
          # a supervisor that starts freshclam and clamd; without the override
          # the arguments below reach that supervisor rather than clamscan.
          # The stable tag ships a virus database, so no freshclam run is needed.
          # clamscan exits 1 when it finds something and 2 on error, so set -e
          # fails the step either way.
          docker run --rm \
            -v "${PWD}/bin:/scan:ro" \
            --entrypoint clamscan \
            "${CLAMAV_IMAGE}" \
            --recursive --infected --suppress-ok-results \
            --max-filesize=512M --max-scansize=2048M \
            /scan

  test:
    name: Test
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      # gotestsum and gocover-cobertura are installed by `make test-ci` at the
      # versions pinned in the Makefile, so CI and a local run report against
      # the same tools. They were previously installed here from an unpinned
      # floating version, which let the reporting toolchain resolve differently
      # on every run.
      - name: Run tests
        run: make test-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            unit-report.xml
            integration-report.xml
            coverage.xml
            cover-unit.out
            cover-integration.out
          if-no-files-found: ignore

  # Report-only performance tracking. Runs the Go benchmarks on every push and,
  # on pull-request branches, compares HEAD against the merge-base with
  # benchstat in the job summary. It never fails the build for a performance
  # delta; it fails only on genuine errors, such as benchmarks that do not
  # compile. Do not add this job to any required-checks list.
  benchmark:
    name: Benchmark
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base against main can be resolved.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks on HEAD
        run: |
          set -euo pipefail
          go test -run '^$' -bench=. -benchmem -count=6 ./pkg/orchestration/ | tee bench-new.txt

      - name: Run benchmarks on the merge-base
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          echo "merge-base: ${base}"
          git worktree add "${RUNNER_TEMP}/bench-base" "${base}"
          # The merge-base may predate the benchmarks; tolerate a failed run
          # instead of failing the job. The compare step checks the output.
          (cd "${RUNNER_TEMP}/bench-base" && \
            go test -run '^$' -bench=. -benchmem -count=6 ./pkg/orchestration/) \
            > bench-old.txt || true

      - name: Compare against the merge-base
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        run: |
          set -euo pipefail
          if [[ ! -s bench-old.txt ]] || ! grep -q '^Benchmark' bench-old.txt; then
            echo "No benchmarks at the merge-base; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Benchmark comparison (merge-base vs HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Report-only: benchstat output goes to the summary and a benchstat
          # error never fails the build.
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da bench-old.txt bench-new.txt \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
