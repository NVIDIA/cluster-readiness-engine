name: CodeQL

on:
  # pull_request covers the PRs the push triggers below miss: those opened from
  # forks, and the Dependabot and docs-automation branches that match neither
  # 'main' nor 'pull-request/N'. Without it CodeQL annotates no pull request,
  # which is what OpenSSF Scorecard's SAST check samples for.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An in-repo PR now analyzes twice: once for pull_request (ref
  # refs/pull/N/merge) and once for the copy-pr-bot push to pull-request/N.
  # Those refs cannot be folded into one concurrency key -- no expression
  # recovers N from the branch name -- so the duplicate is accepted rather than
  # papered over. Dropping the push trigger would remove CodeQL from the gated
  # bot CI, which is the worse trade.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze Go
    # Fork PRs build unvetted code, so route pull_request runs to a
    # GitHub-hosted runner and keep them off the self-hosted pool.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'linux-amd64-cpu16' }}
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Build
        run: go build ./...

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
