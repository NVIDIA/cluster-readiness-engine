# Reusable workflow that builds and pushes the controller image and produces its
# per-platform SBOMs.
#
# It exists so the RELEASE is authoritative about what it advertises. Previously
# publish.yml and release.yml both fired on a tag push and raced: release.yml
# created a GitHub Release naming an image tag it had never resolved, could not
# confirm existed, and had no digest for -- so it could not have verified a
# signature even in principle. Now release.yml calls this workflow and receives
# the digests directly, and publish.yml builds only the main-branch dev images.
#
# It does NOT sign anything. Signing belongs to attest.yml, which every caller
# invokes with the digests this workflow returns (ADR-074 decision 4).

name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: >-
          Tag to publish the image under. The caller is responsible for
          validating it; this workflow re-checks the shape because the value
          reaches a shell.
        required: true
        type: string
      image_name:
        description: >-
          Registry path of the image to build, without tag or digest. Defaults
          to the controller image, so existing callers need no change.
        required: false
        default: ghcr.io/nvidia/cluster-readiness-engine/manager
        type: string
      dockerfile:
        description: 'Dockerfile to build, relative to the repository root.'
        required: false
        default: Dockerfile
        type: string
      build_context:
        description: >-
          Build context directory. The GEMM harness has its own, because the
          repository root .dockerignore re-includes only Go sources.
        required: false
        default: '.'
        type: string
      native_per_arch:
        description: >-
          Build each architecture on a runner of that architecture instead of
          cross-compiling one.

          False, the default, keeps the controller image's path: its Dockerfile
          cross-compiles with GOARCH=${TARGETARCH}, so one amd64 runner
          produces both platforms and that is both correct and fast.

          True is for an image whose compiler targets the host. nvcc has no
          equivalent of GOARCH, so the CUDA stage of the GEMM harness compiles
          for whatever machine it runs on; cross-compiling it produced an arm64
          image holding x86-64 binaries, which is a GB200 or GB300 node whose
          GPUs report nothing. Emulation is not the way out either: the amd64
          harness build takes over an hour natively, so QEMU would take most of
          a day.
        required: false
        default: false
        type: boolean
      arm64_runner:
        description: >-
          Runner label for the native arm64 leg. Only read when
          native_per_arch is true.

          Defaults to GitHub's hosted arm64 runner, which this repository being
          public makes available. It is the smallest thing that works, not the
          right thing: four vCPUs compiling CUTLASS is slow, and its memory and
          disk are the tighter limits. Point this at a self-hosted arm64 label
          when one exists, mirroring linux-amd64-cpu32.
        required: false
        default: ubuntu-24.04-arm
        type: string
      build_timeout_minutes:
        description: >-
          Minutes before the build is killed.

          An input because 40 fits the controller image and does not fit a
          CUTLASS compile: the harness amd64 build was measured at 1h14m, so
          the harness would have been killed at 40 minutes on its first
          publish, and image-attested turns that into a red release.
        required: false
        default: 40
        type: number
    outputs:
      image_name:
        description: 'Registry path of the image, without tag or digest.'
        value: ${{ jobs.build.outputs.image_name }}
      index_digest:
        description: 'Digest of the multi-platform index.'
        value: ${{ jobs.build.outputs.index_digest }}
      amd64_digest:
        description: 'Digest of the linux/amd64 child manifest.'
        value: ${{ jobs.build.outputs.amd64_digest }}
      arm64_digest:
        description: 'Digest of the linux/arm64 child manifest.'
        value: ${{ jobs.build.outputs.arm64_digest }}
      sbom_artifact:
        description: 'Name of the uploaded artifact holding the per-platform SBOMs.'
        value: ${{ jobs.build.outputs.sbom_artifact }}

permissions: {}

env:
  IMAGE_NAME: ${{ inputs.image_name }}

jobs:
  native-amd64:
    name: Build amd64 natively
    # Skipped entirely unless the caller asks for native builds, so the
    # controller image's path is unchanged by this job existing.
    if: >-
      github.repository == 'NVIDIA/cluster-readiness-engine' &&
      inputs.native_per_arch
    runs-on: linux-amd64-cpu32
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Re-validated here for the same reason the build job re-validates: this
      # value reaches a shell in a job holding packages:write.
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          case "${IMAGE_TAG}" in
            *$'\n'*|*$'\r'*)
              echo "::error::image_tag contains a newline or carriage return"
              exit 1
              ;;
          esac
          if [[ ! "${IMAGE_TAG}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|main-[0-9a-f]{7})$ ]]; then
            echo "::error::image_tag is neither vMAJOR.MINOR.PATCH[-prerelease] nor main-<sha>: ${IMAGE_TAG}"
            exit 1
          fi

      # The whole point of this job is that the build runs on hardware of the
      # target architecture, so assert it rather than trust the label. A label
      # that silently resolves to the wrong architecture either emulates for
      # hours or dies inside BuildKit with an unrelated message, and the image
      # it would publish is the broken one this job exists to prevent.
      - name: Confirm the runner is amd64
        env:
          WANT: amd64
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64)   got=amd64 ;;
            ARM64) got=arm64 ;;
            *)     got="${RUNNER_ARCH}" ;;
          esac
          if [[ "${got}" != "${WANT}" ]]; then
            echo "::error::this job must run on ${WANT} but the runner is ${got};" \
                 "nvcc compiles for the host, so it would publish an image of the wrong architecture"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        env:
          PLATFORM: linux/amd64
          DOCKER_IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          DOCKER_BUILD_CONTEXT: ${{ inputs.build_context }}
          BUILDX_METADATA: buildx-metadata.json
        run: |
          set -euo pipefail
          make docker-buildx-native
          # Read the digest buildx recorded rather than inspecting a tag:
          # this leg pushes by digest and carries no tag, so there is nothing
          # to inspect until the index is assembled.
          digest=$(jq -r '."containerimage.digest" // empty' "${BUILDX_METADATA}")
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx reported no usable digest for linux/amd64: '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  native-arm64:
    name: Build arm64 natively
    # Skipped entirely unless the caller asks for native builds, so the
    # controller image's path is unchanged by this job existing.
    if: >-
      github.repository == 'NVIDIA/cluster-readiness-engine' &&
      inputs.native_per_arch
    runs-on: ${{ inputs.arm64_runner }}
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Re-validated here for the same reason the build job re-validates: this
      # value reaches a shell in a job holding packages:write.
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          case "${IMAGE_TAG}" in
            *$'\n'*|*$'\r'*)
              echo "::error::image_tag contains a newline or carriage return"
              exit 1
              ;;
          esac
          if [[ ! "${IMAGE_TAG}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|main-[0-9a-f]{7})$ ]]; then
            echo "::error::image_tag is neither vMAJOR.MINOR.PATCH[-prerelease] nor main-<sha>: ${IMAGE_TAG}"
            exit 1
          fi

      # The whole point of this job is that the build runs on hardware of the
      # target architecture, so assert it rather than trust the label. A label
      # that silently resolves to the wrong architecture either emulates for
      # hours or dies inside BuildKit with an unrelated message, and the image
      # it would publish is the broken one this job exists to prevent.
      - name: Confirm the runner is arm64
        env:
          WANT: arm64
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64)   got=amd64 ;;
            ARM64) got=arm64 ;;
            *)     got="${RUNNER_ARCH}" ;;
          esac
          if [[ "${got}" != "${WANT}" ]]; then
            echo "::error::this job must run on ${WANT} but the runner is ${got};" \
                 "nvcc compiles for the host, so it would publish an image of the wrong architecture"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        env:
          PLATFORM: linux/arm64
          DOCKER_IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          DOCKER_BUILD_CONTEXT: ${{ inputs.build_context }}
          BUILDX_METADATA: buildx-metadata.json
        run: |
          set -euo pipefail
          make docker-buildx-native
          # Read the digest buildx recorded rather than inspecting a tag:
          # this leg pushes by digest and carries no tag, so there is nothing
          # to inspect until the index is assembled.
          digest=$(jq -r '."containerimage.digest" // empty' "${BUILDX_METADATA}")
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx reported no usable digest for linux/arm64: '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Container
    needs: [native-amd64, native-arm64]
    # !cancelled() rather than a bare repository check, because both native
    # jobs are skipped on the controller image's path and a skipped dependency
    # would otherwise skip this job too. The explicit failure and cancellation
    # tests are what keep a broken native leg from being assembled into an
    # index and signed.
    if: >-
      !cancelled() &&
      github.repository == 'NVIDIA/cluster-readiness-engine' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: linux-amd64-cpu32
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    outputs:
      # From a step, not `${{ env.* }}`. Availability of the env context in a
      # job-level outputs block is not a guarantee worth resting the release on:
      # an empty value here would flow into every attest call as the subject.
      image_name: ${{ steps.name.outputs.value }}
      index_digest: ${{ steps.push.outputs.digest }}
      amd64_digest: ${{ steps.platforms.outputs.amd64 }}
      arm64_digest: ${{ steps.platforms.outputs.arm64 }}
      sbom_artifact: ${{ steps.name.outputs.sbom_artifact }}
    steps:
      - name: Resolve image name
        id: name
        run: |
          set -euo pipefail
          [[ -n "${IMAGE_NAME}" ]] || { echo "::error::IMAGE_NAME is empty"; exit 1; }
          echo "value=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          # Per-image artifact name. Two callers in one workflow run would
          # otherwise both upload "image-sboms", and upload-artifact v4 fails
          # on a duplicate name, so the second image's SBOMs would take the
          # release down rather than merely go missing.
          echo "sbom_artifact=image-sboms-${IMAGE_NAME##*/}" >> "$GITHUB_OUTPUT"

      # Re-validated here even though callers validate: this value reaches a
      # shell in a job holding packages:write, and a reusable workflow must not
      # rely on every future caller having done the check.
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          case "${IMAGE_TAG}" in
            *$'\n'*|*$'\r'*)
              echo "::error::image_tag contains a newline or carriage return"
              exit 1
              ;;
          esac
          if [[ ! "${IMAGE_TAG}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|main-[0-9a-f]{7})$ ]]; then
            echo "::error::image_tag is neither vMAJOR.MINOR.PATCH[-prerelease] nor main-<sha>: ${IMAGE_TAG}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the pre-populated buildkitd config on NVIDIA GHA runners, which
      # routes image pulls through a per-environment Docker mirror cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Assemble the index from the legs that already pushed, when the caller
      # asked for native builds. Nothing is compiled here: imagetools create
      # writes a manifest list referring to the two digests, so each child
      # keeps the digest it was pushed under and the per-platform resolution
      # and attestation below are unchanged.
      - name: Assemble the multi-platform index
        if: inputs.native_per_arch
        env:
          AMD64: ${{ needs.native-amd64.outputs.digest }}
          ARM64: ${{ needs.native-arm64.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          for v in AMD64 ARM64; do
            eval "d=\${$v}"
            if [[ ! "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the ${v} leg reported no usable digest ('${d}'); refusing to"
              echo "::error::assemble an index that would be missing a platform"
              exit 1
            fi
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}@${AMD64}" \
            "${IMAGE_NAME}@${ARM64}"

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          # Cross-compiled in one pass unless the legs above already built and
          # pushed each architecture natively.
          if [[ "${NATIVE_PER_ARCH}" != "true" ]]; then
            make docker-buildx
          fi
          # Capture the image digest for signing
          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          NATIVE_PER_ARCH: ${{ inputs.native_per_arch }}
          # GHCR paths must be lowercase and github.repository expands to
          # uppercase 'NVIDIA/...', so the path is hardcoded. Keep in sync with
          # the Makefile, helm values.yaml, and pkg/setup/setup.go.
          IMG: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          DOCKER_IMG: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          DOCKER_BUILD_CONTEXT: ${{ inputs.build_context }}
          IMAGE_TAG: ${{ inputs.image_tag }}

      # An SBOM describes exactly one root filesystem, and this image is a
      # multi-platform index. Attaching one SBOM to the index digest -- what this
      # workflow used to do -- publishes one architecture's package list as if it
      # described both, so an operator scanning the arm64 image reads amd64 data.
      #
      # Resolution uses `docker buildx imagetools`, which is already present for
      # the push above. attest.yml re-resolves independently with crane before it
      # signs, so the two paths do not share a tool or a failure mode.
      - name: Resolve per-platform manifest digests
        id: platforms
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${REF}" --raw)"
          amd64_digest=""
          arm64_digest=""

          for arch in amd64 arm64; do
            digest="$(jq -r --arg a "${arch}" '
              [ .manifests[]?
                | select(.platform.os == "linux" and .platform.architecture == $a)
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest ] | first // empty' <<<"${manifest}")"

            if [[ -z "${digest}" ]]; then
              echo "::error::linux/${arch} is absent from the index; the release lost an architecture"
              exit 1
            fi
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::linux/${arch} digest is malformed: ${digest}"
              exit 1
            fi
            # Equal to the index means this reference is a plain manifest, not an
            # index, so the "per-platform" SBOM would describe the wrong subject.
            if [[ "${digest}" == "${INDEX_DIGEST}" ]]; then
              echo "::error::linux/${arch} resolved to the index digest; ${REF} is not a multi-platform index"
              exit 1
            fi
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
            echo "linux/${arch} -> ${digest}"
            case "${arch}" in
              amd64) amd64_digest="${digest}" ;;
              arm64) arm64_digest="${digest}" ;;
            esac
          done

          # Identical digests mean the index carries one manifest advertised
          # under both architectures, so one SBOM would be published twice under
          # two names -- the same defect this job removes, in a new disguise.
          if [[ "${amd64_digest}" == "${arm64_digest}" ]]; then
            echo "::error::amd64 and arm64 resolved to the same digest; the image is not multi-platform"
            exit 1
          fi

      # syft writes to the path it is given and will not create the directory.
      - name: Create SBOM output directory
        run: mkdir -p sboms

      # SYFT_PLATFORM plus a per-platform digest is what makes these two
      # documents actually differ. Format stays CycloneDX (ADR-074 decision 5);
      # this changes the SBOM's subject, not its format.
      - name: Generate linux/amd64 SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.platforms.outputs.amd64 }}
          format: cyclonedx-json
          output-file: sboms/sbom-linux-amd64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate linux/arm64 SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.platforms.outputs.arm64 }}
          format: cyclonedx-json
          output-file: sboms/sbom-linux-arm64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # Each SBOM is generated against a per-platform MANIFEST digest, not the
      # tag, so syft can only see that platform's root filesystem; the
      # distinctness checks above already reject the case where both digests are
      # the same. What is not covered upstream is a wiring mistake between these
      # two near-identical steps -- the amd64 SBOM generated against the arm64
      # digest, or one digest used twice -- so that is what this checks.
      #
      # Deliberately NOT a comparison of the two package sets. The image is a
      # static Go binary on distroless: both platforms legitimately resolve the
      # same Go module list, so requiring the sets to differ would fail correct
      # releases. Comparing whole-document bytes is worse still -- a CycloneDX
      # document carries a random serialNumber and a timestamp, so two documents
      # are never byte-identical and such a check can never fire.
      - name: Verify each SBOM describes its own platform
        env:
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          amd64_file=sboms/sbom-linux-amd64.cyclonedx.json
          arm64_file=sboms/sbom-linux-arm64.cyclonedx.json

          for f in "${amd64_file}" "${arm64_file}"; do
            [[ -s "${f}" ]] || { echo "::error::${f} is missing or empty"; exit 1; }
            jq -e . "${f}" >/dev/null || { echo "::error::${f} is not valid JSON"; exit 1; }
          done

          # A document referencing the other platform's digest was generated
          # against the wrong subject. Where syft records no digest at all,
          # neither branch fires and the check stays silent rather than failing
          # on an assumption about syft's output shape.
          if grep -q "${ARM64#sha256:}" "${amd64_file}"; then
            echo "::error::the amd64 SBOM references the arm64 manifest digest; the two generation steps are wired to the wrong subjects"
            exit 1
          fi
          if grep -q "${AMD64#sha256:}" "${arm64_file}"; then
            echo "::error::the arm64 SBOM references the amd64 manifest digest; the two generation steps are wired to the wrong subjects"
            exit 1
          fi

          for pair in "amd64:${amd64_file}" "arm64:${arm64_file}"; do
            arch="${pair%%:*}"; file="${pair#*:}"
            count="$(jq '[.components[]?] | length' "${file}")"
            if [[ "${count}" -eq 0 ]]; then
              echo "::error::the ${arch} SBOM lists no components; syft produced an empty inventory"
              exit 1
            fi
            echo "${arch} components: ${count}"
          done

      - name: Upload SBOMs for attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.sbom_artifact }}
          path: sboms/
          retention-days: 7
          if-no-files-found: error
