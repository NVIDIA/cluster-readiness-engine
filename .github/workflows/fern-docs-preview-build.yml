# Workflow 1 of 2 for Fern doc previews.
#
# Collects the fern/ and docs/ sources plus PR metadata from the PR branch and
# uploads them as an artifact. Both directories are needed because
# fern/docs.yml references ../docs/index.yml; omitting docs/ causes
# `fern generate --docs` to fail in the companion workflow. No secrets are
# used here. Like the other CI workflows, it runs on push to the
# pull-request/<number> branches that copy-pr-bot creates once a trustee
# vets the PR, not on a direct pull_request trigger.
#
# The companion workflow (fern-docs-preview-comment.yml) picks up the artifact,
# builds the preview with DOCS_FERN_TOKEN, and posts the PR comment.

name: "Preview Fern Docs: Build"

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    runs-on: linux-amd64-cpu8
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Merge base with main, not `github.event.before` -- see the same step in
      # fern-docs-ci.yml. A push that merges main reports no docs change even
      # when the branch's own commits changed docs, so a PR that edited docs in
      # an earlier push then merged main silently loses its preview.
      - name: Check for docs changes
        id: changes
        run: |
          set -uo pipefail

          if ! git fetch --no-tags origin main; then
            echo "could not fetch main; building the preview rather than guessing"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git merge-base FETCH_HEAD HEAD || true)"
          if [ -z "${base}" ]; then
            echo "no merge base with main; building the preview rather than guessing"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "comparing against merge base ${base}"

          # A failed diff is not "nothing changed".
          if ! changed="$(git diff --name-only "${base}" HEAD)"; then
            echo "could not diff against ${base}; building the preview rather than guessing"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Here-string rather than a pipe -- see the same step in
          # fern-docs-ci.yml. `grep -q` exiting early SIGPIPEs `git diff`, and
          # under `pipefail` that turns a successful match into a failed
          # pipeline, so a real docs change reads as docs=false.
          if grep -qE '^(docs/|fern/)' <<<"${changed}"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: changed-files
    if: github.repository == 'NVIDIA/cluster-readiness-engine' && needs.changed-files.outputs.docs == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p preview-metadata
          echo "${BRANCH_NAME#pull-request/}" > preview-metadata/pr_number
          echo "$BRANCH_NAME" > preview-metadata/head_ref
          git diff --name-only "origin/main...HEAD" -- '*.md' > preview-metadata/changed_md_files 2>/dev/null || true

      # Same script the docs CI and publish workflows run. This step used to
      # be a third inline copy of the extraction, so a fix to the escaping or
      # the staleness handling reached the checks and the published site but
      # not the preview a reviewer actually looks at.
      - name: Freeze registered version content
        run: ./hack/fern-freeze-versions.sh

      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fern-preview
          path: |
            fern/
            docs/
            preview-metadata/
          retention-days: 1
