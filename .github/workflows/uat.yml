name: UAT

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  # Nightly run against main. UAT compares rendered catalog output against
  # golden files, so it can drift without any pull request touching this
  # repository: an upstream image moves, or a catalog default changes shape.
  # The push trigger cannot catch that. A schedule can, and finds it the next
  # morning rather than when someone opens an unrelated pull request.
  #
  # workflow_dispatch above also keeps this alive. GitHub disables scheduled
  # workflows after 60 days of repository inactivity, and a manual run re-arms
  # the schedule.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily; runs on the default branch only
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  uat:
    name: UAT (Kind + KWOK + Tilt)
    runs-on: linux-amd64-cpu32
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          docker system prune -f

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      - name: Install UAT tools
        uses: ./.github/actions/install-uat-tools

      - name: Prep system for Kind
        run: |
          sudo systemctl stop apparmor || true
          sudo systemctl disable apparmor || true
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo iptables -F && sudo iptables -X \
            && sudo iptables -t nat -F && sudo iptables -t nat -X \
            && sudo iptables -t mangle -F && sudo iptables -t mangle -X \
            && sudo iptables -P INPUT ACCEPT \
            && sudo iptables -P FORWARD ACCEPT -w 5 \
            && sudo iptables -P OUTPUT ACCEPT -w 5
          sudo systemctl restart docker

      - name: Create Kind cluster
        run: make setup-test-uat

      - name: Deploy with Tilt (CI mode)
        run: make tilt-uat-ci

      - name: Run UAT tests
        run: make test-uat-run

      - name: Export Kind logs
        if: always()
        run: |
          mkdir -p /tmp/kind-logs
          kind export logs /tmp/kind-logs --name nvcre-test-uat || true

      - name: Collect debug artifacts
        if: failure()
        run: |
          mkdir -p /tmp/debug-artifacts
          kubectl get all --all-namespaces > /tmp/debug-artifacts/all-resources.yaml || true
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' > /tmp/debug-artifacts/events.yaml || true
          kubectl describe nodes > /tmp/debug-artifacts/nodes.txt || true
          kubectl logs -n nvcre -l app.kubernetes.io/name=nvcre --all-containers=true --prefix --tail=500 > /tmp/debug-artifacts/nvcre-logs.txt || true
          df -h > /tmp/debug-artifacts/disk-usage.txt || true

      - name: Upload Kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-kind-logs-${{ github.run_id }}
          path: /tmp/kind-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-debug-artifacts-${{ github.run_id }}
          path: /tmp/debug-artifacts/
          retention-days: 7

      - name: Cleanup Kind cluster
        if: always()
        run: make cleanup-test-uat
