name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create release from (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  helm-publish:
    name: Publish Helm Chart
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.2

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push Helm chart
        run: make helm-push

  build-cli:
    name: Build CLI Binaries
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile ncrectl
        run: make build-ncrectl-cross

      - name: Upload CLI binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncrectl-binaries
          path: bin/ncrectl-*
          retention-days: 7

  create-github-release:
    name: Create GitHub Release
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 10
    needs:
      - helm-publish
      - build-cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download CLI binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ncrectl-binaries
          path: dist/

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        run: |
          cp installer dist/
          cd dist
          sha256sum installer ncrectl-* > checksums.txt
          cat checksums.txt

      # Gate. This runs after the artifacts exist and before the release is
      # created, so a finding fails the job and no release is ever published.
      # Keep it above the Create GitHub Release step; moving it below would
      # turn the gate into an alert about something already public.
      - name: Scan release binaries for malware
        env:
          CLAMAV_IMAGE: clamav/clamav:stable@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        run: |
          set -euo pipefail
          # --entrypoint is required. The image's default entrypoint is /init,
          # a supervisor that starts freshclam and clamd; without the override
          # the arguments below reach that supervisor rather than clamscan.
          # The stable tag ships a virus database, so no freshclam run is needed.
          # clamscan exits 1 when it finds something and 2 on error, so set -e
          # fails the step either way.
          docker run --rm \
            -v "${PWD}/dist:/scan:ro" \
            --entrypoint clamscan \
            "${CLAMAV_IMAGE}" \
            --recursive --infected --suppress-ok-results \
            --max-filesize=512M --max-scansize=2048M \
            /scan

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          body: |
            CRE ${{ steps.tag.outputs.value }}

            The Cluster Readiness Engine (CRE) is a Kubernetes controller that
            certifies GPU clusters before production use. It runs real training
            and communication workloads across topology-aware node groups,
            measures goodput and bandwidth, detects hardware failures, and
            quarantines bad nodes. See the
            [README](https://github.com/NVIDIA/cluster-readiness-engine/blob/${{ steps.tag.outputs.value }}/README.md)
            for the full feature list.

            ## Install ncrectl

            ```bash
            # Requires gh CLI authenticated, or GITHUB_TOKEN set.
            # -p includes pre-releases. Every release is a pre-release
            # until v0.1.0, so keep -p until then.
            curl -sSL https://github.com/NVIDIA/cluster-readiness-engine/releases/latest/download/installer | bash -s -- -p
            ```

            To install this exact version instead of the newest one:

            ```bash
            curl -sSL https://github.com/NVIDIA/cluster-readiness-engine/releases/download/${{ steps.tag.outputs.value }}/installer | bash -s -- -v ${{ steps.tag.outputs.value }}
            ```

            ## Helm Chart

            ```bash
            helm install cluster-readiness-engine \
              oci://ghcr.io/nvidia/cluster-readiness-engine \
              --version ${{ steps.tag.outputs.value }}
            ```

            The controller image for this release is
            `ghcr.io/nvidia/cluster-readiness-engine/manager:${{ steps.tag.outputs.value }}`.

            ## ncrectl CLI

            Download the binary for your platform from the assets below and place it on your `$PATH`.

            | Platform | Binary |
            |---|---|
            | Linux amd64 | `ncrectl-linux-amd64` |
            | Linux arm64 | `ncrectl-linux-arm64` |
            | macOS amd64 | `ncrectl-darwin-amd64` |
            | macOS arm64 (Apple Silicon) | `ncrectl-darwin-arm64` |

            ## Verify your download

            Every asset is listed in `checksums.txt` with its SHA-256 digest.
            After you download an asset, verify it:

            ```bash
            sha256sum --check --ignore-missing checksums.txt
            ```

            ## Third-Party Notices

            Third-party Go module licenses are listed in
            [`THIRD_PARTY_NOTICES.md`](https://github.com/NVIDIA/cluster-readiness-engine/blob/${{ steps.tag.outputs.value }}/THIRD_PARTY_NOTICES.md)
            and attached as a release asset.

            ## Support

            - Ask questions in [GitHub Discussions](https://github.com/NVIDIA/cluster-readiness-engine/discussions).
            - Report bugs with the [issue templates](https://github.com/NVIDIA/cluster-readiness-engine/issues/new/choose).
            - Report security issues per [SECURITY.md](https://github.com/NVIDIA/cluster-readiness-engine/blob/main/SECURITY.md), never through GitHub issues.
          files: |
            dist/ncrectl-*
            dist/installer
            dist/checksums.txt
            THIRD_PARTY_NOTICES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          generate_release_notes: true
