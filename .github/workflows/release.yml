name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create release from (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  helm-publish:
    name: Publish Helm Chart
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # VERSION is passed explicitly instead of trusting `git describe` on
      # the runner's checkout: a shallow or tag-less checkout makes
      # `git describe --tags --always` fall back to a bare commit SHA or a
      # `-N-gSHA` suffix, which would become the chart version (issue #195).
      # helm-push depends on check-clean-version, which rejects anything
      # that is not a clean vX.Y.Z[-prerelease] tag.
      - name: Package and push Helm chart
        run: make helm-push VERSION="${{ steps.tag.outputs.value }}"
        env:
          # GHCR requires lowercase paths but the repo slug is uppercase
          # 'NVIDIA', so the value is hardcoded. Keep in sync with
          # RELEASE.md and pkg/setup/helm.go.
          HELM_OCI_REGISTRY: oci://ghcr.io/nvidia

  build-cli:
    name: Build CLI Binaries
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Stamp the binaries with the tag explicitly instead of trusting
      # `git describe` on the runner's checkout: a shallow or tag-less
      # checkout makes `git describe --tags --always` fall back to a bare
      # commit SHA or a `-N-gSHA` suffix, and that string would ship inside
      # the released binary (issue #195). check-clean-version rejects
      # anything that is not a clean vX.Y.Z[-prerelease] tag, so a malformed
      # workflow_dispatch input fails here instead of mislabeling binaries.
      - name: Cross-compile nvcrectl
        run: |
          make check-clean-version VERSION="${{ steps.tag.outputs.value }}"
          make build-nvcrectl-cross VERSION="${{ steps.tag.outputs.value }}"

      # The runner is linux/amd64, so that binary runs natively. Require the
      # self-reported version to equal the tag exactly — a `-N-gSHA`/`-dirty`
      # suffix or a broken ldflags -> main.version plumbing fails the release
      # here, before any artifact is published (issue #195).
      - name: Verify stamped version matches the tag
        run: |
          tag="${{ steps.tag.outputs.value }}"
          got="$(./bin/nvcrectl-linux-amd64 --version | awk '{print $NF}')"
          echo "tag=${tag} binary-reported=${got}"
          if [[ "${got}" != "${tag}" ]]; then
            echo "ERROR: binary reports version ${got}, expected ${tag}" >&2
            exit 1
          fi

      - name: Upload CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvcrectl-binaries
          path: bin/nvcrectl-*
          retention-days: 7

  create-github-release:
    name: Create GitHub Release
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 10
    needs:
      - helm-publish
      - build-cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nvcrectl-binaries
          path: dist/

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        run: |
          cp installer dist/
          cd dist
          sha256sum installer nvcrectl-* > checksums.txt
          cat checksums.txt

      # Gate. This runs after the artifacts exist and before the release is
      # created, so a finding fails the job and no release is ever published.
      # Keep it above the Create GitHub Release step; moving it below would
      # turn the gate into an alert about something already public.
      - name: Scan release binaries for malware
        env:
          CLAMAV_IMAGE: clamav/clamav:stable@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        run: |
          set -euo pipefail
          # --entrypoint is required. The image's default entrypoint is /init,
          # a supervisor that starts freshclam and clamd; without the override
          # the arguments below reach that supervisor rather than clamscan.
          # The stable tag ships a virus database, so no freshclam run is needed.
          # clamscan exits 1 when it finds something and 2 on error, so set -e
          # fails the step either way.
          docker run --rm \
            -v "${PWD}/dist:/scan:ro" \
            --entrypoint clamscan \
            "${CLAMAV_IMAGE}" \
            --recursive --infected --suppress-ok-results \
            --max-filesize=512M --max-scansize=2048M \
            /scan

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          body: |
            NVCRE ${{ steps.tag.outputs.value }}

            The NVIDIA Cluster Readiness Engine (NVCRE) is a Kubernetes controller that
            certifies GPU clusters before production use. It runs real training
            and communication workloads across topology-aware node groups,
            measures goodput and bandwidth, detects hardware failures, and
            quarantines bad nodes. See the
            [README](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.value }}/README.md)
            for the full feature list.

            ## Install nvcrectl

            Install this release:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.value }}/installer | bash -s -- -v ${{ steps.tag.outputs.value }}
            ```

            Or install the newest stable release (`releases/latest` resolves only to
            stable releases, never pre-releases):

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/installer | bash
            ```

            ## Helm Chart

            ```bash
            helm install nvcre \
              oci://ghcr.io/nvidia/nvcre \
              --version ${{ steps.tag.outputs.value }} \
              --namespace nvcre \
              --create-namespace
            ```

            The controller image for this release is
            `ghcr.io/nvidia/cluster-readiness-engine/manager:${{ steps.tag.outputs.value }}`.

            ## nvcrectl CLI

            Download the binary for your platform from the assets below and place it on your `$PATH`.

            | Platform | Binary |
            |---|---|
            | Linux amd64 | `nvcrectl-linux-amd64` |
            | Linux arm64 | `nvcrectl-linux-arm64` |
            | macOS amd64 | `nvcrectl-darwin-amd64` |
            | macOS arm64 (Apple Silicon) | `nvcrectl-darwin-arm64` |

            ## Verify your download

            Every asset is listed in `checksums.txt` with its SHA-256 digest.
            After you download an asset, verify it:

            ```bash
            sha256sum --check --ignore-missing checksums.txt
            ```

            ## Third-Party Notices

            Third-party Go module licenses are listed in
            [`THIRD_PARTY_NOTICES.md`](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.value }}/THIRD_PARTY_NOTICES.md)
            and attached as a release asset.

            ## Support

            - Ask questions in [GitHub Discussions](https://github.com/${{ github.repository }}/discussions).
            - Report bugs with the [issue templates](https://github.com/${{ github.repository }}/issues/new/choose).
            - Report security issues per [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md), never through GitHub issues.
          files: |
            dist/nvcrectl-*
            dist/installer
            dist/checksums.txt
            THIRD_PARTY_NOTICES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          generate_release_notes: true

      # Post-publish gate (issues #194, #195): download the just-published
      # assets over the same channel users take and verify them. On a public
      # repository that is the unauthenticated browser URL
      # (releases/download/<tag>/<asset>); v0.1.0-rc.7 users piped the 404
      # "Not Found" page that URL serves on non-public repositories into
      # bash (issue #194), and only an unauthenticated download can catch
      # that. While the repository is not public the gate falls back to the
      # authenticated channel so a release cut before a visibility flip
      # still verifies instead of failing on the 404.
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.value }}"
          rm -rf verify-release && mkdir verify-release
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          echo "repository visibility: ${visibility}"
          if [[ "${visibility}" == "public" ]]; then
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
            for asset in installer checksums.txt nvcrectl-linux-amd64; do
              curl -fsSL -o "verify-release/${asset}" "${base}/${asset}"
            done
          else
            echo "NOTICE: repository is not public; verifying over the" \
              "authenticated channel. The public download URLs in the" \
              "release notes will not work until the repository is public."
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern installer --pattern checksums.txt --pattern nvcrectl-linux-amd64 \
              --dir verify-release
          fi
          # The installer must be a shell script, not an HTML/text error page.
          [[ "$(head -c 2 verify-release/installer)" == '#!' ]]
          bash -n verify-release/installer
          # Every downloaded asset must match its published checksum.
          (cd verify-release && sha256sum --check --ignore-missing checksums.txt)
          # The published binary must self-report exactly the released tag.
          chmod +x verify-release/nvcrectl-linux-amd64
          got="$(./verify-release/nvcrectl-linux-amd64 --version | awk '{print $NF}')"
          echo "tag=${tag} binary-reported=${got}"
          [[ "${got}" == "${tag}" ]]
