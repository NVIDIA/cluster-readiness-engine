name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create release from (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release builds the image itself rather than racing publish.yml for it.
  # Previously both fired on a tag push: this workflow created a GitHub Release
  # naming an image tag it had never resolved, could not confirm existed, and had
  # no digest for -- so the notes asserted something the release had not checked,
  # and #270's verification gate would have had nothing to verify against.
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 5
    permissions: {}
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          case "${INPUT_TAG}" in
            *$'\n'*|*$'\r'*)
              echo "::error::the dispatch tag input contains a newline or carriage return"
              exit 1
              ;;
          esac

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/tags/${INPUT_TAG}" ]]; then
              echo "::error::dispatched with tag=${INPUT_TAG} but running from ${GITHUB_REF}. Re-dispatch with --ref ${INPUT_TAG} so signatures carry the release identity."
              exit 1
            fi
            value="${INPUT_TAG}"
          else
            value="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::refusing to release from a tag that is not vMAJOR.MINOR.PATCH[-prerelease]: ${value}"
            exit 1
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build release image
    needs: [release-tag]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_tag: ${{ needs.release-tag.outputs.value }}

  attest-image-index:
    name: Attest image index (signature + provenance)
    needs: [release-tag, build-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/attest.yml
    with:
      subject_kind: image
      subject_name: ${{ needs.build-image.outputs.image_name }}
      subject_tag: ${{ needs.release-tag.outputs.value }}
      expected_digest: ${{ needs.build-image.outputs.index_digest }}

  attest-image-amd64-sbom:
    name: Attest image linux/amd64 SBOM
    needs: [release-tag, build-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/attest.yml
    with:
      subject_kind: image
      subject_name: ${{ needs.build-image.outputs.image_name }}
      subject_tag: ${{ needs.release-tag.outputs.value }}
      platform: linux/amd64
      expected_digest: ${{ needs.build-image.outputs.amd64_digest }}
      artifact_name: ${{ needs.build-image.outputs.sbom_artifact }}
      predicate_name: sbom-linux-amd64.cyclonedx.json
      predicate_type: cyclonedx
      emit_provenance: false

  attest-image-arm64-sbom:
    name: Attest image linux/arm64 SBOM
    needs: [release-tag, build-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/attest.yml
    with:
      subject_kind: image
      subject_name: ${{ needs.build-image.outputs.image_name }}
      subject_tag: ${{ needs.release-tag.outputs.value }}
      platform: linux/arm64
      expected_digest: ${{ needs.build-image.outputs.arm64_digest }}
      artifact_name: ${{ needs.build-image.outputs.sbom_artifact }}
      predicate_name: sbom-linux-arm64.cyclonedx.json
      predicate_type: cyclonedx
      emit_provenance: false

  image-attested:
    name: Confirm the release image was signed
    needs: [build-image, attest-image-index, attest-image-amd64-sbom, attest-image-arm64-sbom]
    if: always() && github.repository == 'NVIDIA/cluster-readiness-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every image attestation to have succeeded
        env:
          BUILD: ${{ needs.build-image.result }}
          INDEX: ${{ needs.attest-image-index.result }}
          AMD64: ${{ needs.attest-image-amd64-sbom.result }}
          ARM64: ${{ needs.attest-image-arm64-sbom.result }}
        run: |
          set -euo pipefail
          echo "build=${BUILD} index=${INDEX} amd64=${AMD64} arm64=${ARM64}"
          if [[ "${BUILD}" != "success" ]]; then
            echo "::error::the release image build did not succeed (${BUILD}); no image was published."
            exit 1
          fi
          failed=0
          for pair in "index:${INDEX}" "amd64-sbom:${AMD64}" "arm64-sbom:${ARM64}"; do
            name="${pair%%:*}"; result="${pair#*:}"
            case "${result}" in
              success) ;;
              skipped)
                echo "::error::${name} attestation was SKIPPED. The release image is published and unsigned; a skipped job does not fail its caller."
                failed=1
                ;;
              *)
                echo "::error::${name} attestation did not succeed (${result}). Treat the published image as unsigned."
                failed=1
                ;;
            esac
          done
          [[ "${failed}" -eq 0 ]] || exit 1
          echo "release image fully attested"

  # Waits for the image to exist AND be signed. The chart's values.yaml pins
  # `manager:<tag>`, and `helm push` is not something the workflow can take
  # back: publishing the chart first would put a chart referencing a tag that
  # does not exist yet -- or, if the build then failed, never will -- into the
  # OCI registry that Flux, Argo CD Image Updater and Renovate actually watch.
  # A cluster reconciling in that window gets ImagePullBackOff and no GitHub
  # Release to explain why. Gating create-github-release is not enough, because
  # GitOps automation does not wait for the GitHub Release.
  helm-publish:
    name: Publish Helm Chart
    needs: [release-tag, image-attested]
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      # GHCR requires lowercase; `helm push <chart>.tgz oci://ghcr.io/nvidia`
      # lands the chart at <registry>/<chart-name>.
      chart_name: ghcr.io/nvidia/cluster-readiness-engine
      chart_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GHCR_USER}" --password-stdin

      # VERSION is passed explicitly instead of trusting `git describe` on
      # the runner's checkout: a shallow or tag-less checkout makes
      # `git describe --tags --always` fall back to a bare commit SHA or a
      # `-N-gSHA` suffix, which would become the chart version (issue #195).
      # helm-push depends on check-clean-version, which rejects anything
      # that is not a clean vX.Y.Z[-prerelease] tag.
      - name: Package and push Helm chart
        id: push
        run: |
          set -euo pipefail
          make helm-push VERSION="${CHART_TAG}" CHART_DIGEST_FILE=chart-digest.txt
          digest="$(cat chart-digest.txt)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::chart digest is malformed: ${digest}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Helm chart published"
            echo
            echo '```'
            echo "oci://${CHART_NAME}:${CHART_TAG}"
            echo "${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          # GHCR requires lowercase paths but the repo slug is uppercase
          # 'NVIDIA', so the value is hardcoded. Keep in sync with
          # RELEASE.md and pkg/setup/helm.go.
          HELM_OCI_REGISTRY: oci://ghcr.io/nvidia
          # Through the environment rather than `${{ }}` inside the script, so a
          # value is data and not code -- the rule attest.yml states and the tag
          # step above already follows.
          CHART_NAME: ghcr.io/nvidia/cluster-readiness-engine
          CHART_TAG: ${{ needs.release-tag.outputs.value }}

  # The chart is the highest-leverage artifact in the release: it carries the
  # CRDs and the manager ClusterRole, so a tampered chart grants itself whatever
  # RBAC it likes. Signed by digest, never by the tag the release notes quote.
  #
  # `oci-artifact` rather than `image`: a Helm chart is a plain OCI artifact
  # (config `application/vnd.cncf.helm.config.v1+json`), and cosign is
  # digest-addressed and media-type agnostic, so signing works identically. Note
  # this signature does NOT satisfy `helm install --verify`, which checks a PGP
  # `.prov` file and is unrelated to Sigstore; verification is a client-side
  # `cosign verify` before install.
  attest-chart:
    name: Attest Helm chart
    needs: [release-tag, helm-publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/attest.yml
    with:
      subject_kind: oci-artifact
      subject_name: ${{ needs.helm-publish.outputs.chart_name }}
      subject_tag: ${{ needs.release-tag.outputs.value }}
      expected_digest: ${{ needs.helm-publish.outputs.chart_digest }}

  # A skipped job does not fail its caller, so without this a broken gate inside
  # attest.yml would publish an unsigned chart under a green release.
  chart-attested:
    name: Confirm the chart was signed
    needs: [helm-publish, attest-chart]
    if: always() && github.repository == 'NVIDIA/cluster-readiness-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the chart attestation to have succeeded
        env:
          PUBLISH: ${{ needs.helm-publish.result }}
          ATTEST: ${{ needs.attest-chart.result }}
        run: |
          set -euo pipefail
          echo "helm-publish=${PUBLISH} attest-chart=${ATTEST}"
          if [[ "${PUBLISH}" != "success" ]]; then
            echo "::error::the chart publish job did not succeed (${PUBLISH}); no chart was published."
            exit 1
          fi
          case "${ATTEST}" in
            success) echo "chart signed and attested" ;;
            skipped)
              echo "::error::the chart attestation was SKIPPED. The chart is published and unsigned; a skipped job does not fail its caller, so this would otherwise have passed silently."
              exit 1
              ;;
            *)
              echo "::error::the chart attestation did not succeed (${ATTEST}). The chart is published; treat it as unsigned until this is resolved."
              exit 1
              ;;
          esac

  build-cli:
    name: Build CLI Binaries
    needs: [release-tag]
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.map }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true


      # Stamp the binaries with the tag explicitly instead of trusting
      # `git describe` on the runner's checkout: a shallow or tag-less
      # checkout makes `git describe --tags --always` fall back to a bare
      # commit SHA or a `-N-gSHA` suffix, and that string would ship inside
      # the released binary (issue #195). check-clean-version rejects
      # anything that is not a clean vX.Y.Z[-prerelease] tag, so a malformed
      # workflow_dispatch input fails here instead of mislabeling binaries.
      # Installed from the upstream anchore/syft release and checked against
      # that release's own checksums, rather than through a setup action. Same
      # reasoning as crane in attest.yml: fewer third parties in the release
      # path, and the binary is verified on arrival.
      - name: Install syft
        id: syft
        env:
          SYFT_VERSION: v1.51.1
          # Pinned here, in this repository, under review. Checking the download
          # against a checksums file fetched from the same release would only
          # prove the two upstream files agree with each other -- an attacker
          # who can replace one can replace both. This digest is an anchor they
          # cannot reach without a commit here.
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          base="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          tarball="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${tarball}" "${base}/${tarball}"
          echo "${SYFT_SHA256}  ${tmp}/${tarball}" | sha256sum --check --strict -
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" syft
          install -m 0755 "${tmp}/syft" "${RUNNER_TEMP}/syft"
          "${RUNNER_TEMP}/syft" version
          echo "path=${RUNNER_TEMP}/syft" >> "$GITHUB_OUTPUT"

      - name: Cross-compile nvcrectl
        env:
          TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          set -euo pipefail
          make check-clean-version VERSION="${TAG}"
          make build-nvcrectl-cross VERSION="${TAG}"

      # The runner is linux/amd64, so that binary runs natively. Require the
      # self-reported version to equal the tag exactly — a `-N-gSHA`/`-dirty`
      # suffix or a broken ldflags -> main.version plumbing fails the release
      # here, before any artifact is published (issue #195).
      - name: Verify stamped version matches the tag
        env:
          TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          tag="${TAG}"
          got="$(./bin/nvcrectl-linux-amd64 --version | awk '{print $NF}')"
          echo "tag=${tag} binary-reported=${got}"
          if [[ "${got}" != "${tag}" ]]; then
            echo "ERROR: binary reports version ${got}, expected ${tag}" >&2
            exit 1
          fi

      # Everything that will be signed is staged into one directory and uploaded
      # once. The signing jobs each download this artifact and sign one member
      # of it, so the bytes they sign are the bytes published -- not a rebuild.
      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp bin/nvcrectl-* release-assets/
          cp installer release-assets/
          # Published as a release asset, so it is covered by the same contract
          # as everything else: a bundle and a checksum entry.
          cp THIRD_PARTY_NOTICES.md release-assets/
          ls -la release-assets/

      # syft reads the Go build info embedded in each binary, so the SBOM lists
      # the module set that binary was actually built from. `installer` is a
      # shell script and gets no SBOM -- there is nothing to inventory.
      - name: Generate per-binary SBOMs
        run: |
          set -euo pipefail
          for f in release-assets/nvcrectl-*; do
            [[ "${f}" == *.cyclonedx.json ]] && continue
            name="$(basename "${f}")"
            "${SYFT}" scan "file:${f}" -o cyclonedx-json="release-assets/${name}.cyclonedx.json" -q
            count="$(jq '[.components[]?] | length' "release-assets/${name}.cyclonedx.json")"
            if [[ "${count}" -eq 0 ]]; then
              echo "::error::the SBOM for ${name} lists no components; syft inventoried nothing"
              exit 1
            fi
            echo "${name}: ${count} components"
          done
        env:
          SYFT: ${{ steps.syft.outputs.path }}

      # The caller measures every asset here and attest.yml re-measures the one
      # it is signing, failing on mismatch. Handing over a digest the signer
      # does not recompute would make that comparison meaningless.
      - name: Compute asset digests
        id: digests
        run: |
          set -euo pipefail
          map="$(cd release-assets && sha256sum -- * \
            | jq -Rn '[inputs | split("  ") | {(.[1]): ("sha256:" + .[0])}] | add' -c)"
          echo "${map}" | jq .
          # Every matrix subject must be present, or a leg would be handed an
          # empty digest and attest.yml would reject it late instead of here.
          for want in nvcrectl-linux-amd64 nvcrectl-linux-arm64 \
                      nvcrectl-darwin-amd64 nvcrectl-darwin-arm64 installer \
                      THIRD_PARTY_NOTICES.md \
                      nvcrectl-linux-amd64.cyclonedx.json nvcrectl-linux-arm64.cyclonedx.json \
                      nvcrectl-darwin-amd64.cyclonedx.json nvcrectl-darwin-arm64.cyclonedx.json; do
            jq -e --arg k "${want}" 'has($k)' <<<"${map}" >/dev/null \
              || { echo "::error::${want} is missing from the digest map"; exit 1; }
          done
          echo "map=${map}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7

  # Nine published assets each need a verifying bundle: the four binaries, the
  # installer, and the four SBOMs. attest.yml signs one subject per call, so
  # this is a matrix over subjects rather than nine near-identical jobs.
  #
  # The binaries carry their SBOM as a predicate, which binds the SBOM to the
  # binary. The SBOM files are ALSO signed in their own right, because a user
  # downloads the .cyclonedx.json as a loose asset and it is the document a
  # security team feeds to a scanner -- an unsigned SBOM beside a signed binary
  # is the one unsigned link left.
  attest-binaries:
    name: Attest ${{ matrix.subject }}
    needs: [build-cli]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # Nine legs, and the four binary legs sign twice, so an unbounded fan-out
      # is ~13 near-simultaneous calls to public-good Fulcio and Rekor from one
      # caller. attest.yml retries on a fixed 5s/10s backoff with no jitter, so
      # legs that fail together retry together. The gate requires every leg, so
      # one correlated blip fails the whole release. Three at a time keeps the
      # burst small without meaningfully lengthening the run.
      max-parallel: 3
      matrix:
        include:
          - subject: nvcrectl-linux-amd64
            predicate: nvcrectl-linux-amd64.cyclonedx.json
          - subject: nvcrectl-linux-arm64
            predicate: nvcrectl-linux-arm64.cyclonedx.json
          - subject: nvcrectl-darwin-amd64
            predicate: nvcrectl-darwin-amd64.cyclonedx.json
          - subject: nvcrectl-darwin-arm64
            predicate: nvcrectl-darwin-arm64.cyclonedx.json
          # No SBOM: a shell script has nothing to inventory.
          - subject: installer
            predicate: ''
          - subject: THIRD_PARTY_NOTICES.md
            predicate: ''
          # The SBOMs signed as artifacts in their own right.
          - subject: nvcrectl-linux-amd64.cyclonedx.json
            predicate: ''
          - subject: nvcrectl-linux-arm64.cyclonedx.json
            predicate: ''
          - subject: nvcrectl-darwin-amd64.cyclonedx.json
            predicate: ''
          - subject: nvcrectl-darwin-arm64.cyclonedx.json
            predicate: ''
    uses: ./.github/workflows/attest.yml
    with:
      subject_kind: blob
      subject_name: ${{ matrix.subject }}
      expected_digest: ${{ fromJSON(needs.build-cli.outputs.digests)[matrix.subject] }}
      artifact_name: release-assets
      predicate_name: ${{ matrix.predicate }}
      predicate_type: ${{ matrix.predicate != '' && 'cyclonedx' || '' }}

  # Without this, a skipped attest-binaries matrix would skip
  # create-github-release too -- safe, but silent: the run goes green with no
  # release and no stated reason. This turns that into a named failure.
  binaries-attested:
    name: Confirm the binaries were signed
    needs: [build-cli, attest-binaries]
    if: always() && github.repository == 'NVIDIA/cluster-readiness-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every binary attestation to have succeeded
        env:
          BUILD: ${{ needs.build-cli.result }}
          ATTEST: ${{ needs.attest-binaries.result }}
        run: |
          set -euo pipefail
          echo "build-cli=${BUILD} attest-binaries=${ATTEST}"
          if [[ "${BUILD}" != "success" ]]; then
            echo "::error::the CLI build did not succeed (${BUILD}); nothing was produced to sign."
            exit 1
          fi
          case "${ATTEST}" in
            success) echo "all binary and SBOM attestations succeeded" ;;
            skipped)
              echo "::error::binary attestation was SKIPPED. A skipped job does not fail its caller, so the release would simply not appear with no reason given."
              exit 1
              ;;
            *)
              echo "::error::binary attestation did not succeed (${ATTEST}). No release will be published; the assets are unsigned."
              exit 1
              ;;
          esac

  create-github-release:
    name: Create GitHub Release
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 10
    needs:
      - release-tag
      - build-image
      - image-attested
      - helm-publish
      - chart-attested
      - build-cli
      - binaries-attested
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/


      # Every bundle the matrix produced, flattened next to the assets it
      # signs. Loose files, not an archive: a user should be able to curl one
      # binary and one bundle and verify with a single command.
      - name: Download signature bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist/

      # A bundle per published asset, or the release ships something users are
      # told to verify and cannot. `installer` is copied by the build job now,
      # so the whole set arrives in one artifact.
      - name: Require a bundle for every asset
        run: |
          set -euo pipefail
          cd dist
          missing=0
          for f in nvcrectl-linux-amd64 nvcrectl-linux-arm64 \
                   nvcrectl-darwin-amd64 nvcrectl-darwin-arm64 installer \
                   THIRD_PARTY_NOTICES.md \
                   nvcrectl-linux-amd64.cyclonedx.json nvcrectl-linux-arm64.cyclonedx.json \
                   nvcrectl-darwin-amd64.cyclonedx.json nvcrectl-darwin-arm64.cyclonedx.json; do
            [[ -s "${f}" ]] || { echo "::error::asset ${f} is missing"; missing=1; }
            [[ -s "${f}.sigstore.json" ]] || { echo "::error::${f} has no signature bundle"; missing=1; }
          done
          # The bundle binding each SBOM to its binary. Currently redundant --
          # attest.yml fails the leg if that second attest-blob call fails -- but
          # a future refactor that decoupled the two calls would otherwise ship a
          # binary and an SBOM with nothing tying them together.
          for b in nvcrectl-linux-amd64 nvcrectl-linux-arm64 \
                   nvcrectl-darwin-amd64 nvcrectl-darwin-arm64; do
            [[ -s "${b}.cyclonedx.sigstore.json" ]] \
              || { echo "::error::${b} has no bundle binding its SBOM to it"; missing=1; }
          done
          [[ "${missing}" -eq 0 ]] || exit 1
          ls -la

      # The notes now state digests as fact. If any is missing or malformed the
      # release would advertise a broken or empty reference, so fail here rather
      # than publish one.
      - name: Require every advertised digest
        env:
          INDEX: ${{ needs.build-image.outputs.index_digest }}
          AMD64: ${{ needs.build-image.outputs.amd64_digest }}
          ARM64: ${{ needs.build-image.outputs.arm64_digest }}
          CHART: ${{ needs.helm-publish.outputs.chart_digest }}
        run: |
          set -euo pipefail
          for pair in "image index:${INDEX}" "image amd64:${AMD64}" \
                      "image arm64:${ARM64}" "helm chart:${CHART}"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [[ ! "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the ${name} digest is missing or malformed: '${value}'"
              exit 1
            fi
            echo "${name} -> ${value}"
          done

      # checksums.txt stays -- it is cheap -- but it now covers every published
      # asset rather than only the binaries. It is not the verification story:
      # it is served from the same origin as the artifacts and is itself
      # unsigned, which is why the bundles exist.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt.tmp
          mv checksums.txt.tmp checksums.txt
          cat checksums.txt

      # Gate. This runs after the artifacts exist and before the release is
      # created, so a finding fails the job and no release is ever published.
      # Keep it above the Create GitHub Release step; moving it below would
      # turn the gate into an alert about something already public.
      - name: Scan release binaries for malware
        env:
          CLAMAV_IMAGE: clamav/clamav:stable@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        run: |
          set -euo pipefail
          # --entrypoint is required. The image's default entrypoint is /init,
          # a supervisor that starts freshclam and clamd; without the override
          # the arguments below reach that supervisor rather than clamscan.
          # The stable tag ships a virus database, so no freshclam run is needed.
          # clamscan exits 1 when it finds something and 2 on error, so set -e
          # fails the step either way.
          docker run --rm \
            -v "${PWD}/dist:/scan:ro" \
            --entrypoint clamscan \
            "${CLAMAV_IMAGE}" \
            --recursive --infected --suppress-ok-results \
            --max-filesize=512M --max-scansize=2048M \
            /scan

      # action-gh-release honours `draft:` only when it CREATES the release. For
      # a tag that already has one it passes `draft: existingRelease.draft` and
      # ignores the input, so re-running against an already-published tag would
      # upload freshly built, unverified assets straight into a live release --
      # where they are public immediately and the gate has nothing left to
      # withhold. This must therefore run BEFORE the upload, not after it.
      - name: Require any existing release to be a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          set -euo pipefail

          # Only a confirmed "not found" means no release exists. An API,
          # auth or permission failure must not read as absent: that would let
          # an already-published release take the upload, which is the one
          # outcome this guard exists to stop. Everything else fails closed.
          state=""
          for attempt in 1 2 3; do
            if out="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --json isDraft --jq .isDraft 2>&1)"; then
              state="${out}"
              break
            fi
            if grep -qiE "release not found|could not find|HTTP 404" <<<"${out}"; then
              state="absent"
              break
            fi
            echo "attempt ${attempt}: could not read release state: ${out}"
            sleep $((attempt * 5))
          done

          case "${state}" in
            absent) echo "no release exists for ${TAG} yet" ;;
            true)   echo "release ${TAG} exists and is a draft" ;;
            false)
              echo "::error::release ${TAG} is already published; refusing to upload assets the gate has not verified. Cut the next patch version instead (see RELEASE.md)."
              exit 1
              ;;
            *)
              echo "::error::could not determine the release state for ${TAG} after 3 attempts; refusing to upload rather than assume no release exists."
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-tag.outputs.value }}
          name: Release ${{ needs.release-tag.outputs.value }}
          body: |
            NVCRE ${{ needs.release-tag.outputs.value }}

            The NVIDIA Cluster Readiness Engine (NVCRE) is a Kubernetes controller that certifies GPU clusters before production use. It runs real training and communication workloads across topology-aware node groups, measures goodput and bandwidth, detects hardware failures, and reports every failed node with a reason. See the [README](https://github.com/${{ github.repository }}/blob/${{ needs.release-tag.outputs.value }}/README.md) for the full feature list.

            ## Install nvcrectl

            The installer is signed. Download it with its bundle, verify, then run — piping it into a shell executes it before anything has checked it.

            ```bash
            REL=https://github.com/${{ github.repository }}/releases/download/${{ needs.release-tag.outputs.value }}

            curl -fsSLO "${REL}/installer"
            curl -fsSLO "${REL}/installer.sigstore.json"

            cosign verify-blob-attestation \
              --bundle installer.sigstore.json \
              --type https://slsa.dev/provenance/v1 \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              installer

            bash installer -v ${{ needs.release-tag.outputs.value }}
            ```

            <details>
            <summary>Without cosign</summary>

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ needs.release-tag.outputs.value }}/installer | bash -s -- -v ${{ needs.release-tag.outputs.value }}
            ```

            This runs the installer before anything verifies it. TLS proves you reached GitHub; it proves nothing about the asset if the release itself was tampered with. Use it only where installing cosign first is genuinely impractical.

            ```bash
            # newest stable release; `releases/latest` never resolves to a pre-release
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/installer | bash
            ```

            </details>

            ## Helm Chart

            This release's chart is published at digest `${{ needs.helm-publish.outputs.chart_digest }}`. The signature covers that digest; the version tag is mutable, so verify and install the **same digest** rather than verifying a digest and installing a tag.

            ```bash
            CHART=ghcr.io/nvidia/cluster-readiness-engine
            DIGEST=${{ needs.helm-publish.outputs.chart_digest }}

            # 1. Verify the chart. Requires cosign; the package is public, so no login is needed.
            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${CHART}@${DIGEST}"

            # 2. Pull that exact digest, then install the file you just verified.
            helm pull "oci://${CHART}@${DIGEST}"
            helm install nvcre ./cluster-readiness-engine@${DIGEST/:/-}.tgz \
              --namespace nvcre --create-namespace
            ```

            Installing with `--version ${{ needs.release-tag.outputs.value }}` instead resolves the tag at install time, which is not provably the digest you verified.

            `helm install --verify` does **not** check this signature. That flag looks for a PGP `.prov` file, a mechanism unrelated to Sigstore, and we publish no `.prov` files.

            ## Controller image

            A different artifact from the chart, verified separately. The release built and signed these exact digests:

            | Subject | Digest |
            |---|---|
            | index (multi-platform) | `${{ needs.build-image.outputs.index_digest }}` |
            | `linux/amd64` | `${{ needs.build-image.outputs.amd64_digest }}` |
            | `linux/arm64` | `${{ needs.build-image.outputs.arm64_digest }}` |

            The index carries the signature and the SLSA provenance; each platform digest carries a signature and its own CycloneDX SBOM. Pin the index digest rather than the tag:

            ```bash
            IMAGE=${{ needs.build-image.outputs.image_name }}
            INDEX=${{ needs.build-image.outputs.index_digest }}

            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}@${INDEX}"
            ```

            ## nvcrectl CLI

            Download the binary for your platform from the assets below and place it on your `$PATH`.

            | Platform | Binary |
            |---|---|
            | Linux amd64 | `nvcrectl-linux-amd64` |
            | Linux arm64 | `nvcrectl-linux-arm64` |
            | macOS amd64 | `nvcrectl-darwin-amd64` |
            | macOS arm64 (Apple Silicon) | `nvcrectl-darwin-arm64` |

            ## Verify your download

            Every asset ships with a Sigstore bundle, `<asset>.sigstore.json`, carrying a SLSA Build Provenance v1 statement. Verify the artifact itself, not a checksum served from the same place as the artifact:

            ```bash
            REL=https://github.com/${{ github.repository }}/releases/download/${{ needs.release-tag.outputs.value }}
            ASSET=nvcrectl-linux-amd64   # or installer, or any published asset

            # The bundle is a separate asset; fetch both.
            curl -fsSLO "${REL}/${ASSET}"
            curl -fsSLO "${REL}/${ASSET}.sigstore.json"

            cosign verify-blob-attestation \
              --bundle "${ASSET}.sigstore.json" \
              --type https://slsa.dev/provenance/v1 \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ASSET}"
            ```

            Each `nvcrectl-*` binary also ships a CycloneDX SBOM, `<binary>.cyclonedx.json`. There are **two** bundles involving it, one segment apart in name, and they prove different things:

            | Bundle | Proves |
            |---|---|
            | `<binary>.cyclonedx.json.sigstore.json` | the SBOM **file** is the one we published and was not altered |
            | `<binary>.cyclonedx.sigstore.json` | the SBOM **describes that binary** — it is bound to the binary as its subject |

            Before feeding an SBOM to a scanner, check **both**. The binding proves an SBOM describes the binary; it says nothing about the bytes of the file on your disk, which is a separate download.

            ```bash
            cosign verify-blob-attestation \
              --bundle "${ASSET}.cyclonedx.sigstore.json" \
              --type cyclonedx \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ASSET}"

            # 2. the SBOM file you downloaded is the one that was published
            cosign verify-blob-attestation \
              --bundle "${ASSET}.cyclonedx.json.sigstore.json" \
              --type https://slsa.dev/provenance/v1 \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/attest.yml@refs/tags/${{ needs.release-tag.outputs.value }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ASSET}.cyclonedx.json"
            ```

            Only the first would let a tampered local `.cyclonedx.json` reach your scanner: the binding attestation carries its own copy of the SBOM and never looks at your file.

            `checksums.txt` is still published and still works, but it is not the verification story: it is served from the same origin as the assets and is itself unsigned, so it detects corruption rather than tampering.

            ```bash
            sha256sum --check --ignore-missing checksums.txt
            ```

            ## Third-Party Notices

            Third-party Go module licenses are listed in [`THIRD_PARTY_NOTICES.md`](https://github.com/${{ github.repository }}/blob/${{ needs.release-tag.outputs.value }}/THIRD_PARTY_NOTICES.md) and attached as a release asset.

            ## Support

            - Ask questions in [GitHub Discussions](https://github.com/${{ github.repository }}/discussions).
            - Report bugs with the [issue templates](https://github.com/${{ github.repository }}/issues/new/choose).
            - Report security issues per [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md), never through GitHub issues.
          files: |
            dist/nvcrectl-*
            dist/installer
            dist/installer.sigstore.json
            dist/THIRD_PARTY_NOTICES.md
            dist/THIRD_PARTY_NOTICES.md.sigstore.json
            dist/checksums.txt
          # Created as a draft. The gate below verifies every published
          # artifact and only then flips it public, so a release whose signing
          # silently no-opped never becomes visible. Registry artifacts (image,
          # chart) are necessarily already pushed by this point; the gate
          # verifies those too and fails the run if they do not hold.
          draft: true
          prerelease: ${{ contains(needs.release-tag.outputs.value, '-') }}
          generate_release_notes: true

  # Verifies everything the release advertises, then makes it public. Producing
  # attestations without checking them means the first party to discover they
  # are broken is a user: every signing step in this pipeline could no-op --
  # wrong permissions, an expired OIDC token, a renamed cosign flag -- and the
  # release would still have gone out green.
  #
      # The pre-upload guard proves no published release existed; this proves
      # the action actually created a draft, which is a separate claim and the
      # one the gate's control depends on.
      - name: Confirm the release is a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-tag.outputs.value }}
        run: |
          set -euo pipefail
          state="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [[ "${state}" != "true" ]]; then
            echo "::error::release ${TAG} is not a draft after creation; the gate cannot withhold it"
            exit 1
          fi
          echo "release ${TAG} is a draft; the gate controls when it becomes visible"

  # The release is a draft until this passes.
  verify-release:
    name: Verify the published release
    needs: [release-tag, build-image, helm-publish, create-github-release]
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      id-token: none
    env:
      COSIGN_VERSION: v3.1.3
      TAG: ${{ needs.release-tag.outputs.value }}
      IMAGE: ${{ needs.build-image.outputs.image_name }}
      INDEX: ${{ needs.build-image.outputs.index_digest }}
      AMD64: ${{ needs.build-image.outputs.amd64_digest }}
      ARM64: ${{ needs.build-image.outputs.arm64_digest }}
      CHART_NAME: ${{ needs.helm-publish.outputs.chart_name }}
      CHART_DIGEST: ${{ needs.helm-publish.outputs.chart_digest }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The identity every check below pins. Exact, never a regexp: a pattern
      # naming no workflow and no ref also accepts a branch build, which is how
      # the pre-epic verification command accepted a main image as a release.
      - name: Build the identity to pin
        id: identity
        run: |
          set -euo pipefail
          value="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/attest.yml@refs/tags/${TAG}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "pinning ${value}"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Every network call in this job is retried. `gh` retries release
          # asset *uploads* and its attestation calls, but not `release
          # download`, `release view/edit` or `api`, so a single 502 would fail
          # the gate on a release that is fine. Defined per step because each
          # `run:` block is its own shell.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          mkdir -p verify && cd verify
          # Drafts are not reachable unauthenticated, so the gate downloads over
          # the authenticated channel. The public channel is re-checked after
          # the release is made visible.
          retry gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir . --clobber
          ls -la

      # The expected set below is static and reviewed on change. Deriving it
      # from the release's own inventory would mean deleting an asset makes the
      # check verify the survivors and report clean.
      - name: Verify every release asset and its bundle
        id: assets
        env:
          IDENTITY: ${{ steps.identity.outputs.value }}
        run: |
          set -euo pipefail
          cd verify
          failed=0

          # cosign has no native retry and Rekor/GHCR are real network
          # dependencies. attest.yml retries its signing calls for the same
          # reason; a single blip must not fail a correct release.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          BINARIES="nvcrectl-linux-amd64 nvcrectl-linux-arm64 nvcrectl-darwin-amd64 nvcrectl-darwin-arm64"
          ASSETS="${BINARIES} installer THIRD_PARTY_NOTICES.md"
          for b in ${BINARIES}; do ASSETS="${ASSETS} ${b}.cyclonedx.json"; done

          for a in ${ASSETS}; do
            if [[ ! -s "${a}" ]]; then
              echo "::error::asset ${a} is missing from the release"; failed=1; continue
            fi
            if [[ ! -s "${a}.sigstore.json" ]]; then
              echo "::error::asset ${a} has no signature bundle"; failed=1; continue
            fi
            if retry cosign verify-blob-attestation \
                 --bundle "${a}.sigstore.json" \
                 --type https://slsa.dev/provenance/v1 \
                 --certificate-identity "${IDENTITY}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" \
                 "${a}" >>"../verify.log" 2>&1; then
              echo "ok   ${a}"
            else
              echo "::error::${a} does not verify against ${IDENTITY} after 3 attempts"; failed=1
            fi
          done

          # The bundle binding each SBOM to its binary. Distinct from the SBOM
          # file's own provenance above: this one proves the document describes
          # that binary rather than merely being unaltered.
          for b in ${BINARIES}; do
            bundle="${b}.cyclonedx.sigstore.json"
            if [[ ! -s "${bundle}" ]]; then
              echo "::error::${b} has no bundle binding its SBOM to it"; failed=1; continue
            fi
            if retry cosign verify-blob-attestation \
                 --bundle "${bundle}" --type cyclonedx \
                 --certificate-identity "${IDENTITY}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" \
                 "${b}" >>"../verify.log" 2>&1; then
              echo "ok   ${b} <- its SBOM"
            else
              echo "::error::${b}'s SBOM binding does not verify after 3 attempts"; failed=1
            fi
          done

          # checksums.txt intentionally carries no bundle, so it is absent from
          # the loop above. The step this gate replaced did check it, and the
          # release notes still hand users this exact command, so it is checked
          # here rather than silently dropped.
          if [[ ! -s checksums.txt ]]; then
            echo "::error::checksums.txt is missing from the release"; failed=1
          elif sha256sum --check --ignore-missing checksums.txt >>"../verify.log" 2>&1; then
            echo "ok   checksums.txt"
          else
            echo "::error::checksums.txt does not describe the published assets"; failed=1
          fi

          [[ "${failed}" -eq 0 ]] || exit 1

      - name: Verify the container image
        env:
          IDENTITY: ${{ steps.identity.outputs.value }}
        run: |
          set -euo pipefail
          failed=0

          # Defined per step: each `run:` block is its own shell, so a helper
          # defined in an earlier step is not in scope here.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          # if/else rather than `cmd && echo ok || err`: in that form the error
          # branch also runs when the echo fails, which in a gate is a false
          # pass one broken pipe away.
          verify() {
            local what="$1"; shift
            if retry cosign "$@" --certificate-identity "${IDENTITY}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" >>verify.log 2>&1; then
              echo "ok   ${what}"
            else
              echo "::error::${what} does not verify after 3 attempts"
              failed=1
            fi
          }

          # Everything else here is digest-addressed, but the chart pins
          # manager:<tag> (values.yaml leaves tag empty and the deployment
          # falls back to .Chart.AppVersion), so the reference users actually
          # deploy is resolved at install time. Bind the tag to the digest that
          # was verified, or a repointed tag passes a fully green gate.
          resolved="$(retry cosign verify --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --output json "${IMAGE}:${TAG}" 2>>verify.log \
            | jq -r '.[].critical.image."docker-manifest-digest"' | sort -u)" || resolved=""
          if [[ "${resolved}" != "${INDEX}" ]]; then
            echo "::error::${IMAGE}:${TAG} resolves to '${resolved}', not the verified index ${INDEX}"
            failed=1
          else
            echo "ok   tag ${TAG} resolves to the verified index"
          fi

          verify "index signature"  verify "${IMAGE}@${INDEX}"
          verify "index provenance" verify-attestation --type slsaprovenance1 "${IMAGE}@${INDEX}"
          for pair in "amd64:${AMD64}" "arm64:${ARM64}"; do
            verify "${pair%%:*} SBOM" verify-attestation --type cyclonedx "${IMAGE}@${pair#*:}"
          done

          [[ "${failed}" -eq 0 ]] || exit 1

      # A signature says who signed and on which ref. Only the predicate says
      # what was built -- a tag repointed after the build still satisfies an
      # identity-only check.
      # attest.yml records that a retry can leave more than one valid
      # attestation on a digest, and that a consumer "must tolerate more than
      # one attestation per digest and must not treat a duplicate as
      # tampering". cosign prints one DSSE envelope per verified attestation,
      # so the payloads are read one per line and every statement must agree.
      # Concatenating them instead yields a multi-line value that matches
      # nothing, failing a correct release with an error that reads like
      # tampering.
      - name: Verify the provenance predicate
        env:
          IDENTITY: ${{ steps.identity.outputs.value }}
        run: |
          set -euo pipefail

          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          payloads="$(retry cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${INDEX}" 2>>verify.log | jq -r .payload)" || true
          if [[ -z "${payloads}" ]]; then
            echo "::error::could not read the provenance predicate; see the verification log artifact"
            exit 1
          fi

          seen=0
          failed=0
          while IFS= read -r encoded; do
            [[ -n "${encoded}" ]] || continue
            seen=$((seen + 1))
            statement="$(base64 -d <<<"${encoded}")"

            got_repo="$(jq -r '.predicate.buildDefinition.externalParameters.repository' <<<"${statement}")"
            got_ref="$(jq -r '.predicate.buildDefinition.externalParameters.ref' <<<"${statement}")"
            got_commit="$(jq -r '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' <<<"${statement}")"

            [[ "${got_repo}" == "${GITHUB_REPOSITORY}" ]] \
              || { echo "::error::attestation ${seen} names repository ${got_repo}, expected ${GITHUB_REPOSITORY}"; failed=1; }
            [[ "${got_ref}" == "refs/tags/${TAG}" ]] \
              || { echo "::error::attestation ${seen} names ref ${got_ref}, expected refs/tags/${TAG}"; failed=1; }
            [[ "${got_commit}" == "${GITHUB_SHA}" ]] \
              || { echo "::error::attestation ${seen} names commit ${got_commit}, but ${TAG} is ${GITHUB_SHA}"; failed=1; }

            echo "ok   attestation ${seen}: repository=${got_repo} ref=${got_ref} commit=${got_commit}"
          done <<<"${payloads}"

          if [[ "${seen}" -eq 0 ]]; then
            echo "::error::no provenance statement was returned for ${IMAGE}@${INDEX}"
            exit 1
          fi
          echo "${seen} provenance attestation(s) checked"
          [[ "${failed}" -eq 0 ]] || exit 1

      - name: Verify the Helm chart
        env:
          IDENTITY: ${{ steps.identity.outputs.value }}
        run: |
          set -euo pipefail
          failed=0

          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          if retry cosign verify --certificate-identity "${IDENTITY}" \
               --certificate-oidc-issuer "${OIDC_ISSUER}" \
               "${CHART_NAME}@${CHART_DIGEST}" >>verify.log 2>&1; then
            echo "ok   chart signature"
          else
            echo "::error::chart signature does not verify after 3 attempts"; failed=1
          fi
          if retry cosign verify-attestation --type slsaprovenance1 \
               --certificate-identity "${IDENTITY}" \
               --certificate-oidc-issuer "${OIDC_ISSUER}" \
               "${CHART_NAME}@${CHART_DIGEST}" >>verify.log 2>&1; then
            echo "ok   chart provenance"
          else
            echo "::error::chart provenance does not verify after 3 attempts"; failed=1
          fi
          [[ "${failed}" -eq 0 ]] || exit 1

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-log
          path: verify.log
          retention-days: 30
          if-no-files-found: warn

      # Only now does the release become visible.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          retry gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "release ${TAG} verified and published"

      # The channel a user actually takes. Everything above ran authenticated
      # because a draft is not reachable otherwise; this confirms the assets are
      # served, and correctly, over the anonymous path.
      - name: Re-check over the public channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ${{ steps.identity.outputs.value }}
        run: |
          set -euo pipefail

          # This step runs after the release is public, so every failure here
          # retracts it. A transient one must not: a release that passed every
          # signature, SBOM, digest and provenance check would be pulled back to
          # draft with an error that reads like tampering.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [[ "${n}" -ge 3 ]] && return 1
              sleep $((n * 5))
            done
          }

          visibility="$(retry gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "${visibility}" != "public" ]]; then
            echo "NOTICE: repository is ${visibility}; skipping the anonymous re-check."
            exit 0
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          rm -rf public && mkdir public && cd public
          for a in installer installer.sigstore.json nvcrectl-linux-amd64 nvcrectl-linux-amd64.sigstore.json; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "${a}" "${base}/${a}"
          done
          [[ "$(head -c 2 installer)" == '#!' ]] || { echo "::error::installer is not a shell script"; exit 1; }
          bash -n installer
          retry cosign verify-blob-attestation \
            --bundle installer.sigstore.json \
            --type https://slsa.dev/provenance/v1 \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            installer

          # The binary was downloaded over this channel too; verifying it is
          # the point of downloading it. Checking only the installer would let
          # the step report the channel good while the asset most users take
          # was never checked on it.
          retry cosign verify-blob-attestation \
            --bundle nvcrectl-linux-amd64.sigstore.json \
            --type https://slsa.dev/provenance/v1 \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            nvcrectl-linux-amd64

          echo "public channel serves verifiable installer and binary"

      # Last step in the job, deliberately. Steps run in declaration order, so
      # an `if: failure()` step only catches failures from steps ABOVE it -- one
      # placed before the public re-check would already have been evaluated and
      # skipped by the time that check failed, and would never retract anything.
      # Anything that fails after publication must leave the release withheld
      # rather than visible with the run red.
      - name: Retract the release if anything after publication failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # An unreadable state must not read as "nothing to do". Leaving a
          # release public after its verification failed is the worst available
          # outcome, so an unknown state is treated as published and the
          # retraction is attempted anyway. `gh release edit --draft=true` is
          # idempotent, so doing it to an already-draft release costs nothing.
          state="unknown"
          for attempt in 1 2 3; do
            if out="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --json isDraft --jq .isDraft 2>&1)"; then
              state="${out}"
              break
            fi
            echo "attempt ${attempt}: could not read release state: ${out}"
            sleep $((attempt * 5))
          done

          if [[ "${state}" == "true" ]]; then
            echo "release ${TAG} is already a draft; nothing to retract"
            exit 0
          fi

          for attempt in 1 2 3; do
            if gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=true; then
              echo "::error::verification failed after publication; release ${TAG} has been returned to draft"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::verification failed AND release ${TAG} could not be returned to draft. It may still be public. Retract it manually before doing anything else."
          exit 1
