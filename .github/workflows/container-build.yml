name: Container Build

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - Dockerfile
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/container-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: linux-amd64-cpu32
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the pre-populated buildkitd config on NVIDIA GHA runners, which
      # routes image pulls through a per-environment Docker mirror cache.
      # See https://docs.gha-runners.nvidia.com/platform/best-practices/#use-docker-cache-for-buildkit
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      # A branch name such as "pull-request/26" holds a slash, which a docker
      # tag cannot. Replace every character a tag does not allow, then cut the
      # result so the tag stays under the 128 character limit. The branch name
      # goes through the environment, so it cannot run as shell code.
      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          ref=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-80)
          echo "value=${ref}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build container image (no push)
        run: make docker-buildx BUILDX_PUSH=
        env:
          IMG: ghcr.io/nvidia/cluster-readiness-engine/manager:${{ steps.tag.outputs.value }}
