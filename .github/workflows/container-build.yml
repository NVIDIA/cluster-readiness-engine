name: Container Build

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - Dockerfile
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/container-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: linux-amd64-cpu32
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build container image (no push)
        run: make docker-build-cross
        env:
          IMG: ghcr.io/nvidia/cluster-readiness-engine/manager:${{ github.ref_name }}-${{ github.sha }}
