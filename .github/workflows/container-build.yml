name: Container Build

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - Dockerfile
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/container-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: linux-amd64-cpu32
    if: github.repository == 'NVIDIA/cluster-readiness-engine'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image (no push)
        run: make docker-build-cross
        env:
          IMG: ghcr.io/nvidia/cluster-readiness-engine/manager:${{ github.ref_name }}-${{ github.sha }}
