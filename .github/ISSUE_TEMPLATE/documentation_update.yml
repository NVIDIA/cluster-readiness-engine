name: Documentation Update
description: Request corrections or updates to existing documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please review existing [documentation issues](https://github.com/NVIDIA/cluster-readiness-engine/issues?q=is%3Aopen+is%3Aissue+label%3Adocumentation) before submitting.
      options:
        - label: I searched existing documentation and open documentation issues
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/NVIDIA/cluster-readiness-engine/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Link to the existing docs or source that needs correction.
      placeholder: https://github.com/NVIDIA/cluster-readiness-engine/blob/main/docs/
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect, outdated, unclear, or missing from the current documentation?
      placeholder: The docs say to use one configuration key, but the Helm chart uses another.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Proposed Correction
      description: Optional. Suggest the wording or technical change you expect.
      placeholder: Replace the old configuration key with the current value and add a short example.
    validations:
      required: false
