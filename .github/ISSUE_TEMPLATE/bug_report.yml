name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues
          required: true
        - label: I can reproduce this issue
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/dsx-ai-factory/cluster-readiness-engine/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API / CRDs
        - Controller / Reconcilers
        - Catalog / Workloads
        - CLI (ncrectl)
        - Helm / Deployment
        - Documentation / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Step one
        2. Step two
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - CRE version:
        - Kubernetes version:
        - GPU architecture:
        - Cloud provider / platform:
        - Deployment method:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      description: Include relevant logs or error messages
      placeholder: |
        ```
        # Logs here
        ```
