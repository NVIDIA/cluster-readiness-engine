---
{{- /*
  nvcre-manager-role is bound cluster-wide. It holds reads, cluster-scoped
  writes, writes to NVCRE's own CRDs, and event creation. Every write to a
  namespaced resource outside NVCRE's API group is in nvcre-run-role
  (run-role.yaml), which rbac.scope decides how to bind (ADR-092).
  Maintained by hand: controller-gen runs with output:rbac:none.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "nvcre.labels" . | nindent 4 }}
  name: nvcre-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  verbs:
  - create
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements
  - certifications
  - goodputmeasurements
  - jobs
  - workflows
  - workloadruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements/finalizers
  - certifications/finalizers
  - goodputmeasurements/finalizers
  - jobs/finalizers
  - workflows/finalizers
  - workloadruns/finalizers
  verbs:
  - update
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements/status
  - certifications/status
  - goodputmeasurements/status
  - jobs/status
  - workflows/status
  - workloadruns/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - logprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs/status
  verbs:
  - get
