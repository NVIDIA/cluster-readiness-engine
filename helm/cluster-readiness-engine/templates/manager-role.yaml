---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "nvcre.labels" . | nindent 4 }}
  name: nvcre-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements
  - certifications
  - goodputmeasurements
  - jobs
  - workflows
  - workloadruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements/finalizers
  - certifications/finalizers
  - goodputmeasurements/finalizers
  - jobs/finalizers
  - workflows/finalizers
  - workloadruns/finalizers
  verbs:
  - update
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - bandwidthmeasurements/status
  - certifications/status
  - goodputmeasurements/status
  - jobs/status
  - workflows/status
  - workloadruns/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - logprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaimtemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - resource.nvidia.com
  resources:
  - computedomains
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainingruntimes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs/status
  verbs:
  - get
