---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cre-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods/log
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cre.nvidia.com
  resources:
  - bandwidthmeasurements
  - certifications
  - goodputmeasurements
  - jobs
  - workflows
  - workloadruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cre.nvidia.com
  resources:
  - bandwidthmeasurements/finalizers
  - certifications/finalizers
  - goodputmeasurements/finalizers
  - jobs/finalizers
  - workflows/finalizers
  - workloadruns/finalizers
  verbs:
  - update
- apiGroups:
  - cre.nvidia.com
  resources:
  - bandwidthmeasurements/status
  - certifications/status
  - goodputmeasurements/status
  - jobs/status
  - workflows/status
  - workloadruns/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cre.nvidia.com
  resources:
  - logprofiles
  verbs:
  - get
  - list
  - watch
