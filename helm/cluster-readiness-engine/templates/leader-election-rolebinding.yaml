apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cre.labels" . | nindent 4 }}
  name: cre-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cre-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "cre.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
