# LogProfile for single-node NCCL loopback bandwidth tests.
#
# Same output format as multi-node nccl-tests, but reads from the "node"
# replicatedJob (not "launcher") since single-node tests don't use an
# MPI launcher pod.
#
# Used by communication/nccl-loopback{,-nvswitch} to validate NVLink/NVSwitch
# bandwidth independently of the network fabric.
apiVersion: cre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  labels:
    {{- include "cre.labels" . | nindent 4 }}
  name: nccl-loopback
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  workerStrategy:
    type: Single
    replicatedJobName: node
  patterns:
    bandwidthResult:
      regex: '^\s*(?P<size>\d+)\s+\d+\s+\w+\s+\w+\s+-?\d+\s+[\d.]+\s+(?P<algBW>[\d.]+)\s+(?P<busBW>[\d.]+)'
      example: '           8             2     float     sum      -1    58.31    0.00    0.00       0    58.40    0.00    0.00       0'
