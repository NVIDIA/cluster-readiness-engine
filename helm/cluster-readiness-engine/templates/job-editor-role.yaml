# This rule is not used by the project cluster-readiness-engine itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the nvcre.nvidia.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "cre.labels" . | nindent 4 }}
  name: cre-job-editor-role
rules:
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvcre.nvidia.com
  resources:
  - jobs/status
  verbs:
  - get
