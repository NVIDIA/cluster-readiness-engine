# NVCRE Helm chart values.

nameOverride: nvcre

manager:
  replicas: 1
  # Maximum number of objects reconciled concurrently by each core controller
  # (Job, Workflow, Certification, and WorkloadRun).
  maxConcurrentReconciles: 10
  # Measurement controllers fetch and parse Pod logs, so their default is lower.
  measurementMaxConcurrentReconciles: 5
  # How long a Workflow waits for the controller's write access in its
  # namespace before it fails with NamespacePermissionsMissing, as a Go
  # duration. Only a namespace without a run RoleBinding ever waits, which
  # needs rbac.scope: namespaced.
  namespaceAccessTimeout: 10m
  # How long a Job keeps retrying a workload create the API server rejects
  # (admission webhook or policy denial, ResourceQuota) before it fails with
  # WorkloadCreationError, as a Go duration. Independent of timeoutPerJob.
  workloadCreationDeadline: 10m
  image:
    repository: ghcr.io/nvidia/cluster-readiness-engine/manager
    tag: ""
    # Pin by digest instead of tag. When set, this wins over `tag` and the image
    # is referenced as repository@digest -- the only form that names the exact
    # bytes you verified, since a tag can be repointed after verification.
    # Example: sha256:735ad1e142a378b0919510bd1fc113cd53ab754bc79b7f0980d647d50a914523
    digest: ""
    # Leave empty to use Kubernetes' image-based default. Set to Always,
    # IfNotPresent, or Never to override it.
    pullPolicy: ""
  imagePullSecrets: []
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 1Gi
  # Replaces the complete default affinity when non-empty. Include pod anti-affinity
  # explicitly when combining custom node placement with multiple replicas.
  affinity: {}
  tolerations:
    - operator: Exists
  terminationGracePeriodSeconds: 10

# Where the controller may write. Its reads, its own CRDs and events are
# granted cluster-wide by nvcre-manager-role. Every write to a namespaced
# resource outside NVCRE's API group (ConfigMaps, PVCs, TrainJobs,
# TrainingRuntimes, ResourceClaimTemplates, ComputeDomains, pod logs) is in
# nvcre-run-role, and scope decides where that role is bound. See ADR-092.
rbac:
  # cluster: bind nvcre-run-role cluster-wide, so the controller can write in
  #   every namespace. This matches earlier releases. Default for this release;
  #   the default becomes namespaced in the next minor release.
  # namespaced: bind it only in the namespaces below. nvcrectl certification
  #   run and workloadrun run bind it in the namespaces they create, and
  #   `nvcrectl rbac print --namespace <ns>` writes the RoleBinding for any
  #   other. A Workflow in a namespace without one waits with reason
  #   NamespacePermissionsMissing for up to manager.namespaceAccessTimeout.
  scope: cluster
  # Long-lived run namespaces to bind under scope: namespaced, for GitOps or
  # Run:ai project namespaces. Each must already exist: the chart does not
  # create them, and a missing one fails the install with NotFound.
  runNamespaces: []

# Protect the controller from voluntary evictions. With one replica and
# minAvailable: 1, node drains are blocked even when no Certification is running.
pdb:
  enabled: false
  # Minimum ready controller pods, as an integer or percentage (for example "50%").
  minAvailable: 1

metrics:
  port: 8443
  serviceMonitor:
    # The ServiceMonitor needs the Prometheus Operator CRDs
    # (monitoring.coreos.com/v1). Set to false on clusters without them.
    enabled: true
    # Keep the controller's own namespace and job labels on each series.
    # Without this, Prometheus prefers scrape-target labels and renames the
    # metric labels to exported_namespace / exported_job, so PromQL filters
    # on namespace/job match the controller Service instead of the Job.
    # Set to false only if existing dashboards already query exported_*.
    honorLabels: true
    # Extra labels on the ServiceMonitor for Prometheus Operator discovery.
    # kube-prometheus-stack selects ServiceMonitors with
    # release: <prometheus-helm-release>. The default matches a Prometheus
    # Helm release named "prometheus". Override or add labels to match your
    # install.
    labels:
      release: prometheus
    # Optional scrape interval (for example "30s"). Empty uses the Prometheus default.
    interval: ""
    # Optional scrape timeout (for example "10s"). Empty uses the Prometheus default.
    scrapeTimeout: ""
