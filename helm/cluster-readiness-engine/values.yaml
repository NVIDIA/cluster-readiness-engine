# CRE Helm chart values.

nameOverride: cluster-readiness-engine

manager:
  replicas: 1
  image:
    repository: ghcr.io/nvidia/cluster-readiness-engine/manager
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 1Gi
  affinity: {}
  tolerations:
    - operator: Exists
  terminationGracePeriodSeconds: 10

metrics:
  port: 8443
  serviceMonitor:
    # The ServiceMonitor needs the Prometheus Operator CRDs
    # (monitoring.coreos.com/v1). Set to false on clusters without them.
    enabled: true
