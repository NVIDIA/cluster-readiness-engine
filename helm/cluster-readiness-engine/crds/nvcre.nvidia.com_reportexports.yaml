---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: reportexports.nvcre.nvidia.com
spec:
  group: nvcre.nvidia.com
  names:
    kind: ReportExport
    listKind: ReportExportList
    plural: reportexports
    shortNames:
    - rex
    singular: reportexport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .status.result
      name: Result
      type: string
    - jsonPath: .status.phase
      name: Delivery
      type: string
    - jsonPath: .status.attempts
      name: Attempts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ReportExport records the durable delivery of one report to one
          policy target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReportExportSpec freezes delivery inputs while allowing explicit
              operator actions.
            properties:
              cancel:
                description: cancel stops future attempts without changing the source
                  result.
                type: boolean
              clusterID:
                maxLength: 253
                minLength: 1
                type: string
              policyRef:
                description: ReportExportPolicyReference identifies the policy revision
                  captured at registration.
                properties:
                  generation:
                    format: int64
                    type: integer
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
              reportID:
                maxLength: 128
                minLength: 1
                type: string
              retention:
                default: {}
                description: ReportExportRetention bounds payload retention after
                  a delivery cycle ends.
                properties:
                  failed:
                    default: 720h
                    type: string
                    x-kubernetes-validations:
                    - message: failed retention must be between 1h and 365 days
                      rule: duration(self) >= duration('1h') && duration(self) <=
                        duration('8760h')
                  succeeded:
                    default: 168h
                    type: string
                    x-kubernetes-validations:
                    - message: succeeded retention must be between 1h and 365 days
                      rule: duration(self) >= duration('1h') && duration(self) <=
                        duration('8760h')
                type: object
              retry:
                default: {}
                description: ReportExportRetry defines a bounded retry cycle.
                properties:
                  initialBackoff:
                    default: 10s
                    type: string
                    x-kubernetes-validations:
                    - message: initialBackoff must be between 1s and 1h
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('1h')
                  maxAttempts:
                    default: 100
                    description: maxAttempts includes the first HTTP attempt in each
                      retry cycle.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                  maxBackoff:
                    default: 15m
                    type: string
                    x-kubernetes-validations:
                    - message: maxBackoff must be between 1s and 24h
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('24h')
                  maxElapsedTime:
                    default: 24h
                    description: maxElapsedTime starts when delivery first attempts
                      a stored snapshot.
                    type: string
                    x-kubernetes-validations:
                    - message: maxElapsedTime must be between 1s and 30 days
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('720h')
                type: object
                x-kubernetes-validations:
                - message: maxBackoff must not be less than initialBackoff
                  rule: '!has(self.maxBackoff) || !has(self.initialBackoff) || duration(self.maxBackoff)
                    >= duration(self.initialBackoff)'
              retryNonce:
                description: |-
                  retryNonce requests a new bounded cycle for a retained, failed delivery.
                  Changing it preserves the payload, idempotency key, and total attempts.
                maxLength: 128
                type: string
              sourceRef:
                description: ReportExportSourceReference identifies one immutable
                  certification run.
                properties:
                  kind:
                    default: Certification
                    enum:
                    - Certification
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              webhook:
                description: ReportWebhook describes one HTTP receiver. Credentials
                  remain in a Secret.
                properties:
                  bearerTokenSecretRef:
                    description: bearerTokenSecretRef selects a token in the policy/export
                      namespace.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  timeout:
                    default: 10s
                    description: timeout bounds an individual request.
                    type: string
                    x-kubernetes-validations:
                    - message: timeout must be between 1s and 5m
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('5m')
                  url:
                    description: |-
                      url is the HTTP POST destination. The exporter requires HTTPS unless its
                      administrator explicitly enables plain HTTP for development.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https?://[^\s]+$
                    type: string
                required:
                - url
                type: object
            required:
            - clusterID
            - policyRef
            - reportID
            - retention
            - retry
            - sourceRef
            - webhook
            type: object
            x-kubernetes-validations:
            - message: delivery inputs are immutable; only cancel and retryNonce may
                change
              rule: self.sourceRef == oldSelf.sourceRef && self.policyRef == oldSelf.policyRef
                && self.webhook == oldSelf.webhook && self.retry == oldSelf.retry
                && self.retention == oldSelf.retention && self.clusterID == oldSelf.clusterID
                && self.reportID == oldSelf.reportID
          status:
            description: ReportExportStatus separates local persistence from remote
              acceptance.
            properties:
              attempts:
                format: int32
                type: integer
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cycleAttempts:
                format: int32
                type: integer
              cycleStartedAt:
                format: date-time
                type: string
              firstAttemptTime:
                format: date-time
                type: string
              lastAttemptTime:
                format: date-time
                type: string
              lastHTTPStatus:
                format: int32
                type: integer
              message:
                type: string
              nextAttemptTime:
                format: date-time
                type: string
              observedRetryNonce:
                type: string
              payloadBytes:
                format: int64
                type: integer
              phase:
                type: string
              reason:
                type: string
              reportID:
                type: string
              result:
                type: string
              sha256:
                type: string
              snapshotRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              snapshotStartedAt:
                format: date-time
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
