                          Example: {"elapsedTime": "ms"} means the captured value is in milliseconds.
                        type: object
                    required:
                    - regex
                    type: object
                  checkpointSave:
                    description: |-
                      checkpointSave matches checkpoint save start lines.
                      Well-known captures: timestamp, step, path, saveDuration
