# CertificationSpec inlines CategoryOptions, so the single
# CategoryOptions.WorkloadMetadata field is read both globally at
# spec.workloadMetadata and per category at
# spec.categories[].options.workloadMetadata. This is the nested path whose CEL
# cost is the tightest in the whole schema, and it admits.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-cert-wm
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  workloadMetadata:
    labels:
      environment: burn-in
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        workloadMetadata:
          labels:
            kueue.x-k8s.io/queue-name: nccl-queue
