# gangScheduler is optional: a Certification that omits it is still accepted,
# so opting into gang scheduling never becomes mandatory.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-gang-absent
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
