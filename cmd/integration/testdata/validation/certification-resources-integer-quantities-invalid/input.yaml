# Quantities are int-or-string; bare integers must go through the same
# comparison (string() conversion inside the CEL rule) and be rejected.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-int-invalid
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: 128
          requests:
            cpu: 256
