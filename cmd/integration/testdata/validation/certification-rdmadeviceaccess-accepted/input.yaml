# The accept half: both enum values are valid, at both levels at once. An Enum
# tightened by mistake (dropped value, renamed case) would turn this red rather
# than only showing up as a render that silently did nothing.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-rdma-accepted
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  rdmaDeviceAccess: hostPath
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        rdmaDeviceAccess: devicePlugin
