# CPU request above the CPU limit: accepted at admission. No CEL rule may
# compare quantities, because Kubernetes 1.29 through 1.33 refuse the CRD over
# it (ADR-105); the controller rejects the pair instead, see
# reconcile/certification-invalid-resources. Fails if a CEL rule returns.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-cpu-exceeds
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "128"
            memory: 800Gi
          requests:
            cpu: "256"
            memory: 500Gi
