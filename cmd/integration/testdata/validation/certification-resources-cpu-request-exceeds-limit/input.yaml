# CPU request above the CPU limit: rejected at admission.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-cpu-exceeds
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "128"
            memory: 800Gi
          requests:
            cpu: "256"
            memory: 500Gi
