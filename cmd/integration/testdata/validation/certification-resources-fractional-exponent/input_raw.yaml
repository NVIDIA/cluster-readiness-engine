# A fractional exponent matches the controller-gen Quantity pattern but
# resource.ParseQuantity refuses it, so a Certification holding it would
# break every typed List in its namespace, the controller informer included.
# The Pattern must reject it at admission (ADR-101). Submitted raw: the typed
# decode would refuse it before it reached the API server.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-fractional-exponent
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "1e1.5"
