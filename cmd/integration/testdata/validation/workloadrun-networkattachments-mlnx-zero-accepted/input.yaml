# The WorkloadRun CRD carries the list too. mlnxPerNode: 0 is accepted with it:
# it is how a run drops a platform NIC request the list does not replace.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: val-wr-netatt-mlnx
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:latest
  numNodes: 2
  mlnxPerNode: 0
  networkAttachments:
    - {network: r0, resourceName: nvidia.com/r0}
  framework:
    exec:
      command: ["echo"]
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
