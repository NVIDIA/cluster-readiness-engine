# The same rules apply to the spec-level (global) resources block.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-global-invalid
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  resources:
    limits:
      cpu: "128"
    requests:
      cpu: "256"
  categories:
    - domain: training
      variant: nemotron5-8b
