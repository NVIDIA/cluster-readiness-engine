{
  "apiVersion": "nvcre.nvidia.com/v1alpha1",
  "kind": "ReportExportPolicy",
  "metadata": {
    "name": "report-policy-backoff-order",
    "namespace": "default"
  },
  "spec": {
    "source": {
      "namespaces": [
        "default"
      ]
    },
    "webhook": {
      "url": "https://receiver.example.test/report"
    },
    "retry": {
      "initialBackoff": "10s",
      "maxBackoff": "1s"
    }
  }
}
