# Limits without matching requests: the guard keeps the rules from firing,
# so the object is accepted.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-limits-only
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "6"
            memory: 48Gi
