# A scheduler name and a queue that both satisfy the schema: accepted.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-gang-accepted
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  gangScheduler:
    schedulerName: kai-scheduler
    queue: high-priority
  categories:
    - domain: training
      variant: nemotron5-8b
