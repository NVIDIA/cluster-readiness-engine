# Negative request and limit that compare equal: the per-field non-negative
# Pattern must reject both strings at admission (ADR-105).
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-negative-pair
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "-1"
          requests:
            cpu: "-1"
