# An upper-case network, a reserved-domain resource and a zero count.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-netatt-bad
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  networkAttachments:
    - {network: nvcre/R0, resourceName: nvidia.com/r0}
    - {network: r1, resourceName: kubernetes.io/r1}
    - {network: r2, resourceName: nvidia.com/r2, count: 0}
  categories:
    - domain: communication
      variant: nccl-all-reduce
