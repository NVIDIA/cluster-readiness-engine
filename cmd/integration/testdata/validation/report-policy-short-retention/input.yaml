{
  "apiVersion": "nvcre.nvidia.com/v1alpha1",
  "kind": "ReportExportPolicy",
  "metadata": {
    "name": "report-policy-short-retention",
    "namespace": "default"
  },
  "spec": {
    "source": {
      "namespaces": [
        "default"
      ]
    },
    "webhook": {
      "url": "https://receiver.example.test/report"
    },
    "retention": {
      "failed": "5s"
    }
  }
}
