# CategoryOptions is inlined into CertificationSpec, so the same pattern
# guards the spec-level default. The documented default value must be accepted.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-maxbytes-spec-level
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  maxBytes: "16G"
  categories:
    - domain: communication
      variant: nccl-all-reduce
