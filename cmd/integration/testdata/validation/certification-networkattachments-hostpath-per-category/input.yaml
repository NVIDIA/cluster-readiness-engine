# rdmaDeviceAccess: hostPath requests no device, so it cannot carry
# attachments; the rule applies per category as well.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-netatt-hostpath
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        rdmaDeviceAccess: hostPath
        networkAttachments:
          - {network: r0, resourceName: nvidia.com/r0}
