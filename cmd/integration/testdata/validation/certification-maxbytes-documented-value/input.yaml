# A maxBytes value in the documented form (digits plus an optional K/M/G/T
# suffix) must pass schema validation. The v0.1.0 CRD rejected every value
# because the kubebuilder marker wrapped the regex in single quotes, which
# became literal characters around the anchors.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-maxbytes-documented
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        maxBytes: "1G"
