# The persisted consistency contract, with the queue and key already resolved
# the way the write paths record them.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: val-wf-gang
  namespace: default
spec:
  gangScheduler:
    schedulerName: kai-scheduler
    queue: burn-in
    queueLabelKey: kai.scheduler/queue
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
