# One digit past the cap is rejected at admission (ADR-101). Submitted raw,
# so the exponent reaches the API server as written.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-exponent-three-digits
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "1e100"
