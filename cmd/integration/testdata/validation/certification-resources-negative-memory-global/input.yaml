# Negative spec-level memory request with no limit set: rejected by the
# per-field non-negative rule.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-negative-mem
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  resources:
    requests:
      memory: "-1Gi"
  categories:
    - domain: training
      variant: nemotron5-8b
