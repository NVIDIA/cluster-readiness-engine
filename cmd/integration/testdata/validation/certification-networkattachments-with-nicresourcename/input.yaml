# Both in one options block: rejected by the exclusion rule.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-netatt-nic
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nicResourceName: rdma/ib
  networkAttachments:
    - {network: r0, resourceName: nvidia.com/r0}
  categories:
    - domain: communication
      variant: nccl-all-reduce
