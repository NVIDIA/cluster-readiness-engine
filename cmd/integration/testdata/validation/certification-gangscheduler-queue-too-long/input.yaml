# 64 characters, one over the label value limit of 63. Every other character
# satisfies the pattern, so MaxLength is the only rule that can reject it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-gang-queue-too-long
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  gangScheduler:
    schedulerName: kai-scheduler
    queue: "qaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaq"
  categories:
    - domain: training
      variant: nemotron5-8b
