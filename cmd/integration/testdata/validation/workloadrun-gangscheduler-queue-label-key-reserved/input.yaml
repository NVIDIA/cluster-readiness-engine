# queueLabelKey becomes an entry in workloadMetadata.labels, so reject an
# NVCRE-owned key at admission rather than failing every immutable reconcile.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: val-wr-gang-reserved-key
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:25.01
  numNodes: 2
  framework:
    torch:
      script: /workspace/train.py
  gangScheduler:
    schedulerName: kai-scheduler
    queueLabelKey: nvcre.nvidia.com/queue
    queue: team-a
