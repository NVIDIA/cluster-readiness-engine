# The largest exponents the Pattern allows, two digits either way, are
# accepted: ParseQuantity decodes both to the value written, at once
# (ADR-101). Submitted raw, like the rejected boundary cases.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-exponent-two-digits
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "1e99"
            memory: "1e-99"
