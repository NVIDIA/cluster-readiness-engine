# A DNS name has no empty labels, so consecutive dots are rejected at
# admission rather than failing dcgmi at runtime.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-dcgmhost-empty-label
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: diagnostics
      variant: dcgm-level4
      options:
        dcgmHost: dcgm..svc:5555
