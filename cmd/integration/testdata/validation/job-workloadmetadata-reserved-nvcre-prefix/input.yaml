# The nvcre.nvidia.com/ prefix carries the Job association the controller uses
# to find its own workloads.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: val-wm-nvcre-prefix
  namespace: default
spec:
  workloadMetadata:
    labels:
      nvcre.nvidia.com/job: other-job
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
