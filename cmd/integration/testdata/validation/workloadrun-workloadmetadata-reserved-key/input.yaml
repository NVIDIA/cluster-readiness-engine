# WorkloadRun reaches the same shared WorkloadMetadata type, so it inherits the
# same admission rules without declaring them again.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: val-wr-wm
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:25.01
  numNodes: 2
  framework:
    torch:
      script: /workspace/train.py
  workloadMetadata:
    labels:
      app.kubernetes.io/managed-by: someone-else
