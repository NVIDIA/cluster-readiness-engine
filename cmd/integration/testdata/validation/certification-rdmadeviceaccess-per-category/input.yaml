# The Enum binds at the per-category level too, not only on the embedded
# spec-level field. Both positions come from the same CategoryOptions struct,
# so this pins that the marker survives in both generated schema locations.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-rdma-percat
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        rdmaDeviceAccess: hostpath
