# 63 characters is the Kubernetes limit for a label key's name segment.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: val-wm-name-63
  namespace: default
spec:
  workloadMetadata:
    labels:
      nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn: x
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
