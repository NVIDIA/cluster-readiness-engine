# Both sides set and correctly ordered: accepted.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: val-within-limits
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "6"
            memory: 48Gi
          requests:
            cpu: "4"
            memory: 32Gi
