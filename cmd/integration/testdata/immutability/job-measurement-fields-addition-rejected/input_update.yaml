apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: imm-job-fields-add
  namespace: default
spec:
  nodeHealthMonitor:
    cel:
      expression: "node.spec.unschedulable == true"
  goodputMeasurement:
    logProfileRef: test-profile
  bandwidthMeasurement:
    logProfileRef: test-profile
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
