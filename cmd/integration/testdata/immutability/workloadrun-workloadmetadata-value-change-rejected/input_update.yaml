# WorkloadRun has no field-level rule of its own: the whole-spec self ==
# oldSelf rule covers workloadMetadata along with everything else. This case
# exercises the new field specifically, rather than assuming the general rule
# reaches it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: imm-wr-value
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:25.01
  numNodes: 2
  framework:
    torch:
      script: /workspace/train.py
  workloadMetadata:
    labels:
      kai.scheduler/queue: queue-b
