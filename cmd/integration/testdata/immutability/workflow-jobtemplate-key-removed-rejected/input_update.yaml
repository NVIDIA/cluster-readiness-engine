# Dropping one key from a multi-key map is a value change.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-key-drop
  namespace: default
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kai.scheduler/queue: queue-a
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
