# The rules must not freeze the rest of the spec. An unrelated mutable field
# changes while workloadMetadata is carried through untouched.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: imm-job-present-ok
  namespace: default
spec:
  stallMultiplier: 10
  workloadMetadata:
    labels:
      kai.scheduler/queue: queue-a
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
