apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-fields-value
  namespace: default
spec:
  jobTemplate:
    spec:
      nodeHealthMonitor:
        cel:
          expression: "node.spec.unschedulable == true"
      goodputMeasurement:
        logProfileRef: test-profile
        sampleInterval: 60s
      bandwidthMeasurement:
        logProfileRef: test-profile
        sampleInterval: 60s
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
