# And a Workflow whose stored job template predates the field keeps admitting
# unrelated edits, while staying without it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-absent-ok
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
