apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata: {name: imm-wf-health-add, namespace: default}
spec:
  jobTemplate:
    spec:
      nodeHealthMonitor: {cel: {expression: "node.spec.unschedulable == true"}}
      workload:
        trainJob:
          runtimeRef: {kind: TrainingRuntime, name: test-runtime}
  orchestration: {iterations: 1, target: {nodeSelector: {nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB}}}
