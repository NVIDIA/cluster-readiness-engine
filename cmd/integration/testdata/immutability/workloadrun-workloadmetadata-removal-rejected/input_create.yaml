# Removal is covered by the same whole-spec rule, which — unlike a field-level
# equality rule — does fire when an optional field disappears, because the spec
# object itself changed.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: imm-wr-remove
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:25.01
  numNodes: 2
  framework:
    torch:
      script: /workspace/train.py
  workloadMetadata:
    labels:
      kai.scheduler/queue: queue-a
