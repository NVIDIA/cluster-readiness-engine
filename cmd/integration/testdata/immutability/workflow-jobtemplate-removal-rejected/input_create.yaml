# Present to absent on a Workflow job template. The field-level equality rule
# does not run for this transition at all, so only the parent-level presence
# rule propagated through JobTemplateSpec.Spec catches it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-remove
  namespace: default
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kai.scheduler/queue: queue-a
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
