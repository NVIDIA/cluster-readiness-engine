# The same for Certification's global workloadMetadata.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: imm-cert-value
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  workloadMetadata:
    labels:
      kai.scheduler/queue: queue-a
  categories:
    - domain: training
      variant: nemotron5-8b
