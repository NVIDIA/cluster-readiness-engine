# A Workflow created without gangScheduler, as every hand-authored Workflow is,
# must keep accepting unrelated edits. The struct-level presence rule compares
# has() on both sides, so absent-to-absent is a pass, not a rejection.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-gang-absent-ok
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
