# Emptying the nested labels map while keeping workloadMetadata present. The
# presence rule sees no change here, so this is the field-level equality rule
# doing the work — the two are complementary, not redundant.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: imm-wf-nested
  namespace: default
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kai.scheduler/queue: queue-a
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
