apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-GB200"
    kubernetes.io/hostname: gpu-node-01
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-GB200"
    kubernetes.io/hostname: gpu-node-02
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: nemotron-6-8b-burnin
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nemotron-6-8b-runtime
          trainer:
            image: nvcr.io/nvidia/nemo:25.07
            command:
              - /bin/bash
              - -c
            args:
              - |
                exec torchrun \
                  --nnodes 2 \
                  --nproc-per-node 4 \
                  /mnt/workspace/megatron-lm/pretrain_mamba.py \
                  --enable-cuda-graph \
                  --moe-grouped-gemm \
                  --num-experts 128 \
                  --moe-router-topk 6 \
                  --mock-data \
                  --tensor-model-parallel-size 2 \
                  --expert-model-parallel-size 16 \
                  --pipeline-model-parallel-size 1 \
                  --use-distributed-optimizer \
                  --num-layers 52 \
                  --hidden-size 4096 \
                  --num-attention-heads 32 \
                  --group-query-attention \
                  --num-query-groups 8 \
                  --seq-length 8192 \
                  --max-position-embeddings 8192 \
                  --micro-batch-size 1 \
                  --global-batch-size 768 \
                  --bf16 \
                  --use-mcore-models \
                  --log-interval 10 \
                  --save-interval 500
            numNodes: 2
            numProcPerNode: 4
            resourcesPerNode:
              requests:
                nvidia.com/gpu: "4"
                memory: 500Gi
                cpu: "64"
              limits:
                nvidia.com/gpu: "4"
                memory: 800Gi
                cpu: "128"

  orchestration:
    target:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-GB200"
    iterations: 1

  dependencies:
    # ComputeDomain for NVLink topology
    - apiVersion: resource.nvidia.com/v1beta1
      kind: ComputeDomain
      metadata:
        name: nemotron-6-8b-compute-domain
        namespace: default
      spec:
        numNodes: 2
        channel:
          resourceClaimTemplate:
            name: nemotron-6-8b-compute-domain

    # ResourceClaimTemplate for RoCE networking
    - apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: nemotron-6-8b-roce
        namespace: default
      spec:
        spec:
          devices:
            requests:
            - name: roce
              exactly:
                deviceClassName: roce.networking.k8s.aws
                count: 8

    # TrainingRuntime with distributed training configuration
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nemotron-6-8b-runtime
      spec:
        mlPolicy:
          numNodes: 2
          torch:
            numProcPerNode: 4
        template:
          spec:
            replicatedJobs:
              - name: node
                replicas: 1
                template:
                  metadata:
                    labels:
                      trainer.kubeflow.org/trainjob-ancestor-step: trainer
                  spec:
                    template:
                      metadata:
                        labels:
                          app: nemotron-6-8b
                      spec:
                        terminationGracePeriodSeconds: 30
                        tolerations:
                          - key: dedicated
                            operator: Equal
                            value: user-workload
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/nemo:25.07
                            env:
                              - name: NVTE_FWD_LAYERNORM_SM_MARGIN
                                value: "16"
                              - name: NVTE_BWD_LAYERNORM_SM_MARGIN
                                value: "16"
                              - name: NCCL_DEBUG
                                value: "INFO"
                              - name: NCCL_SOCKET_IFNAME
                                value: "eth0"
                              - name: NCCL_IB_SL
                                value: "1"
                              - name: NCCL_IB_TIMEOUT
                                value: "19"
                              - name: NCCL_SHM_DISABLE
                                value: "1"
                              - name: NCCL_NVLS_ENABLE
                                value: "0"
                              - name: CUDA_DEVICE_MAX_CONNECTIONS
                                value: "1"
                              - name: TORCH_NCCL_AVOID_RECORD_STREAMS
                                value: "1"
                            resources:
                              limits:
                                nvidia.com/gpu: 4
                                memory: "800Gi"
                                cpu: "128"
                              requests:
                                nvidia.com/gpu: 4
                                memory: "500Gi"
                                cpu: "64"
                            volumeMounts:
                              - name: workspace
                                mountPath: /mnt/workspace
                              - name: shmem
                                mountPath: /dev/shm
                        volumes:
                          - name: workspace
                            emptyDir: {}
                          - name: shmem
                            emptyDir:
                              medium: Memory
