# Observe the real InProgress transition before making the workload terminal.
steps:
  - waitFor:
      kind: Job
      name: test-trainjob-succeed
      namespace: default
      condition: InProgress
      reason: WorkloadRunning
    patches:
      - target:
          kind: TrainJob
          name: test-trainjob-succeed-workload
          namespace: default
        status: true
        patch:
          status:
            conditions:
              - type: Complete
                status: "True"
                reason: JobCompleted
                message: All workers completed
                lastTransitionTime: "2026-01-22T10:00:00Z"
waitFor:
  kind: Job
  name: test-trainjob-succeed
  namespace: default
  condition: Succeeded
collect:
  - kind: Job
    name: test-trainjob-succeed
    namespace: default
events:
  - involvedKind: Job
    involvedName: test-trainjob-succeed
    namespace: default
    expect:
      - {type: Normal, reason: WorkloadRunning}
      - {type: Normal, reason: WorkloadCompleted}
