# The TrainJob is the object these labels exist for, and the TrainingRuntime
# is where ADR-076 puts the queue, so collecting both is what makes this a
# parity fixture against the nvcrectl cases in pkg/workloadrun. The runtime is
# job-scoped, so the object that actually exists is the suffixed per-job copy.
waitFor:
  kind: Job
  name: wr-gang-only-job
  namespace: default
  condition: InProgress
collect:
  - kind: Workflow
    name: wr-gang-only
    namespace: default
  - kind: TrainJob
    name: wr-gang-only-job-workload
    namespace: default
  - kind: TrainingRuntime
    name: wr-gang-only-runtime-f8997-job
    namespace: default
