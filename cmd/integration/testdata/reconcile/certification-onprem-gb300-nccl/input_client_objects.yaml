# On-prem is the detection fallback: these nodes carry no providerID (and no
# Forge hostname or NKE site label), so platform detection resolves them to
# "onprem" and the ADR-075 override blocks match.
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-node-01
    kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-node-02
    kubernetes.io/arch: arm64
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-nc-g3
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        nicResourceName: rdma/ib
        mlnxPerNode: 1
