apiVersion: v1
kind: Node
metadata:
  name: immut-gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: immut-gpu-node-01
---
apiVersion: v1
kind: Node
metadata:
  name: immut-gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: immut-gpu-node-02
---
# Two categories reproduce the issue #215 window: while the first category's
# Workflow is InProgress the second is still Pending, so an accepted global
# edit would apply only to the later category (mixed spec generations).
# The spec-level transition rule must reject every edit in that window.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: immutable-certification
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: communication
      variant: nccl-all-gather
