apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-1
  labels:
    node.kubernetes.io/instance-type: p6-b300.48xlarge
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: aws-b300-node-1
spec:
  providerID: aws://us-west-2a/i-template-1
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"

---
apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-2
  labels:
    node.kubernetes.io/instance-type: p6-b300.48xlarge
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: aws-b300-node-2
spec:
  providerID: aws://us-west-2a/i-template-2
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"

---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-b300-n5
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
