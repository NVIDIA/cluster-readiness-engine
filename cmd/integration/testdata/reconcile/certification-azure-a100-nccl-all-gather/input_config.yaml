# The Certification reports WorkflowRunning once its Workflow exists, before
# that Workflow reaches JobRunning. Waiting on the Certification alone can
# collect the Workflow still at JobCreated.
steps:
  - waitFor:
      kind: Workflow
      name: az-a100-ag-communication-69833
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: az-a100-ag
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: az-a100-ag
    namespace: default
  - kind: Workflow
    name: az-a100-ag-communication-69833
    namespace: default
