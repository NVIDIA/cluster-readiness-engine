apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-goodput-threshold-pass-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
status:
  conditions:
    - type: Complete
      status: "True"
      reason: JobCompleted
      message: "All workers completed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-goodput-threshold-pass
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
  goodputMeasurement:
    logProfileRef: nemo-training
    minGoodputRatio: "0.80"
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-goodput-threshold-pass-workload
    namespace: default
---
apiVersion: cre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-goodput-threshold-pass-goodput
  namespace: default
spec:
  jobRef:
    apiGroup: cre.nvidia.com
    kind: Job
    name: test-goodput-threshold-pass
  logProfileRef: nemo-training
status:
  result: "0.8800"
