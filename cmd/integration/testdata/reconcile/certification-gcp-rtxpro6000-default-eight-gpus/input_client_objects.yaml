apiVersion: v1
kind: Node
metadata:
  name: gcp-rtxpro6000-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
    kubernetes.io/hostname: gcp-rtxpro6000-node-01
spec:
  providerID: "gce://my-project/asia-northeast1-b/gcp-rtxpro6000-node-01"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: gcp-rtxpro6000-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
    kubernetes.io/hostname: gcp-rtxpro6000-node-02
spec:
  providerID: "gce://my-project/asia-northeast1-b/gcp-rtxpro6000-node-02"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gcp-rtx-default8
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
