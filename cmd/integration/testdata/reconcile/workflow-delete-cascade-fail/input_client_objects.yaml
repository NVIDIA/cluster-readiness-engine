# Workflow with a single iteration, group-0 running, Job pointing to a
# failed TrainJob. The Job controller will detect the TrainJob failure and
# mark the Job Failed. The Workflow controller then marks the Workflow
# Failed. Once Failed, the test deletes the Workflow and verifies that
# the controller cascade-deletes the Job and its TrainJob workload.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-wf-del-fail
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  orchestration:
    totalNodes: 1
    nodesPerJob: 1
    totalGroups: 1
    currentIteration: 1
    completedIterations: 0
    groups:
      - name: group-0
        nodes:
          - gpu-node-01
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-wf-del-fail-group-0-iter-1
          namespace: default
---
# Job owned by the Workflow, currently InProgress with workloadRef.
# The Job controller detects the failed TrainJob and transitions to Failed.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-wf-del-fail-group-0-iter-1
  namespace: default
  labels:
    app.kubernetes.io/managed-by: nvcre
    nvcre.nvidia.com/workflow: test-wf-del-fail
    nvcre.nvidia.com/group: group-0
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: "Workload is running"
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-wf-del-fail-group-0-iter-1-workload
    namespace: default
---
# Failed TrainJob workload. The Job controller detects this failure
# and marks the Job Failed.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-wf-del-fail-group-0-iter-1-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
  suspend: false
  managedBy: trainer.kubeflow.org/trainjob-controller
status:
  conditions:
    - type: Failed
      status: "True"
      reason: TrainJobFailed
      message: "Training job failed"
      lastTransitionTime: "2026-01-01T00:00:00Z"
