# Both screening jobs succeeded and both measure above the bandwidth threshold
# (500 and 480 vs 400 minimum). The diagnose controller should record both
# cliques as passed=true and advance to inter-screening (testing the
# inter-domain fabric using one healthy representative per clique).
waitFor:
  kind: Workflow
  name: test-diag-threshold
  namespace: default
  condition: InProgress
collect:
  - kind: Workflow
    name: test-diag-threshold
    namespace: default
