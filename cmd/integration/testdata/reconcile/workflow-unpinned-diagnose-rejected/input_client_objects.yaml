# Unpinned and diagnose are mutually exclusive, and the rejection is not a
# stylistic preference. Diagnose isolates a fault by partitioning nodes into
# groups and bisecting the failures: it reads g.Nodes[0] to pick a pivot and
# accumulates g.Nodes into its suspect set. An Unpinned group carries no node
# list, so a diagnose run over one would bisect nothing and silently report
# every node healthy.
#
# That rejection is also load-bearing well beyond this case. Most readers of
# GroupStatus.Nodes in the Workflow controller are diagnose-only, and they are
# safe under Unpinned precisely because this combination can never exist.
apiVersion: v1
kind: Node
metadata:
  name: unpin-diag-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-diag-node-01
spec:
  providerID: "aws://us-east-1a/i-0c01"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-diag-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-diag-node-02
spec:
  providerID: "aws://us-east-1a/i-0c02"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: unpin-diagnose
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    placement: Unpinned
    diagnose:
      minGroupSize: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
