apiVersion: cre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: nccl-all-reduce-test
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  workerStrategy:
    type: Single
    replicatedJobName: launcher
  patterns:
    bandwidthResult:
      regex: '^\s*(?P<size>\d+)\s+\d+\s+\w+\s+\w+\s+-?\d+\s+[\d.]+\s+(?P<algBW>[\d.]+)\s+(?P<busBW>[\d.]+)'
      example: '           8             2     float     sum      -1    58.31    0.00    0.00       0'
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-bw-job-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - mpirun
    numNodes: 2
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-bw-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - mpirun
        numNodes: 2
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: "Workload is running"
      lastTransitionTime: "2026-02-16T10:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-02-16T10:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-02-16T10:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-bw-job-workload
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: test-bw-job-workload-launcher-0-0
  namespace: default
  labels:
    jobset.sigs.k8s.io/jobset-name: test-bw-job-workload
    jobset.sigs.k8s.io/replicatedjob-name: launcher
    batch.kubernetes.io/job-completion-index: "0"
    cre.nvidia.com/job: test-bw-job
spec:
  containers:
    - name: node
      image: test-image:latest
status:
  phase: Running
---
apiVersion: cre.nvidia.com/v1alpha1
kind: BandwidthMeasurement
metadata:
  name: test-bw
  namespace: default
spec:
  jobRef:
    apiGroup: cre.nvidia.com
    kind: Job
    name: test-bw-job
  logProfileRef: nccl-all-reduce-test
  sampleInterval: 1s
  testType: all_reduce
