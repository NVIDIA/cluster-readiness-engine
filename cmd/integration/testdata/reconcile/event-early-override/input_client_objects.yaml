apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: event-early-override
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command: [echo, test]
            numNodes: 1
  orchestration:
    target:
      nodeSelector:
        event-case: event-early-override
  overrides:
    - when: {}
      jobTemplatePatch: {"invalid": "not an array"}
