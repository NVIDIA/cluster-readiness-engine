# A DRA-only fleet: no node carries nvidia.com/gpu.product, and the architecture
# is published in gpu.nvidia.com ResourceSlices instead. That is ADR-082's
# fallback, and augmentGPUProductLabels synthesizes the label onto the
# controller's in-memory Node copies so every label reader keeps working.
#
# Reading the label is safe. Matching on it is not, and that is what this case
# pins. The value never exists on the stored Node, so a node affinity built from
# it selects nothing and every pod stays Pending forever with nothing naming the
# cause. Under Unpinned that term is the only thing holding the job to one
# architecture, so the run is refused rather than scheduled unconstrained.
#
# The fleet is deliberately mixed: two GB300 and one H100. detectGPUArchConsistent
# filters to the gb300 majority and records the H100 node as architecture-excluded,
# which is the condition that makes the refusal necessary rather than merely
# conservative. On a uniform fleet there is no wrong GPU to land on, so
# GPUProductsForAffinity returns ok and the term is dropped silently.
#
# These are real ResourceSlice objects on the API server, not a fake reader. The
# unit tests in pkg/controller cover the parsing; this covers the path from a
# stored resource.k8s.io/v1 object through discovery to the refusal, which is the
# part no test reached before.
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: dra-node-01-gpus
spec:
  driver: gpu.nvidia.com
  nodeName: dra-node-01
  pool:
    name: dra-node-01
    generation: 1
    resourceSliceCount: 1
  devices:
    - name: gpu-0
      attributes:
        productName:
          string: NVIDIA GB300
        type:
          string: gpu
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: dra-node-02-gpus
spec:
  driver: gpu.nvidia.com
  nodeName: dra-node-02
  pool:
    name: dra-node-02
    generation: 1
    resourceSliceCount: 1
  devices:
    - name: gpu-0
      attributes:
        productName:
          string: NVIDIA GB300
        type:
          string: gpu
---
# The odd node out, and the reason the refusal is not merely cautious. Its
# architecture is also synthesized, so the mixed fleet is visible only through
# the ResourceSlices: on the stored Nodes all three look identical.
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: dra-node-03-gpus
spec:
  driver: gpu.nvidia.com
  nodeName: dra-node-03
  pool:
    name: dra-node-03
    generation: 1
    resourceSliceCount: 1
  devices:
    - name: gpu-0
      attributes:
        productName:
          string: NVIDIA H100 80GB HBM3
        type:
          string: gpu
---
apiVersion: v1
kind: Node
metadata:
  name: dra-node-01
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: dra-node-01
spec:
  providerID: "aws://us-east-1a/i-0d01"
status:
  allocatable:
    nvidia.com/gpu: "4"
---
apiVersion: v1
kind: Node
metadata:
  name: dra-node-02
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: dra-node-02
spec:
  providerID: "aws://us-east-1a/i-0d02"
status:
  allocatable:
    nvidia.com/gpu: "4"
---
apiVersion: v1
kind: Node
metadata:
  name: dra-node-03
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: dra-node-03
spec:
  providerID: "aws://us-east-1a/i-0d03"
status:
  allocatable:
    nvidia.com/gpu: "4"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: dra-unpinned
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    placement: Unpinned
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
