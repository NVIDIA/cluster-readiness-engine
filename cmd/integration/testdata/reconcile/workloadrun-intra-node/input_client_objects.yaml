#
# Issue #85: testScale intra-node did nothing when a WorkloadRun ran on a
# cluster. The reconciler passed spec.numNodes straight through, so a 4-node
# run stayed one Job of 4 nodes even though "nvcrectl workloadrun render"
# previewed one node per Job. This case pins the reconcile path: 4 nodes with
# testScale intra-node must partition into 4 single-node groups.

apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-01
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef0"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-02
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef1"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-03
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef2"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-04
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-04
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef3"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-intra-node-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  image: nvcr.io/nvidia/pytorch:25.08-py3
  framework:
    torch:
      script: /workspace/train.py
  numNodes: 4
  orchestration:
    testScale: intra-node
