generateNodes:
  count: 8
  providerID: "gce://my-project/us-central1-a/instance-1"
  labels:
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: gcp-gb-training-nemotron5-56b
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: gcp-gb
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: gcp-gb
    namespace: default
  - kind: Workflow
    name: gcp-gb-training-nemotron5-56b
    namespace: default
  - kind: Job
    name: gcp-gb-training-nemotron5-56b-job
    namespace: default
