# spec.fabric efa on nodes with no vpc.amazonaws.com/efa allocatable (ADR-110):
# the Certification fails with FabricValidationFailed before any Workflow exists,
# and never falls back to the RoCE the nodes do carry.
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-mis-1
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-mis-1
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
status:
  allocatable:
    nvidia.com/gpu: "4"
    hugepages-2Mi: "0"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-mis-2
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-mis-2
spec:
  providerID: "aws://us-east-1a/i-0000000000000002"
status:
  allocatable:
    nvidia.com/gpu: "4"
    hugepages-2Mi: "0"
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: aws-gb300-mis-1-networking
spec:
  driver: dra.networking.k8s.aws
  pool:
    name: aws-gb300-mis-1
    generation: 1
    resourceSliceCount: 1
  nodeName: aws-gb300-mis-1
  devices:
  - name: rocep201s0
    attributes:
      dra.vpc.amazonaws.com/deviceType:
        string: roce
      dra.vpc.amazonaws.com/networkDevName:
        string: ens176
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: aws-gb300-mis-2-networking
spec:
  driver: dra.networking.k8s.aws
  pool:
    name: aws-gb300-mis-2
    generation: 1
    resourceSliceCount: 1
  nodeName: aws-gb300-mis-2
  devices:
  - name: rocep201s0
    attributes:
      dra.vpc.amazonaws.com/deviceType:
        string: roce
      dra.vpc.amazonaws.com/networkDevName:
        string: ens176
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-gb300-mis
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300-NVL72
  fabric: efa
  categories:
    - domain: communication
      variant: nccl-all-reduce
