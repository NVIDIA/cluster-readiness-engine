# Same shape as certification-aws-gb200-nccl, plus spec.gangScheduler. The MPI
# runtime for nccl-all-reduce has two replicatedJobs, node and launcher, so this
# case pins that both of them get schedulerName and the queue label.
apiVersion: v1
kind: Node
metadata:
  name: gang-nccl-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: gang-nccl-node-01
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
---
apiVersion: v1
kind: Node
metadata:
  name: gang-nccl-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: gang-nccl-node-02
spec:
  providerID: "aws://us-east-1a/i-0000000000000002"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gang-nccl
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  gangScheduler:
    schedulerName: kai-scheduler
    queue: high-priority
  categories:
    - domain: communication
      variant: nccl-all-reduce
