# Regression test for the bandwidth gate fail-open bug (issue #5).
# screen-0 has a valid BandwidthMeasurement. screen-1 has NO BandwidthMeasurement
# at all (the CR was never created). Previously isBelowBandwidthThreshold would
# return (false, false) for screen-1 — treating it as "threshold passed" and
# marking both nodes healthy. After the fix it returns (false, true) — pending —
# so collectDiagnoseRoundResults requeues without advancing the diagnose stage.
apiVersion: v1
kind: Node
metadata:
  name: node-a1
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.clique: clique-a
    kubernetes.io/hostname: node-a1
---
apiVersion: v1
kind: Node
metadata:
  name: node-a2
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.clique: clique-a
    kubernetes.io/hostname: node-a2
---
apiVersion: v1
kind: Node
metadata:
  name: node-b1
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.clique: clique-b
    kubernetes.io/hostname: node-b1
---
apiVersion: v1
kind: Node
metadata:
  name: node-b2
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.clique: clique-b
    kubernetes.io/hostname: node-b2
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-bw-missing-bm
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - mpirun
            numNodes: 2
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    diagnose:
      minGroupSize: 2
      topologyKey: nvidia.com/gpu.clique
  validation:
    performance:
      enabled: true
      thresholds:
        thresholds:
          busBandwidthGBps: "value >= 400"
status:
  orchestration:
    totalNodes: 4
    nodesPerJob: 2
    totalGroups: 2
    currentIteration: 1
    detectedPlatform: onprem
    detectedGPUArchitecture: unknown
    diagnose:
      stage: intra-screening
      round: 0
    groups:
      - name: screen-0
        nodes: [node-a1, node-a2]
        domains: [clique-a]
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-bw-missing-bm-screen-0-iter-1
          namespace: default
      - name: screen-1
        nodes: [node-b1, node-b2]
        domains: [clique-b]
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-bw-missing-bm-screen-1-iter-1
          namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-bw-missing-bm-screen-0-iter-1
  namespace: default
  labels:
    app.kubernetes.io/managed-by: nvcre
    nvcre.nvidia.com/workflow: test-bw-missing-bm
    nvcre.nvidia.com/group: screen-0
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - mpirun
        numNodes: 2
status:
  conditions:
    - type: Succeeded
      status: "True"
      reason: WorkloadCompleted
      message: "Workload completed"
      lastTransitionTime: "2026-01-22T10:05:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-bw-missing-bm-screen-1-iter-1
  namespace: default
  labels:
    app.kubernetes.io/managed-by: nvcre
    nvcre.nvidia.com/workflow: test-bw-missing-bm
    nvcre.nvidia.com/group: screen-1
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - mpirun
        numNodes: 2
status:
  conditions:
    - type: Succeeded
      status: "True"
      reason: WorkloadCompleted
      message: "Workload completed"
      lastTransitionTime: "2026-01-22T10:05:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
# BandwidthMeasurement for screen-0 only — screen-1 has no BandwidthMeasurement.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: BandwidthMeasurement
metadata:
  name: test-bw-missing-bm-screen-0-bw
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-bw-missing-bm-screen-0-iter-1
  logProfileRef: nccl-bandwidth
  testType: all_reduce
status:
  results:
    - sizeBytes: 17179869184
      algBW: "300.00"
      busBW: "500.00"
      samples: 5
