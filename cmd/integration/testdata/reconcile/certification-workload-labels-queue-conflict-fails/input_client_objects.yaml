# The controller half of the per-category queue conflict. spec.gangScheduler
# is global, so every category is placed in team-a; this category's own
# workloadMetadata names the same KAI key with team-b. The named transform
# stage has to reject the composition and the Certification has to end Failed
# with the conflict in its message, with no Workflow created for the category.
apiVersion: v1
kind: Node
metadata:
  name: conflict-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: conflict-node-01
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
---
apiVersion: v1
kind: Node
metadata:
  name: conflict-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: conflict-node-02
spec:
  providerID: "aws://us-east-1a/i-0000000000000002"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: cert-queue-conflict
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  gangScheduler:
    schedulerName: kai-scheduler
    queue: team-a
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        workloadMetadata:
          labels:
            kai.scheduler/queue: team-b
