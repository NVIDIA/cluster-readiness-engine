# GCP H100 (A3 Mega) nodes on a cluster built from Google's current TCPXO
# manifest: the nccl-tcpxo-installer pod on each target node installs plugin
# v1.0.17, which loads CUDA 13. The controller reads the release from the
# installer pods and renders the NCCL entries' CUDA 13 image (pytorch:26.01-py3)
# on every MPI container and trainer.image, with Google's paired tcpxo-daemon
# v1.0.23 (issue #438). The pinned CUDA 12 image fails to load this plugin.
