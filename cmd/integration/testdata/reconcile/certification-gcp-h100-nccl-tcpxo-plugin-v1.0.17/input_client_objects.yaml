apiVersion: v1
kind: Pod
metadata:
  name: nccl-tcpxo-installer-0
  namespace: kube-system
  labels:
    k8s-app: nccl-tcpxo-installer
spec:
  nodeName: gcp-h100-node-01
  initContainers:
  - name: pre-installation
    image: ubuntu
  - name: nccl-tcpxo-installer
    image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
  containers:
  - name: pause
    image: gke.gcr.io/pause:3.8
status:
  phase: Running
---
apiVersion: v1
kind: Pod
