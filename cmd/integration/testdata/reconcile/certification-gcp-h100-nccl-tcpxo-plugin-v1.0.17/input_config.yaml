# Two waits, in causal order, because the golden asserts BOTH objects and they
# settle at different times. The Certification controller flips
# InProgress/WorkflowCreated to InProgress/WorkflowRunning only on a later
# reconcile, once it has observed the Workflow running, so a wait on the
# Workflow alone captured this Certification mid-flight and the case failed
# intermittently under full-suite load.
#
# A step with a waitFor and no patches is just a second wait. Many sibling
# cases share this shape and have not been seen to flake; see the issue filed
# with the full enumeration.
waitFor:
  kind: Workflow
  name: gcp-tcpxo17-communication-de7d0
  namespace: default
  condition: InProgress
  reason: JobRunning
steps:
  - waitFor:
      kind: Certification
      name: gcp-tcpxo17
      namespace: default
      condition: InProgress
      reason: WorkflowRunning
collect:
  - kind: Certification
    name: gcp-tcpxo17
    namespace: default
  - kind: Workflow
    name: gcp-tcpxo17-communication-de7d0
    namespace: default
events:
  # Only the Normal WorkflowCreated event: both nodes run plugin v1.0.17,
  # so there is no TCPXOPluginDetection Warning (and the GKE networks resolve).
  - involvedKind: Certification
    involvedName: gcp-tcpxo17
    namespace: default
    expect:
      - {type: Normal, reason: WorkflowCreated}
