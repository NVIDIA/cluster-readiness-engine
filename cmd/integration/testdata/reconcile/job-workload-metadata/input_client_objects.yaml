# A Job carrying workloadMetadata, as the Workflow controller would have copied
# it out of spec.jobTemplate.spec. The labels cover the two documented
# integrations (Kueue selects its local queue from the TrainJob's own
# metadata.labels before any pod exists; Kubeflow's KAI guide reads
# kai.scheduler/queue at the same level) plus an arbitrary key and an empty
# value.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-workload-metadata
  namespace: default
spec:
  workloadMetadata:
    labels:
      kueue.x-k8s.io/queue-name: gpu-team-a
      kai.scheduler/queue: burn-in
      environment: burn-in
      marker: ""
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
