apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-topo-metrics
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    topology:
      topologyKey: topology.kubernetes.io/zone
status:
  orchestration:
    totalNodes: 4
    nodesPerJob: 2
    totalGroups: 2
    currentIteration: 1
    groups:
      - name: group-0
        nodes:
          - topo-node-01
          - topo-node-02
        domains:
          - zone-a
        phase: Running
        jobRef:
