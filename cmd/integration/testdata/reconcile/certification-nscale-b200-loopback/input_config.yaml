# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: nscale-b2-lb-communicatio-33192
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: nscale-b2-lb
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: nscale-b2-lb
    namespace: default
  - kind: Workflow
    name: nscale-b2-lb-communicatio-33192
    namespace: default
