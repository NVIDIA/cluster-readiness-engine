apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-bw-threshold-pass-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - mpirun
    numNodes: 1
status:
  conditions:
    - type: Complete
      status: "True"
      reason: JobCompleted
      message: "All workers completed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-bw-threshold-pass
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - mpirun
        numNodes: 1
  bandwidthMeasurement:
    logProfileRef: nccl-bandwidth
    testType: all_reduce
    minBusBandwidthGBps: "300"
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-bw-threshold-pass-workload
    namespace: default
---
apiVersion: cre.nvidia.com/v1alpha1
kind: BandwidthMeasurement
metadata:
  name: test-bw-threshold-pass-bandwidth
  namespace: default
spec:
  jobRef:
    apiGroup: cre.nvidia.com
    kind: Job
    name: test-bw-threshold-pass
  logProfileRef: nccl-bandwidth
  testType: all_reduce
status:
  results:
    - sizeBytes: 8
      algBW: "0.00"
      busBW: "0.00"
      samples: 1
    - sizeBytes: 1048576
      algBW: "15.41"
      busBW: "29.87"
      samples: 1
    - sizeBytes: 17179869184
      algBW: "245.50"
      busBW: "370.14"
      samples: 1
