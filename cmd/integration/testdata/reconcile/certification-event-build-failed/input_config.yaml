waitFor:
  kind: Certification
  name: event-build-failed-cert
  namespace: default
  condition: Failed
  reason: WorkflowValidationFailed
collect:
  - kind: Certification
    name: event-build-failed-cert
    namespace: default
events:
  - involvedKind: Certification
    involvedName: event-build-failed-cert
    namespace: default
    expect:
      - {type: Warning, reason: WorkflowValidationFailed}
