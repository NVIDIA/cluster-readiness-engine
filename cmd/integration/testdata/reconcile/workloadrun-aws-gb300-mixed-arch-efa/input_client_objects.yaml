# spec.fabric efa on a target of two stock-EKS GB300 nodes and one H100 node
# without EFA (ADR-110). The Workflow runs the job on the primary architecture,
# GB300, so the fabric is checked on those two nodes: the H100 node must not
# fail the explicit efa, and the EFA blocks render.
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    kubernetes.io/hostname: gpu-node-01
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef0"
status:
  allocatable:
    nvidia.com/gpu: "4"
    vpc.amazonaws.com/efa: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    kubernetes.io/hostname: gpu-node-02
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef1"
status:
  allocatable:
    nvidia.com/gpu: "4"
    vpc.amazonaws.com/efa: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-03
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef2"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-gb300-mixed-arch-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  image: nvcr.io/nvidia/pytorch:26.01-py3
  framework:
    mpi:
      mpirunPath: /usr/local/mpi/bin/mpirun
      binary: /usr/local/bin/all_reduce_perf_mpi
      args: ["-b", "8", "-e", "32G", "-f", "2"]
      mpiArgs: ["--tag-output"]
  numNodes: 2
  fabric: efa
