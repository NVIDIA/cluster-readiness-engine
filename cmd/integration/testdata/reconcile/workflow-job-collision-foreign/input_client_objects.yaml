# A pre-existing Job (no owner references, no NVCRE labels) occupies the name
# the Workflow generates for its single group ("<workflow>-job"). The
# controller must NOT adopt it: the Workflow fails with JobNameCollision and
# the foreign Job survives Workflow deletion.
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: gpu-node-01
---
# The user's pre-existing Job. It is already terminal so the Job controller
# leaves it alone, and it carries no NVCRE workflow label or owner reference.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: wf-job-collide-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: user-runtime
      trainer:
        image: user-image:latest
        command:
          - python
          - user_train.py
        numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Succeeded
      status: "True"
      reason: WorkloadCompleted
      message: "User workload completed"
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: wf-job-collide
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
