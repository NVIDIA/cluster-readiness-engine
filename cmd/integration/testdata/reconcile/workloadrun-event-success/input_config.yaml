waitFor:
  kind: WorkloadRun
  name: event-success-run
  namespace: default
  condition: Succeeded
timeoutSeconds: 60
collect:
  - kind: WorkloadRun
    name: event-success-run
    namespace: default
events:
  - involvedKind: WorkloadRun
    involvedName: event-success-run
    namespace: default
    expect:
      - {type: Normal, reason: WorkflowSucceeded}
