apiVersion: v1
kind: Node
metadata:
  name: event-success-node
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    event-success: "true"
spec:
  providerID: aws://us-east-1a/i-0123456789abcdef0
status:
  capacity:
    nvidia.com/gpu: "8"
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: event-success-run
  namespace: default
spec:
  target:
    nodeSelector:
      event-success: "true"
  image: test-image:latest
  framework:
    exec:
      command: [echo, success]
  numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkflowCreated
      message: Workflow event-success-run created
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Succeeded
      status: "False"
      reason: Superseded
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Failed
      status: "False"
      reason: Superseded
      lastTransitionTime: "2026-01-22T10:00:00Z"
  workflowRef:
    name: event-success-run
    namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: event-success-run
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command: [echo, success]
            numNodes: 1
  orchestration:
    target:
      nodeSelector:
        event-success: "true"
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:05:00Z"
    - type: Succeeded
      status: "True"
      reason: JobCompleted
      message: All iterations completed successfully
      lastTransitionTime: "2026-01-22T10:05:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:05:00Z"
  orchestration:
    detectedPlatform: aws
    detectedGPUArchitecture: h100
  succeededNodesRef:
    kind: ConfigMap
    name: succeeded-nodes
