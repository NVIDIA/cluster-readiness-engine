apiVersion: v1
kind: Node
metadata:
  name: event-success-node
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    event-success: "true"
spec:
  providerID: aws://us-east-1a/i-0123456789abcdef0
status:
  capacity:
    nvidia.com/gpu: "8"
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: event-success-run
  namespace: default
spec:
  target:
    nodeSelector:
      event-success: "true"
  image: test-image:latest
  framework:
    exec:
      command: [echo, success]
  numNodes: 1
