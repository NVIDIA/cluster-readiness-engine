apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-goodput-threshold-fail-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
status:
  conditions:
    - type: Complete
      status: "True"
      reason: JobCompleted
      message: "All workers completed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-goodput-threshold-fail
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
  goodputMeasurement:
    logProfileRef: nemo-training
  thresholds:
    goodputRatio: "value >= 0.95"
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-goodput-threshold-fail-workload
    namespace: default
---
# The measurement is already frozen (Complete=True): since ADR-072, threshold
# evaluation skips goodput keys until the GoodputMeasurement controller's
# terminal write lands, so a provisional result must not drive pass/fail.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-goodput-threshold-fail-goodput
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-goodput-threshold-fail
  logProfileRef: nemo-training
status:
  result: "0.8800"
  completionTime: "2026-01-22T10:00:00Z"
  conditions:
    - type: Complete
      status: "True"
      reason: JobSucceeded
      message: "Referenced Job completed successfully"
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Measuring
      status: "False"
      reason: JobSucceeded
      message: "Measurement completed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
