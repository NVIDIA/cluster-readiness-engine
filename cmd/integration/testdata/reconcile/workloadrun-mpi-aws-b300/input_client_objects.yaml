# An MPI WorkloadRun on AWS B300 (EFA) must get the 16-device EFA request and
# IPC_LOCK on the runtime, and the -x'd EFA transport env in the launcher args,
# from the platform override table.
apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300
    kubernetes.io/hostname: aws-b300-node-01
spec:
  providerID: "aws://us-west-2a/i-0000000000000001"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300
    kubernetes.io/hostname: aws-b300-node-02
spec:
  providerID: "aws://us-west-2a/i-0000000000000002"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-mpi-aws-b300-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300
  image: nvcr.io/nvidia/pytorch:26.01-py3
  framework:
    mpi:
      mpirunPath: /usr/local/mpi/bin/mpirun
      binary: /usr/local/bin/all_reduce_perf_mpi
      args: ["-b", "8", "-e", "1G", "-f", "2"]
      mpiArgs: ["--tag-output"]
  numNodes: 2
  gpusPerNode: 8
  env:
    - name: USER_SETTING
      value: preserved
