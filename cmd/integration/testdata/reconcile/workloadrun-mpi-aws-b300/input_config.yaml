# Collect resolved objects: the Workflow retains its conditional templates.
# The Job carries trainer env/MPI rank arguments; the runtime carries the EFA
# request and IPC_LOCK.
waitFor:
  kind: Workflow
  name: test-mpi-aws-b300-run
  namespace: default
  condition: InProgress
  reason: JobRunning
collect:
  - kind: Workflow
    name: test-mpi-aws-b300-run
    namespace: default
  - kind: WorkloadRun
    name: test-mpi-aws-b300-run
    namespace: default
  - kind: Job
    name: test-mpi-aws-b300-run-job
    namespace: default
  - kind: TrainingRuntime
    name: test-mpi-aws-b300-run-runtime-c173f-job
    namespace: default
