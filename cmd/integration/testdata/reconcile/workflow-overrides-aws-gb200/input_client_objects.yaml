apiVersion: v1
kind: Node
metadata:
  name: aws-gb200-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-GB200-NVL72"
    kubernetes.io/hostname: aws-gb200-node-01
spec:
  providerID: "aws://us-east-1a/i-1234567890abcdef0"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-aws-gb200-overrides
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: base-image:latest
            command:
              - python
              - train.py
            args:
              - "--nproc-per-node=4"
            env:
              - name: NCCL_DEBUG
                value: "INFO"
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
  overrides:
    # GB200/GB300 architecture override — matches GB200
    - when:
        gpuArchitecture:
          in: ["gb200", "gb300"]
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: gb200-compute-config
            namespace: default
          data:
            NCCL_MNNVL_ENABLE: "0"
    # AWS platform override — matches AWS
    - when:
        platform:
          equals: "aws"
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-efa-config
            namespace: default
          data:
            FI_EFA_USE_DEVICE_RDMA: "1"
    # GCP + GB200/GB300 override — should NOT match (wrong platform)
    - when:
        platform:
          equals: "gcp"
        gpuArchitecture:
          in: ["gb200", "gb300"]
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: gcp-gb200-roce-config
            namespace: default
          data:
            NCCL_NET_GDR_LEVEL: "5"
