apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-startup-stall
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
  stallMultiplier: 2
  startupStallTimeoutSeconds: 10
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-startup-stall-workload
    namespace: default
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-startup-stall-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
status:
  conditions:
    - type: Running
      status: "True"
      reason: Running
      message: "Training is running"
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-startup-stall-gm
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-startup-stall
  logProfileRef: test-logprofile
  sampleInterval: 1s
status:
  applicationStartTime: "2025-01-01T00:00:00Z"
