apiVersion: v1
kind: Node
metadata:
  name: oci-l40s-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40S
    kubernetes.io/hostname: oci-l40s-node-01
spec:
  providerID: "ocid1.instance.oc1.iad.anuwcljt00000000000000000000000000000000000000000000000001"
---
apiVersion: v1
kind: Node
metadata:
  name: oci-l40s-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40S
    kubernetes.io/hostname: oci-l40s-node-02
spec:
  providerID: "ocid1.instance.oc1.iad.anuwcljt00000000000000000000000000000000000000000000000002"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-l40s
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
  categories:
    - domain: communication
      variant: nccl-all-reduce
---
# The platform's host-device NAD for nvidia.com/mlnxnics, at
# network-operator/sriov-net, the name NVCRE attached before detection
# (ADR-103). Detection finds it by its resourceName annotation, so this case
# renders exactly as it did then.
apiVersion: v1
kind: Namespace
metadata:
  name: network-operator
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-net
  namespace: network-operator
  annotations:
    k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
spec:
  config: '{"cniVersion": "0.3.1", "name": "sriov-net", "type": "host-device", "ipam": {}}'
