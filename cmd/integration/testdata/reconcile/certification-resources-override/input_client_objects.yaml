apiVersion: v1
kind: Node
metadata:
  name: a100-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
    kubernetes.io/hostname: a100-node-01
spec:
  providerID: ""
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: resovr
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        nodesPerJob: 1
        # Issue #83: override the DGX-class CPU/memory defaults so the
        # training pods can schedule on smaller GPU nodes.
        resources:
          limits:
            cpu: "6"
            memory: 48Gi
          requests:
            cpu: "4"
            memory: 32Gi
