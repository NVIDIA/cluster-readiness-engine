# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: gcp-tcpxo15-training-nemo-df807
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: gcp-tcpxo15
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: gcp-tcpxo15
    namespace: default
  - kind: Workflow
    name: gcp-tcpxo15-training-nemo-df807
    namespace: default
events:
  # Only the Normal WorkflowCreated event: both nodes run plugin v1.0.15,
  # so there is no TCPXOPluginDetection Warning (and the GKE networks resolve).
  - involvedKind: Certification
    involvedName: gcp-tcpxo15
    namespace: default
    expect:
      - {type: Normal, reason: WorkflowCreated}
