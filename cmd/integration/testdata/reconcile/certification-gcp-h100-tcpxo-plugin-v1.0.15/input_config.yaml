waitFor:
  kind: Workflow
  name: gcp-tcpxo15-training-nemo-df807
  namespace: default
  condition: InProgress
  reason: JobRunning
collect:
  - kind: Certification
    name: gcp-tcpxo15
    namespace: default
  - kind: Workflow
    name: gcp-tcpxo15-training-nemo-df807
    namespace: default
events:
  # Only the Normal WorkflowCreated event: both nodes run plugin v1.0.15,
  # so there is no TCPXOPluginDetection Warning (and the GKE networks resolve).
  - involvedKind: Certification
    involvedName: gcp-tcpxo15
    namespace: default
    expect:
      - {type: Normal, reason: WorkflowCreated}
