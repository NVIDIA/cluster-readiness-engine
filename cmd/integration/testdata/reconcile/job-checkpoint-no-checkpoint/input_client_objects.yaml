apiVersion: nvcre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: test-ckpt-nockpt-logprofile
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  patterns:
    trainingStep:
      regex: 'step (?P<globalStep>\d+)'
      example: "step 100"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-checkpoint-no-ckpt
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
  checkpoint:
    pvcName: test-ckpt-pvc
    maxRestarts: 3
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-checkpoint-no-ckpt-workload
    namespace: default
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-checkpoint-no-ckpt-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
status:
  conditions:
    - type: Failed
      status: "True"
      reason: WorkerFailed
      message: "Worker crashed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-checkpoint-no-ckpt-gm
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-checkpoint-no-ckpt
  logProfileRef: test-ckpt-nockpt-logprofile
  sampleInterval: 1s
status:
  lastCheckpointStep: 0
