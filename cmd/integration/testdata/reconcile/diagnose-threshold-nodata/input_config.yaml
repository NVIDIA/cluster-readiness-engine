# Both screening jobs succeeded but screen-1's BandwidthMeasurement completed
# with no data. It can never be evaluated, so the gate fails closed: screen-1 is
# treated as failed exactly like a bandwidth miss, instead of the diagnose round
# waiting on it forever (issue #404).
waitFor:
  kind: Workflow
  name: test-diag-nodata
  namespace: default
  condition: InProgress
collect:
  - kind: Workflow
    name: test-diag-nodata
    namespace: default
