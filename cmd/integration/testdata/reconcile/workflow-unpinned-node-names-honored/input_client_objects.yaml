# Unpinned removes the hostname affinity the controller chose. It does not
# remove one the operator chose.
#
# target.nodeNames is an explicit, user-written host list, so it survives as a
# kubernetes.io/hostname term on the pods even though the mode is Unpinned. The
# distinction the whole feature rests on is who picked the hosts: NVCRE picking
# them is what the reviewer objected to, and an operator naming three machines
# and asking for a two-node job is a narrower target, not a pin.
#
# Four nodes exist; nodeNames admits three of them; numNodes asks for two. So
# discovery sees three, one job of two runs, and the scheduler picks which two
# of the three named hosts. That combination is the reason this case is worth
# having: it separates "which nodes are eligible" from "how many to use", and
# only Unpinned lets those two numbers differ.
apiVersion: v1
kind: Node
metadata:
  name: unpin-names-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-names-node-01
spec:
  providerID: "aws://us-east-1a/i-0g01"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-names-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-names-node-02
spec:
  providerID: "aws://us-east-1a/i-0g02"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-names-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-names-node-03
spec:
  providerID: "aws://us-east-1a/i-0g03"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-names-node-04
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpin-names-node-04
spec:
  providerID: "aws://us-east-1a/i-0g04"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: unpin-names
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    placement: Unpinned
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      nodeNames:
        - unpin-names-node-01
        - unpin-names-node-02
        - unpin-names-node-03
