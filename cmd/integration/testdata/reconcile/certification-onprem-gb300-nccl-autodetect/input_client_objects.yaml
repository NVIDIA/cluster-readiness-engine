# NIC resource auto-detection (ADR-075): the certification sets no
# nicResourceName, and every target node advertises exactly one candidate
# (rdma/ib, allocatable > 0), so the controller detects it and the rendered
# TrainingRuntime carries the rdma/ib request without the field.
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-auto-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-auto-node-01
    kubernetes.io/arch: arm64
status:
  allocatable:
    nvidia.com/gpu: "4"
    rdma/ib: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-auto-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-auto-node-02
    kubernetes.io/arch: arm64
status:
  allocatable:
    nvidia.com/gpu: "4"
    rdma/ib: "1"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-nc-g3-auto
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        mlnxPerNode: 1
