apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-node-01
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-node-02
spec:
  providerID: "aws://us-east-1a/i-0000000000000002"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-nc-g3
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300-NVL72
  categories:
    - domain: communication
      variant: nccl-all-reduce
