# spec.fabric efa where one GB300 node offers two GPUs and no EFA (ADR-110). The
# category requests four GPUs per node, so that node never runs the job: the
# fabric is checked on the two capable nodes, which carry EFA, and the
# Certification proceeds instead of failing FabricValidationFailed.
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-cap-1
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-cap-1
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
status:
  allocatable:
    nvidia.com/gpu: "4"
    vpc.amazonaws.com/efa: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-cap-2
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-cap-2
spec:
  providerID: "aws://us-east-1a/i-0000000000000002"
status:
  allocatable:
    nvidia.com/gpu: "4"
    vpc.amazonaws.com/efa: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-gb300-cap-3
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: aws-gb300-cap-3
spec:
  providerID: "aws://us-east-1a/i-0000000000000003"
status:
  allocatable:
    nvidia.com/gpu: "2"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-gb300-cap
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300-NVL72
  fabric: efa
  categories:
    - domain: communication
      variant: nccl-all-reduce
