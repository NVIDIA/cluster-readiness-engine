# On-prem GB300 running the per-node torch entry. The NVL72 comm fragment
# used to merge mlPolicy.mpi into this torch runtime, which the TrainingRuntime
# CRD's one-policy CEL rule rejects, and to replace the entry's
# tolerate-everything toleration. Both are fixed under ADR-092; this case
# creates the merged runtime against envtest so the rule is what pins it.
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-lb-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-lb-node-01
    kubernetes.io/arch: arm64
spec:
  providerID: ""
status:
  allocatable:
    nvidia.com/gpu: "4"
    rdma/ib: "1"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-nc-g3-lb
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300
  nicResourceName: rdma/ib
  mlnxPerNode: 1
  categories:
    - domain: communication
      variant: nccl-loopback-nvswitch
