apiVersion: v1
kind: Namespace
metadata:
  name: access-review-error
  labels:
    test.nvcre.nvidia.com/access: error
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: wf-access-review-error
  namespace: access-review-error
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
  dependencies:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hostfile
      data:
        hosts: gpu-node
