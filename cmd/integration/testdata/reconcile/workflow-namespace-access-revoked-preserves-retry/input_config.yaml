# Group 0 records a retry for its failed Job. Group 1 then encounters a
# forbidden node-result write. The wait must retain group 0 as Pending with
# retries=1, and leave group 1 Running on its still-existing Job. Recording a
# retry deletes nothing: group 0's failed Job stays, Failed, until the next
# attempt's launch retires it, and the access wait holds that launch.
rejectNodeResultWrites: true
waitFor:
  kind: Workflow
  name: wf-retry-denied
  namespace: access-retry
  condition: InProgress
  reason: NamespacePermissionsMissing
collect:
  - kind: Workflow
    name: wf-retry-denied
    namespace: access-retry
  - kind: Job
    name: wf-retry-denied-job-a
    namespace: access-retry
