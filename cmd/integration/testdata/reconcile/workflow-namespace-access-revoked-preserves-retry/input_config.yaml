# Group 0 deletes its failed Job for a retry. Group 1 then encounters a
# forbidden node-result write. The wait must retain group 0 as Pending with
# retries=1, and leave group 1 Running on its still-existing Job.
rejectNodeResultWrites: true
waitFor:
  kind: Workflow
  name: wf-retry-denied
  namespace: access-retry
  condition: InProgress
  reason: NamespacePermissionsMissing
collect:
  - kind: Workflow
    name: wf-retry-denied
    namespace: access-retry
expectAbsent:
  - kind: Job
    name: wf-retry-denied-job-a
    namespace: access-retry
