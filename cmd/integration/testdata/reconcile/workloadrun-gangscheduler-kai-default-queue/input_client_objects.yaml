# The KAI cell of the existing-user matrix with the queue omitted, and no
# workloadMetadata at all. default-queue must reach the submitted TrainJob under
# KAI's own key, matching what the runtime templates already got, and the
# Workflow must persist both resolved defaults.
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-01
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef0"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-02
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef1"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-kai-default
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  image: nvcr.io/nvidia/pytorch:25.08-py3
  framework:
    torch:
      script: /workspace/train.py
  numNodes: 2
  gangScheduler:
    schedulerName: kai-scheduler
