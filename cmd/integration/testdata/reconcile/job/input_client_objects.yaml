apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-job
  namespace: default
  labels:
    cre.nvidia.com/workflow: test-workflow
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
