apiVersion: nvcre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: nccl-final-read-test
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  workerStrategy:
    type: Single
    replicatedJobName: launcher
  patterns:
    bandwidthResult:
      regex: '^\s*(?P<size>\d+)\s+\d+\s+\w+\s+\w+\s+-?\d+\s+[\d.]+\s+(?P<algBW>[\d.]+)\s+(?P<busBW>[\d.]+)'
      example: '           8             2     float     sum      -1    58.31    0.00    0.00       0'
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-bw-final-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - mpirun
    numNodes: 2
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-bw-final-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - mpirun
        numNodes: 2
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: WorkloadCompleted
      message: "Workload has completed"
      lastTransitionTime: "2026-02-16T10:00:00Z"
    - type: Succeeded
      status: "True"
      reason: WorkloadSucceeded
      message: "Workload succeeded"
      lastTransitionTime: "2026-02-16T10:05:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-02-16T10:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-bw-final-workload
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: test-bw-final-workload-launcher-0-0
  namespace: default
  labels:
    jobset.sigs.k8s.io/jobset-name: test-bw-final-workload
    jobset.sigs.k8s.io/replicatedjob-name: launcher
    batch.kubernetes.io/job-completion-index: "0"
    nvcre.nvidia.com/job: test-bw-final-job
spec:
  containers:
    - name: node
      image: test-image:latest
status:
  phase: Succeeded
---
# The live samples stopped before the largest message size and counted the rows
# they saw more than once. Neither may reach a verdict (issue #404).
apiVersion: nvcre.nvidia.com/v1alpha1
kind: BandwidthMeasurement
metadata:
  name: test-bw-final
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-bw-final-job
  logProfileRef: nccl-final-read-test
  sampleInterval: 1s
status:
  results:
    - sizeBytes: 8
      algBW: "0.00"
      busBW: "0.00"
      samples: 5
    - sizeBytes: 1048576
      algBW: "14.00"
      busBW: "27.00"
      samples: 5
