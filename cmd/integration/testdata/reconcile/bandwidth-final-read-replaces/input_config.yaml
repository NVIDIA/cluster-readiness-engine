# The Job has succeeded and the measurement holds provisional samples that
# stop short of the largest message size. It completes from the launcher's
# full log instead: every row counted once, two cycles per size averaged and
# rounded once, the provisional samples replaced (issue #404).
waitFor:
  kind: BandwidthMeasurement
  name: test-bw-final
  namespace: default
  condition: Complete
collect:
  - kind: BandwidthMeasurement
    name: test-bw-final
    namespace: default
