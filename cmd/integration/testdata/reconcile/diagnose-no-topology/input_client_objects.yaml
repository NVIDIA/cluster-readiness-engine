apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-diagnose-no-topo
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 3
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    diagnose:
      minGroupSize: 2
