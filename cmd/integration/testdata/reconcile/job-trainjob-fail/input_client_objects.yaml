apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-trainjob-fail
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: nvcr.io/nvidia/nemo:24.07
        command:
          - torchrun
          - train.py
        numNodes: 2
