# A measurement is available, so the invalid CEL expression reaches evaluation
# rather than taking the missing-measurement timeout path.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-invalid-threshold-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command: [mpirun]
    numNodes: 1
status:
  conditions:
    - type: Complete
      status: "True"
      reason: JobCompleted
      message: All workers completed
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-invalid-threshold
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command: [mpirun]
        numNodes: 1
  bandwidthMeasurement:
    logProfileRef: nccl-bandwidth
    testType: all_reduce
  thresholds:
    busBandwidthGBps: "value >= "
status:
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-invalid-threshold-workload
    namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: BandwidthMeasurement
metadata:
  name: test-invalid-threshold-bandwidth
  namespace: default
spec:
  jobRef:
    apiGroup: nvcre.nvidia.com
    kind: Job
    name: test-invalid-threshold
  logProfileRef: nccl-bandwidth
  testType: all_reduce
status:
  results:
    - sizeBytes: 17179869184
      algBW: "245.50"
      busBW: "370.14"
      samples: 1
