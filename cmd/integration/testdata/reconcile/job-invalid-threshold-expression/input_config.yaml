waitFor:
  kind: Job
  name: test-invalid-threshold
  namespace: default
  condition: ValidationFailed
  reason: InvalidThresholdExpression
collect:
  - kind: Job
    name: test-invalid-threshold
    namespace: default
events:
  - involvedKind: Job
    involvedName: test-invalid-threshold
    namespace: default
    expect:
      - {type: Normal, reason: WorkloadCompleted}
      - {type: Warning, reason: InvalidThresholdExpression}
