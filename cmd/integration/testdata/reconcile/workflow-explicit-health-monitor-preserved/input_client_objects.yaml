# A Workflow without the cordoned-node opt-in keeps its own explicit nodeHealthMonitor.
apiVersion: v1
kind: Node
metadata:
  name: explicit-monitor-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100"
    kubernetes.io/hostname: explicit-monitor-node-01
spec:
  providerID: "aws://us-east-1a/i-dddd0001"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-explicit-monitor-preserved
  namespace: default
spec:
  jobTemplate:
    spec:
      nodeHealthMonitor:
        cel:
          expression: 'node.metadata.labels["nvidia.com/gpu.unhealthy"] == "true"'
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
