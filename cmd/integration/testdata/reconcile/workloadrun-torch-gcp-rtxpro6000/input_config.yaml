# Collect resolved objects: the Workflow retains its conditional templates.
# The Job carries trainer env/MPI rank arguments; the runtime carries GPU tolerations.
waitFor:
  kind: Workflow
  name: test-torch-gcp-rtxpro6000-run
  namespace: default
  condition: InProgress
  reason: JobRunning
collect:
  - kind: WorkloadRun
    name: test-torch-gcp-rtxpro6000-run
    namespace: default
  - kind: Job
    name: test-torch-gcp-rtxpro6000-run-job
    namespace: default
  - kind: TrainingRuntime
    name: test-torch-gcp-rtxpro6000-run-runtime-4bf7a-job
    namespace: default
