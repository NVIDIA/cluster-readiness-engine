# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: onprem-nc-h20-communicati-7bb04
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: onprem-nc-h20
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: onprem-nc-h20
    namespace: default
  - kind: Workflow
    name: onprem-nc-h20-communicati-7bb04
    namespace: default
events:
  - involvedKind: Certification
    involvedName: onprem-nc-h20
    namespace: default
    expect:
      - {type: Warning, reason: GPUArchitectureDefaults}
      - {type: Normal, reason: WorkflowCreated}
