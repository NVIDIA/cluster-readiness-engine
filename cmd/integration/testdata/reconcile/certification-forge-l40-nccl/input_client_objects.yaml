apiVersion: v1
kind: Node
metadata:
  name: forge-l40-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40
    kubernetes.io/hostname: forge-l40-node-01
spec:
  providerID: ""
---
apiVersion: v1
kind: Node
metadata:
  name: forge-l40-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40
    kubernetes.io/hostname: forge-l40-node-02
spec:
  providerID: ""
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: forge-l40-nc
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40
  categories:
    - domain: communication
      variant: nccl-all-reduce
