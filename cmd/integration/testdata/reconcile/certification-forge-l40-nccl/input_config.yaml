# The Certification reports WorkflowRunning once its Workflow exists, before
# that Workflow reaches JobRunning. Waiting on the Certification alone can
# collect the Workflow still at JobCreated.
steps:
  - waitFor:
      kind: Workflow
      name: forge-l40-nc-communicatio-84d5e
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: forge-l40-nc
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: forge-l40-nc
    namespace: default
  - kind: Workflow
    name: forge-l40-nc-communicatio-84d5e
    namespace: default
