# The auto-select hole, closed end to end.
#
# With nodesPerJob unset, resolveNodesPerJob's Pinned path sets the ceiling to
# the whole matching fleet and hands back every node, so the job is templated at
# numNodes: 8 and spans the cluster. Nothing downstream objects: 8 is a perfectly
# valid node count, and the Workflow tier's own nodesPerJob < 1 guard never sees
# it because the auto-selected value was baked into the template before the
# Workflow existed.
#
# That is the one path placement: Unpinned would otherwise leave intact, and it
# produces exactly the fleet-spanning job Unpinned exists to escape. So the
# assertion here is a terminal failure naming the missing field, not a job.
#
# The Certification is named unpin-ns so <cert>-<domain>-<variant> stays under
# the 31-character Workflow name limit and the expectAbsent name below is the
# literal one the controller would have used.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: unpin-ns
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  # nodesPerJob deliberately omitted. This is the whole test.
  placement: Unpinned
  categories:
    - domain: training
      variant: nemotron5-8b
