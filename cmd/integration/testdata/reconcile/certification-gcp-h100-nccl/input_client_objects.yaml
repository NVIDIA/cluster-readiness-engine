apiVersion: v1
kind: Node
metadata:
  name: gcp-h100-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gcp-h100-node-01
spec:
  providerID: "gce://my-project/us-central1-a/gcp-h100-node-01"
---
apiVersion: v1
kind: Node
metadata:
  name: gcp-h100-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gcp-h100-node-02
spec:
  providerID: "gce://my-project/us-central1-a/gcp-h100-node-02"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gcp-nc-h1
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  categories:
    - domain: communication
      variant: nccl-all-reduce
