# unpin-h1-communication-nccl-all-reduce is 38 characters, past the 31-character
# Workflow limit, so naming.Truncate cuts and hashes it. The placement token in
# categoryOptionsSuffix only appears when placement is set per-category; here it
# is set globally on the Certification, so the suffix is empty and the name is
# the plain truncation.
#
# The Job is collected alongside the Workflow because the tolerations are the
# point of this case and they live on the Job, not the Workflow.
waitFor:
  kind: Workflow
  name: unpin-h1-communication-nc-2e2e5
  namespace: default
  condition: InProgress
  reason: JobRunning
collect:
  - kind: Certification
    name: unpin-h1
    namespace: default
  - kind: Workflow
    name: unpin-h1-communication-nc-2e2e5
    namespace: default
  - kind: Job
    name: unpin-h1-communication-nc-2e2e5-job
    namespace: default
