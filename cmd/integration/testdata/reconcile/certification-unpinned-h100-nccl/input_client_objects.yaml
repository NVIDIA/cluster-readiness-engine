# Unpinned on the non-GB200 Certification path.
#
# certification-unpinned-gb200-nemotron covers the reviewer's own spec, but it
# covers it on the one architecture where a catalog override injects a topology
# key and a ComputeDomain behind the operator's back. That makes it the right
# regression test and the wrong baseline: if it were the only Certification-tier
# case, a rule that happened to depend on the gb200 override firing would look
# correct.
#
# So this is the plain one. H100, no ComputeDomain, no injected topology, an MPI
# workload rather than torch. The MPI part is load-bearing: ADR-023 justified the
# blanket Operator: Exists toleration on the grounds that workloads are pinned to
# named hosts anyway, which stops being true here, so the golden is what pins
# that the fallback is dropped under Unpinned and only explicit taintSelectors
# tolerations survive.
#
# Four nodes against a two-node request, so Pinned would give two jobs.
apiVersion: v1
kind: Node
metadata:
  name: unpin-h1-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: unpin-h1-node-01
spec:
  providerID: "aws://us-east-1a/i-0c01"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-h1-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: unpin-h1-node-02
spec:
  providerID: "aws://us-east-1a/i-0c02"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-h1-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: unpin-h1-node-03
spec:
  providerID: "aws://us-east-1a/i-0c03"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpin-h1-node-04
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: unpin-h1-node-04
spec:
  providerID: "aws://us-east-1a/i-0c04"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: unpin-h1
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  nodesPerJob: 2
  placement: Unpinned
  categories:
    - domain: communication
      variant: nccl-all-reduce
