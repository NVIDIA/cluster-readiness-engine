# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: aws-rtx-n5-training-nemot-24e6b
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: aws-rtx-n5
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: aws-rtx-n5
    namespace: default
  - kind: Job
    name: aws-rtx-n5-training-nemot-24e6b-job
    namespace: default
  - kind: TrainingRuntime
    name: nemotron5-8b-runtime-24e6b-job
    namespace: default
