waitFor:
  kind: Workflow
  name: test-workflow-hw-fail
  namespace: default
  condition: Failed
collect:
  - kind: Workflow
    name: test-workflow-hw-fail
    namespace: default
events:
  - involvedKind: Workflow
    involvedName: test-workflow-hw-fail
    namespace: default
    expect:
      - {type: Normal, reason: JobRunning}
      - {type: Warning, reason: JobHardwareFailed}
