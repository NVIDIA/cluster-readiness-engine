# The control for workflow-unpinned-single-job. Identical fleet, identical
# numNodes, placement omitted. Six nodes chunked into three 2-node groups, all
# three launched concurrently, every job pinned to its group by hostname.
#
# This is the behavior the reviewer hit and it is deliberately preserved: ADR-089
# makes Unpinned opt-in rather than changing the default. The pair of cases is
# what makes that claim checkable, since a golden showing one job proves nothing
# about the default unless another golden shows the default still partitions.
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-01
spec:
  providerID: "aws://us-east-1a/i-0b01"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-02
spec:
  providerID: "aws://us-east-1a/i-0b02"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-03
spec:
  providerID: "aws://us-east-1a/i-0b03"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-04
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-04
spec:
  providerID: "aws://us-east-1a/i-0b04"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-05
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-05
spec:
  providerID: "aws://us-east-1a/i-0b05"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: pinned-default-node-06
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: pinned-default-node-06
spec:
  providerID: "aws://us-east-1a/i-0b06"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: pinned-default
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    # placement deliberately omitted. Empty means Pinned, which is enforced in
    # code rather than by a kubebuilder default: a string default would
    # materialize into every existing object's serialized spec on the next write
    # and move goldens that otherwise would not move.
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
