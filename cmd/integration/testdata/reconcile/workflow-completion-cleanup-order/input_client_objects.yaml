# Workflow with a workflow-scoped ConfigMap dependency and a succeeded TrainJob.
# The Job controller detects the TrainJob success and marks the Job Succeeded.
# The Workflow controller then calls setFinalStatus(), which should delete
# Jobs BEFORE cleaning up dependencies (ADR-053). The test verifies the Workflow
# reaches Succeeded and deps are cleaned up.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-wf-comp-deps
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  dependencyRefs:
    - apiVersion: v1
      kind: ConfigMap
      name: test-comp-dep-config
      namespace: default
      scope: workflow
  orchestration:
    totalNodes: 1
    nodesPerJob: 1
    totalGroups: 1
    currentIteration: 1
    completedIterations: 0
    groups:
      - name: group-0
        nodes:
          - gpu-node-01
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-wf-comp-deps-group-0-iter-1
          namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-wf-comp-deps-group-0-iter-1
  namespace: default
  labels:
    app.kubernetes.io/managed-by: cluster-readiness-engine
    nvcre.nvidia.com/workflow: test-wf-comp-deps
    nvcre.nvidia.com/group: group-0
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: "Workload is running"
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-wf-comp-deps-group-0-iter-1-workload
    namespace: default
---
# Succeeded TrainJob workload.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-wf-comp-deps-group-0-iter-1-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
  suspend: false
  managedBy: trainer.kubeflow.org/trainjob-controller
status:
  conditions:
    - type: Complete
      status: "True"
      reason: TrainJobComplete
      message: "Training job completed"
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
# Workflow-scoped ConfigMap dependency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-comp-dep-config
  namespace: default
  labels:
    nvcre.nvidia.com/workflow: test-wf-comp-deps
data:
  config.yaml: |
    test: completion-data
