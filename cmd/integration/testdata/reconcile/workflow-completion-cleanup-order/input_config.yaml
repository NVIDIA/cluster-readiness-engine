# Wait for the Workflow to reach Succeeded. The controllers propagate
# TrainJob success → Job success → Workflow setFinalStatus() → Succeeded.
# setFinalStatus() should delete Jobs before dependencies (ADR-053).
# Collect the Workflow to verify it reached Succeeded with deps cleaned up.
waitFor:
  kind: Workflow
  name: test-wf-comp-deps
  namespace: default
  condition: Succeeded
collect:
  - kind: Workflow
    name: test-wf-comp-deps
    namespace: default
