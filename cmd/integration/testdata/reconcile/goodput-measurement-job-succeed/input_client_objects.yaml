apiVersion: cre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: test-logprofile
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  patterns:
    trainingStep:
      regex: 'step (?P<globalStep>\d+)'
      example: "step 100"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-gm-succeed-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: WorkloadCompleted
      message: "Workload has completed"
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Succeeded
      status: "True"
      reason: WorkloadSucceeded
      message: "Workload succeeded"
      lastTransitionTime: "2026-01-22T10:05:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-gm-succeed
  namespace: default
spec:
  jobRef:
    apiGroup: cre.nvidia.com
    kind: Job
    name: test-gm-succeed-job
  logProfileRef: test-logprofile
  sampleInterval: 1s
