apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: event-heterogeneous-platform
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command: [echo, test]
            numNodes: 1
  orchestration:
    target:
      nodeSelector:
        event-case: event-heterogeneous-platform
---
apiVersion: v1
kind: Node
metadata:
  name: event-heterogeneous-platform-aws
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    event-case: event-heterogeneous-platform
spec:
  providerID: aws://us-east-1a/i-0123456789abcdef0
---
apiVersion: v1
kind: Node
metadata:
  name: event-heterogeneous-platform-gcp
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    event-case: event-heterogeneous-platform
spec:
  providerID: gce://project/zone/instance
