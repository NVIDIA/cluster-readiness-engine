# Each iteration's workload is completed only after the Workflow has recorded
# that iteration's placement (groupNodesRecorded), so the reset between
# iterations is clearing a real list. The first wait is on the Workflow rather
# than the Job for that reason; the second is as well, because iteration 2's
# group starts out with the list the reset emptied and must be seen refilled
# from the new pods before its workload is completed.
#
# The golden pins: group-0 nodes are iteration 2's pair, iterationHistory holds
# iteration 1 as Succeeded under its own Job name, and the Workflow succeeded.
# A missing reset would leave iteration 1's pair on the group.
steps:
  - waitFor:
      kind: Workflow
      name: unpin-iterattr
      namespace: default
      condition: InProgress
      reason: JobRunning
      groupNodesRecorded: true
    patches:
      # The workers exit before the TrainJob reports Complete. A Succeeded pod
      # still records where it ran, which is what attribution reads.
      - target:
          kind: Pod
          name: unpin-iterattr-iter1-worker-0
          namespace: default
        status: true
        patch:
          status:
            phase: Succeeded
      - target:
          kind: Pod
          name: unpin-iterattr-iter1-worker-1
          namespace: default
        status: true
        patch:
          status:
            phase: Succeeded
      - target:
          kind: TrainJob
          name: unpin-iterattr-group-0-iter-1-workload
          namespace: default
        status: true
        patch:
          status:
            conditions:
              - type: Complete
                status: "True"
                reason: JobCompleted
                message: All workers completed
                lastTransitionTime: "2026-01-22T10:00:00Z"
  - waitFor:
      kind: Job
      name: unpin-iterattr-group-0-iter-2
      namespace: default
      condition: InProgress
      reason: WorkloadRunning
    patches: []
  - waitFor:
      kind: Workflow
      name: unpin-iterattr
      namespace: default
      condition: InProgress
      reason: JobRunning
      groupNodesRecorded: true
    patches:
      - target:
          kind: Pod
          name: unpin-iterattr-iter2-worker-0
          namespace: default
        status: true
        patch:
          status:
            phase: Succeeded
      - target:
          kind: Pod
          name: unpin-iterattr-iter2-worker-1
          namespace: default
        status: true
        patch:
          status:
            phase: Succeeded
      - target:
          kind: TrainJob
          name: unpin-iterattr-group-0-iter-2-workload
          namespace: default
        status: true
        patch:
          status:
            conditions:
              - type: Complete
                status: "True"
                reason: JobCompleted
                message: All workers completed
                lastTransitionTime: "2026-01-22T10:05:00Z"
waitFor:
  kind: Workflow
  name: unpin-iterattr
  namespace: default
  condition: Succeeded
collect:
  - kind: Workflow
    name: unpin-iterattr
    namespace: default
