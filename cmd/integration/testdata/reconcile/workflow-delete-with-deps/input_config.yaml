# Wait for the Workflow to reach Failed (controllers propagate TrainJob failure
# → Job failure → Workflow failure). Then delete the Workflow and verify the
# entire cascade (Workflow → Job → TrainJob) AND the dependency ConfigMap are
# cleaned up. This tests that handleDeletion() deletes Jobs before dependencies
# (ADR-053: ordered dependency deletion).
waitFor:
  kind: Workflow
  name: test-wf-del-deps
  namespace: default
  condition: Failed
deleteAfterWait:
  - kind: Workflow
    name: test-wf-del-deps
    namespace: default
waitForDeletion:
  - kind: Workflow
    name: test-wf-del-deps
    namespace: default
  - kind: Job
    name: test-wf-del-deps-group-0-iter-1
    namespace: default
  - kind: TrainJob
    name: test-wf-del-deps-group-0-iter-1-workload
    namespace: default
  - kind: ConfigMap
    name: test-dep-config
    namespace: default
collect: []
