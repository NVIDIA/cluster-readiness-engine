apiVersion: v1
kind: Node
metadata:
  name: event-rejected-node
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    event-rejected: "true"
spec:
  providerID: aws://us-east-1a/i-0123456789abcdef0
status:
  capacity:
    nvidia.com/gpu: "8"
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: event-rejected-cert
  namespace: default
spec:
  target:
    nodeSelector:
      event-rejected: "true"
  nodesPerJob: 1
  categories:
    - domain: communication
      variant: nccl-all-reduce
