# The Workflow is what carries the resolved composition: the Job template's
# workloadMetadata and the persisted gangScheduler intent with both defaults
# filled in. Collecting it alongside the Certification makes the controller's
# output directly comparable with the nvcrectl fixtures in pkg/certification.
# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: runai-labels-communicatio-4817e
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: runai-labels
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: runai-labels
    namespace: default
  - kind: Workflow
    name: runai-labels-communicatio-4817e
    namespace: default
