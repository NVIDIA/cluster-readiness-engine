# The Failed condition must name the reserved volume, and the Workflow must
# not exist: the collision is detected while composing the Workflow spec,
# before anything is submitted.
waitFor:
  kind: WorkloadRun
  name: wr-mpi-reserved-volume
  namespace: default
  condition: Failed
  reason: BuildFailed
collect:
  - kind: WorkloadRun
    name: wr-mpi-reserved-volume
    namespace: default
expectAbsent:
  - kind: Workflow
    name: wr-mpi-reserved-volume
    namespace: default
