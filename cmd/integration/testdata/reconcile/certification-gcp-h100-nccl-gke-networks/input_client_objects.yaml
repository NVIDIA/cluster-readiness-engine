# GCP H100 (A3 Mega) nodes provisioned the way AICR does it: the eight GPU NIC
# Networks are named "<deployment-id>-gpu-nic-N", not the catalog's historical
# gpu-nic0..gpu-nic7. The nodes advertise them in allocatable (with the ".IP"
# twins GKE adds) and carry the north-interfaces/nic-info annotations, so the
# controller detects them and the TCPXO TrainingRuntime attaches
# aicr-uat-gpu-nic-0..7 on eth1..eth8. With the hardcoded names, GKE would
# reject every worker pod at admission (issue #432).
apiVersion: v1
kind: Node
metadata:
  name: gcp-h100-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gcp-h100-node-01
  annotations:
    networking.gke.io/north-interfaces: '[{"network":"aicr-uat-gpu-nic-0","ipAddress":"192.168.0.3"},{"network":"aicr-uat-gpu-nic-1","ipAddress":"192.168.16.3"},{"network":"aicr-uat-gpu-nic-2","ipAddress":"192.168.32.3"},{"network":"aicr-uat-gpu-nic-3","ipAddress":"192.168.48.3"},{"network":"aicr-uat-gpu-nic-4","ipAddress":"192.168.64.3"},{"network":"aicr-uat-gpu-nic-5","ipAddress":"192.168.80.3"},{"network":"aicr-uat-gpu-nic-6","ipAddress":"192.168.96.3"},{"network":"aicr-uat-gpu-nic-7","ipAddress":"192.168.112.3"}]'
    networking.gke.io/nic-info: '[{"birthIP":"10.0.0.15","pciAddress":"0000:00:0c.0","birthName":"eth0"},{"birthIP":"192.168.0.3","pciAddress":"0000:06:00.0","birthName":"eth1"},{"birthIP":"192.168.16.3","pciAddress":"0000:07:00.0","birthName":"eth2"},{"birthIP":"192.168.32.3","pciAddress":"0000:0d:00.0","birthName":"eth3"},{"birthIP":"192.168.48.3","pciAddress":"0000:0e:00.0","birthName":"eth4"},{"birthIP":"192.168.64.3","pciAddress":"0000:86:00.0","birthName":"eth5"},{"birthIP":"192.168.80.3","pciAddress":"0000:87:00.0","birthName":"eth6"},{"birthIP":"192.168.96.3","pciAddress":"0000:8d:00.0","birthName":"eth7"},{"birthIP":"192.168.112.3","pciAddress":"0000:8e:00.0","birthName":"eth8"}]'
spec:
  providerID: "gce://my-project/us-central1-c/gcp-h100-node-01"
status:
  capacity:
    nvidia.com/gpu: "8"
    networking.gke.io.networks/aicr-uat-gpu-nic-0: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-0.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-1: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-1.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-2: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-2.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-3: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-3.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-4: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-4.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-5: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-5.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-6: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-6.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-7: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-7.IP: "1"
  allocatable:
    nvidia.com/gpu: "8"
    networking.gke.io.networks/aicr-uat-gpu-nic-0: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-0.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-1: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-1.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-2: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-2.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-3: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-3.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-4: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-4.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-5: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-5.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-6: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-6.IP: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-7: "1"
    networking.gke.io.networks/aicr-uat-gpu-nic-7.IP: "1"
---
