# Job succeeded long ago but bandwidth measurement data never arrived.
# The controller should detect the measurement timeout and set ValidationFailed
# with reason MeasurementTimeout.
waitFor:
  kind: Job
  name: test-bw-timeout
  namespace: default
  condition: ValidationFailed
collect:
  - kind: Job
    name: test-bw-timeout
    namespace: default
