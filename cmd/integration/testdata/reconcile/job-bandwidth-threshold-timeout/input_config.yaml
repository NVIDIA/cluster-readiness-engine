# Job succeeded long ago but bandwidth measurement data never arrived.
# The controller should detect the measurement timeout and set ValidationFailed
# with reason MeasurementTimeout.
waitFor:
  kind: Job
  name: test-bw-timeout
  namespace: default
  condition: ValidationFailed
  reason: MeasurementTimeout
collect:
  - kind: Job
    name: test-bw-timeout
    namespace: default
events:
  - involvedKind: Job
    involvedName: test-bw-timeout
    namespace: default
    expect:
      - {type: Normal, reason: WorkloadCompleted}
      - {type: Warning, reason: MeasurementTimeout}
