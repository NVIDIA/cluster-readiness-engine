# NIC resource auto-detection, ambiguous variant (ADR-075): the certification
# sets no nicResourceName and every target node advertises TWO candidates
# (rdma/ib and nvidia.com/mlnxnics, both allocatable > 0 everywhere).
# Detection refuses to guess: the rendered TrainingRuntime carries no NIC
# resource request (today's field-unset behavior) and the controller emits a
# Normal NICResourceDetection event naming both candidates (events are not
# collected by this harness; the golden pins the no-injection outcome).
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-ambig-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-ambig-node-01
    kubernetes.io/arch: arm64
status:
  allocatable:
    nvidia.com/gpu: "4"
    rdma/ib: "1"
    nvidia.com/mlnxnics: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: onprem-gb300-ambig-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: onprem-gb300-ambig-node-02
    kubernetes.io/arch: arm64
status:
  allocatable:
    nvidia.com/gpu: "4"
    rdma/ib: "1"
    nvidia.com/mlnxnics: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-nc-g3-ambig
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        mlnxPerNode: 1
