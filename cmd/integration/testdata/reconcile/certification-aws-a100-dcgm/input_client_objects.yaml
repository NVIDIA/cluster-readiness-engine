apiVersion: v1
kind: Node
metadata:
  name: aws-a100-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
    kubernetes.io/hostname: aws-a100-node-01
spec:
  providerID: "aws://us-east-1a/i-0000000000000001"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-a100-dcgm
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
  categories:
    - domain: diagnostics
      variant: dcgm-level4
