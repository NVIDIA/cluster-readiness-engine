# A Certification whose status.categoryStatuses already references a Workflow
# the Certification does NOT control (no owner reference) — the state an
# unverified AlreadyExists adoption used to leave behind. On Certification
# deletion the finalizer must skip the foreign Workflow: it survives.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: foreign-wf-keep
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: user-runtime
          trainer:
            image: user-image:latest
            command:
              - python
              - user_train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        example.com/user-pool: "true"
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-01T00:00:00Z"
    - type: Failed
      status: "True"
      reason: JobFailed
      message: "User job failed"
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: cert-del-foreign
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
status:
  categoryStatuses:
    - domain: communication
      variant: nccl-all-reduce
      status: Failed
      workflowRef:
        name: foreign-wf-keep
        namespace: default
