apiVersion: v1
kind: Node
metadata:
  name: immut-run-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: immut-run-node-01
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcde20"
---
apiVersion: v1
kind: Node
metadata:
  name: immut-run-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: immut-run-node-02
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcde21"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: immutable-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  image: nvcr.io/nvidia/pytorch:25.08-py3
  framework:
    torch:
      script: /config/train.sh
  numNodes: 2
  env:
    - name: CUDA_DEVICE_MAX_CONNECTIONS
      value: "1"
  config:
    inline:
      train.sh: |
        #!/bin/bash
        echo "training"
