# Every matching node reports fewer allocatable GPUs than the workload
# requests per node. The run must fail up front naming the requirement and
# the best available count, not partition into groups that can never
# schedule and hang until the timeout (issue #82).
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100"
    kubernetes.io/hostname: gpu-node-01
status:
  allocatable:
    nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100"
    kubernetes.io/hostname: gpu-node-02
status:
  allocatable:
    nvidia.com/gpu: "2"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-no-gpu-capacity
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
            resourcesPerNode:
              requests:
                nvidia.com/gpu: "8"
              limits:
                nvidia.com/gpu: "8"
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
