# Workflow with a running group whose Job no longer exists (externally deleted).
# No Job object is present — the Workflow controller should detect NotFound
# and mark the group as Failed.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-workflow-job-deleted
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  orchestration:
    totalNodes: 1
    nodesPerJob: 1
    totalGroups: 1
    currentIteration: 1
    groups:
      - name: group-0
        nodes:
          - gpu-node-01
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-workflow-job-deleted-job
          namespace: default
