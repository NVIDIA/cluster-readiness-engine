# The reviewer's actual spec, and the case that catches the mistake an earlier
# draft of ADR-089 would have shipped.
#
# nemotron5-8b carries an override gated on gpuArchitecture in [gb200, gb300]
# that injects orchestration.topology.topologyKey: nvidia.com/gpu.clique along
# with the ComputeDomain dependency. Overrides are applied before the placement
# check runs, so by then the topology key is on the spec even though the operator
# never wrote it. A validation rule that rejected Unpinned alongside any topology
# block would fail this exact run with a message about an invisible field, and
# the feature would be dead on arrival for the only person who asked for it.
#
# So the assertion is the unexciting one: the Workflow builds. Plus totalGroups
# is 1 rather than the four this eight-node fleet would otherwise produce, and
# the ComputeDomain's numNodes matches the trainer's. That last one is invisible
# in the Go code: both are templated from the same NodesPerJob, which is why
# SetNumNodes is skipped under Unpinned rather than clamped. Rewriting the
# trainer's count without rewriting the ComputeDomain's would leave pods waiting
# on a DRA allocation that never arrives, with nothing naming the cause.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: unpin-gb2
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 2
  placement: Unpinned
  categories:
    - domain: training
      variant: nemotron5-8b
