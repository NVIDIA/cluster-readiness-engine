apiVersion: v1
kind: Namespace
metadata:
  name: access-revoked-workload
  labels:
    test.nvcre.nvidia.com/access: denied
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: wf-revoked-workload
  namespace: access-revoked-workload
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  orchestration:
    totalNodes: 1
    nodesPerJob: 1
    totalGroups: 1
    currentIteration: 1
    groups:
      - name: group-0
        nodes:
          - gpu-node-01
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: wf-revoked-workload-job
          namespace: access-revoked-workload
---
# The group's Job exists but has not created its TrainJob: the binding was
# removed in between, so every TrainJob create is forbidden.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: wf-revoked-workload-job
  namespace: access-revoked-workload
  labels:
    app.kubernetes.io/managed-by: nvcre
    nvcre.nvidia.com/workflow: wf-revoked-workload
    nvcre.nvidia.com/group: group-0
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
