# x86 HGX B300 on-prem with a shared RDMA device plugin (ADR-092): the
# certification sets no nicResourceName, every node advertises exactly one
# candidate (rdma/rdma_shared_device_a, a pooled resource at 1000) plus an
# unused pool at 0, so detection picks the live pool at the requested count of
# 1 and the rendered TrainingRuntime carries it. The architecture is listed
# in gpu-defaults.yaml, so no GPUArchitectureDefaults warning is emitted and
# the runtime is sized at eight ranks per node.
apiVersion: v1
kind: Node
metadata:
  name: onprem-b300-auto-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: onprem-b300-auto-node-01
    kubernetes.io/arch: amd64
status:
  allocatable:
    nvidia.com/gpu: "8"
    rdma/rdma_shared_device_a: "1000"
    rdma/rdmashared: "0"
---
apiVersion: v1
kind: Node
metadata:
  name: onprem-b300-auto-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: onprem-b300-auto-node-02
    kubernetes.io/arch: amd64
status:
  allocatable:
    nvidia.com/gpu: "8"
    rdma/rdma_shared_device_a: "1000"
    rdma/rdmashared: "0"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-nc-b3-auto
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        mlnxPerNode: 1
