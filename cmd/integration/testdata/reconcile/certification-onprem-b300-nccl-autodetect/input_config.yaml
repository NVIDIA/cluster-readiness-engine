waitFor:
  kind: Workflow
  name: onprem-nc-b3-auto-communi-7be70
  namespace: default
  condition: InProgress
  reason: JobRunning
collect:
  - kind: Certification
    name: onprem-nc-b3-auto
    namespace: default
  - kind: Workflow
    name: onprem-nc-b3-auto-communi-7be70
    namespace: default
events:
  # b300 is a listed architecture and detection found one candidate, so the
  # projection must contain neither GPUArchitectureDefaults nor
  # NICResourceDetection. WorkflowCreated is the last event the create path
  # emits, so waiting for it makes the projection deterministic.
  - involvedKind: Certification
    involvedName: onprem-nc-b3-auto
    namespace: default
    expect:
      - {type: Normal, reason: WorkflowCreated}
