# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: aws-rtx-lb-communication-12bb7
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: aws-rtx-lb
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: aws-rtx-lb
    namespace: default
  - kind: Job
    name: aws-rtx-lb-communication-12bb7-job
    namespace: default
  - kind: TrainingRuntime
    name: nccl-loopback-runtime-12bb7-job
    namespace: default
