apiVersion: cre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-job-scoped-deps
  namespace: default
spec:
  jobTemplate:
    spec:
      checkpoint:
        pvcName: my-pvc
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
  dependencies:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: my-pvc
        namespace: default
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
