apiVersion: v1
kind: Node
metadata:
  name: topo-fail-node-01
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: topo-fail-node-01
    nvidia.com/gpu.clique: clique-a
---
apiVersion: v1
kind: Node
metadata:
  name: topo-fail-node-02
  labels:
    nvidia.com/gpu.present: "true"
    kubernetes.io/hostname: topo-fail-node-02
    nvidia.com/gpu.clique: clique-a
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-topo-all-fail
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 2
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    topology:
      topologyKey: nvidia.com/gpu.clique
status:
  orchestration:
    totalNodes: 2
    nodesPerJob: 2
    totalGroups: 1
    currentIteration: 1
    groups:
      - name: group-0
        nodes:
          - topo-fail-node-01
          - topo-fail-node-02
        domains:
          - clique-a
        phase: Running
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: test-topo-all-fail-job
          namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-topo-all-fail-job
  namespace: default
  labels:
    app.kubernetes.io/managed-by: cluster-readiness-engine
    nvcre.nvidia.com/workflow: test-topo-all-fail
    nvcre.nvidia.com/group: group-0
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 2
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: WorkloadCompleted
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Failed
      status: "True"
      reason: WorkloadFailed
      message: "Workload failed after 6 restarts"
      lastTransitionTime: "2026-01-22T10:05:00Z"
