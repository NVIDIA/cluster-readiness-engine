apiVersion: v1
kind: Node
metadata:
  name: gcp-gb300-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: gcp-gb300-node-01
spec:
  providerID: "gce://my-project/us-central1-a/gcp-gb300-node-01"
---
apiVersion: v1
kind: Node
metadata:
  name: gcp-gb300-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB300-NVL72
    nvidia.com/gpu.clique: "clique-0"
    kubernetes.io/hostname: gcp-gb300-node-02
spec:
  providerID: "gce://my-project/us-central1-a/gcp-gb300-node-02"
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gcp-nc-g3
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB300-NVL72
  categories:
    - domain: communication
      variant: nccl-all-reduce
