generateNodes:
  count: 8
  providerID: "aws://us-east-1a/i-0000000000000001"
  labels:
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: "clique-0"
# The Certification moves from WorkflowCreated to WorkflowRunning on a
# reconcile of its own, after the Workflow exists. Waiting on the Workflow
# alone can collect the Certification before that reconcile runs.
steps:
  - waitFor:
      kind: Workflow
      name: aws-gb-training-nemotron5-56b
      namespace: default
      condition: InProgress
      reason: JobRunning
waitFor:
  kind: Certification
  name: aws-gb
  namespace: default
  condition: InProgress
  reason: WorkflowRunning
collect:
  - kind: Certification
    name: aws-gb
    namespace: default
  - kind: Workflow
    name: aws-gb-training-nemotron5-56b
    namespace: default
  - kind: Job
    name: aws-gb-training-nemotron5-56b-job
    namespace: default
