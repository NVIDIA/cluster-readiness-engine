apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-gb
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 8
  categories:
    - domain: training
      variant: nemotron5-56b
