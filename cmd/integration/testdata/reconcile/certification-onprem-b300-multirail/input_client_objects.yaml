# x86 HGX B300 on-prem with a Spectrum-X style multi-rail fabric (issue #400):
# every node advertises one extended resource per rail (nvidia.com/r0..r7)
# and the category lists one networkAttachments entry per rail, each naming
# its NetworkAttachmentDefinition. The nodes also advertise a single
# rdma/rdma_shared_device_a pool, which NIC auto-detection would pick on its
# own; an explicit list owns the NIC wiring, so detection must not run and
# the runtime must request only the eight rails. The golden pins the worker
# pod's k8s.v1.cni.cncf.io/networks annotation in rail order, the per-rail
# limits and requests on the node container, and the launcher left untouched.
# The category options carry the -net8-<hash8> suffix token, so the Workflow
# name differs from the same category without attachments (here the name is
# long enough that naming.Truncate hashes it).
apiVersion: v1
kind: Node
metadata:
  name: onprem-b300-mr-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: onprem-b300-mr-node-01
    kubernetes.io/arch: amd64
status:
  allocatable:
    nvidia.com/gpu: "8"
    rdma/rdma_shared_device_a: "1000"
    nvidia.com/r0: "1"
    nvidia.com/r1: "1"
    nvidia.com/r2: "1"
    nvidia.com/r3: "1"
    nvidia.com/r4: "1"
    nvidia.com/r5: "1"
    nvidia.com/r6: "1"
    nvidia.com/r7: "1"
---
apiVersion: v1
kind: Node
metadata:
  name: onprem-b300-mr-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    kubernetes.io/hostname: onprem-b300-mr-node-02
    kubernetes.io/arch: amd64
status:
  allocatable:
    nvidia.com/gpu: "8"
    rdma/rdma_shared_device_a: "1000"
    nvidia.com/r0: "1"
    nvidia.com/r1: "1"
    nvidia.com/r2: "1"
    nvidia.com/r3: "1"
    nvidia.com/r4: "1"
    nvidia.com/r5: "1"
    nvidia.com/r6: "1"
    nvidia.com/r7: "1"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-mr-b3
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        networkAttachments:
          - {network: nvcre/r0, resourceName: nvidia.com/r0}
          - {network: nvcre/r1, resourceName: nvidia.com/r1}
          - {network: nvcre/r2, resourceName: nvidia.com/r2}
          - {network: nvcre/r3, resourceName: nvidia.com/r3}
          - {network: nvcre/r4, resourceName: nvidia.com/r4}
          - {network: nvcre/r5, resourceName: nvidia.com/r5}
          - {network: nvcre/r6, resourceName: nvidia.com/r6}
          - {network: nvcre/r7, resourceName: nvidia.com/r7}
