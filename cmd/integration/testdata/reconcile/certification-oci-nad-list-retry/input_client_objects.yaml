apiVersion: v1
kind: Node
metadata:
  name: oci-nad-retry-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40S
    kubernetes.io/hostname: oci-nad-retry-node-01
spec:
  providerID: "ocid1.instance.oc1.iad.anuwcljt00000000000000000000000000000000000000000000000001"
---
apiVersion: v1
kind: Node
metadata:
  name: oci-nad-retry-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-L40S
    kubernetes.io/hostname: oci-nad-retry-node-02
spec:
  providerID: "ocid1.instance.oc1.iad.anuwcljt00000000000000000000000000000000000000000000000002"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-nad-list-retry
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
  categories:
    - domain: communication
      variant: nccl-all-reduce
---
# AICR's layout (ADR-103): the platform's host-device NAD for nvidia.com/mlnxnics
# lives in nvidia-network-operator, not network-operator/sriov-net. No other case
# may use this namespace: envtest never finishes deleting one.
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-network-operator
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-net
  namespace: nvidia-network-operator
  annotations:
    k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
spec:
  config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
