# A mixed-architecture target for issue #248: the GB200 node sorts first, but
# the two H100 nodes are the majority. The WorkloadRun controller must detect
# h100 and bake its defaults into the Workflow (numProcPerNode/nvidia.com/gpu
# of 8, not gb200's 4; NCCL_MNNVL_ENABLE=0, not 1; the h100 EFA override, not
# the gb200 ComputeDomain one), matching the Workflow controller's filter that
# keeps only the H100 nodes.
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    kubernetes.io/hostname: gpu-node-01
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef0"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-02
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef1"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    kubernetes.io/hostname: gpu-node-03
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef2"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-mixed-arch-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  image: nvcr.io/nvidia/pytorch:25.08-py3
  framework:
    torch:
      script: /config/train.sh
  numNodes: 2
  config:
    inline:
      train.sh: |
        #!/bin/bash
        echo "training"
