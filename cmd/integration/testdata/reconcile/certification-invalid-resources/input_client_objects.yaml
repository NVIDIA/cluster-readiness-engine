# A per-category CPU request above its limit. Admission accepts it: the CRD
# cannot compare the two without a CEL rule that Kubernetes 1.29 through 1.33
# refuse to install (ADR-101). The controller must fail the Certification with
# InvalidResources before it creates any Workflow.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert-invalid-resources
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 2
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: "128"
          requests:
            cpu: "256"
