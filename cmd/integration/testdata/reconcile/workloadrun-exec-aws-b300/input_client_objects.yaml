# An exec WorkloadRun on AWS B300 (EFA) must get the 16-device EFA request and
# IPC_LOCK on the runtime, and the EFA transport env in the trainer env block.
apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300
    kubernetes.io/hostname: aws-b300-node-01
spec:
  providerID: "aws://us-west-2a/i-0000000000000001"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
---
apiVersion: v1
kind: Node
metadata:
  name: aws-b300-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-B300
    kubernetes.io/hostname: aws-b300-node-02
spec:
  providerID: "aws://us-west-2a/i-0000000000000002"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
  allocatable:
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "16"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-exec-aws-b300-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300
  image: nvcr.io/nvidia/pytorch:26.01-py3
  framework:
    exec:
      command: ["/bin/bash", "-c"]
      args: ["echo test"]
  numNodes: 2
  env:
    - name: USER_SETTING
      value: preserved
