apiVersion: v1
kind: Node
metadata:
  name: gcp-rtxpro6000-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
    kubernetes.io/hostname: gcp-rtxpro6000-node-01
spec:
  providerID: "gce://my-project/asia-northeast1-b/gcp-rtxpro6000-node-01"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "4"
  allocatable:
    nvidia.com/gpu: "4"
---
apiVersion: v1
kind: Node
metadata:
  name: gcp-rtxpro6000-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
    kubernetes.io/hostname: gcp-rtxpro6000-node-02
spec:
  providerID: "gce://my-project/asia-northeast1-b/gcp-rtxpro6000-node-02"
  taints:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
status:
  capacity:
    nvidia.com/gpu: "4"
  allocatable:
    nvidia.com/gpu: "4"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-exec-gcp-rtxpro6000-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
  image: nvcr.io/nvidia/pytorch:26.01-py3
  framework:
    exec:
      command: ["/bin/bash", "-c"]
      args: ["echo test"]
  numNodes: 2
  gpusPerNode: 4
  env:
    - name: USER_SETTING
      value: preserved
