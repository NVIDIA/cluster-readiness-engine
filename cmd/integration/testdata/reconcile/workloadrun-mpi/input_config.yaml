# Keep MPI construction checks, but initialize before the manager cache starts.
# Full cache-backed lifecycle coverage is pending #352.
initializeWorkloadRun: true
waitFor:
  kind: WorkloadRun
  name: test-mpi-run
  namespace: default
  condition: Failed
collect:
  - kind: WorkloadRun
    name: test-mpi-run
    namespace: default
  - kind: Workflow
    name: test-mpi-run
    namespace: default
events:
  - involvedKind: WorkloadRun
    involvedName: test-mpi-run
    namespace: default
    expect:
      - {type: Warning, reason: WorkflowFailed}
