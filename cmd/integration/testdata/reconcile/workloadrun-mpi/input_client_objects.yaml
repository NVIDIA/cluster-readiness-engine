apiVersion: v1
kind: Node
metadata:
  name: gpu-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    kubernetes.io/hostname: gpu-node-01
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef0"
---
apiVersion: v1
kind: Node
metadata:
  name: gpu-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    kubernetes.io/hostname: gpu-node-02
  annotations: {}
spec:
  providerID: "aws://us-east-1a/i-0123456789abcdef1"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: test-mpi-run
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  image: nvcr.io/nvidia/pytorch:26.01-py3
  framework:
    mpi:
      mpirunPath: /usr/local/mpi/bin/mpirun
      binary: /usr/local/bin/all_reduce_perf_mpi
      args: ["-b", "8", "-e", "32G", "-f", "2"]
      mpiArgs: ["--allow-run-as-root"]
  numNodes: 2
