# The WorkloadRun names a Workflow that the API server confirms is absent.
# A live read, not a cache miss, is what establishes the deletion (#352).
waitFor:
  kind: WorkloadRun
  name: deleted-workflow-run
  namespace: default
  condition: Failed
collect:
  - kind: WorkloadRun
    name: deleted-workflow-run
    namespace: default
events:
  - involvedKind: WorkloadRun
    involvedName: deleted-workflow-run
    namespace: default
    expect:
      - {type: Warning, reason: WorkflowDeleted}
