waitFor:
  kind: GoodputMeasurement
  name: test-goodput
  namespace: default
  condition: Measuring
collect:
  - kind: GoodputMeasurement
    name: test-goodput
    namespace: default
collectMetrics:
  namespace: default
  measurement: test-goodput
  sanitizeFields:
    - cre_goodput_training_time_seconds
    - cre_goodput_ratio
