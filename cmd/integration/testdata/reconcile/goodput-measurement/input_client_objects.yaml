apiVersion: cre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: nemotron-4-nemo
spec:
  timestamp:
    layout: "2006-01-02T15:04:05.999999999Z"
  patterns:
    trainingStep:
      regex: 'Training epoch (?P<epoch>\d+), iteration\s+(?P<iteration>\d+)/\d+.*global_step:\s*(?P<globalStep>\d+).*reduced_train_loss:\s*(?P<loss>[\d.]+)\s*\|\s*train_step_timing in s:\s*(?P<stepTiming>[\d.]+)(?:.*TFLOPS_per_GPU:\s*(?P<tflops>[\d.eE+\-]+))?'
      example: 'Training epoch 0, iteration 0/49 | lr: 8.982e-08 | global_batch_size: 64 | global_step: 0 | max_memory_reserved: 121987137536 | max_memory_allocated: 120549646336 | reduced_train_loss: 13.01 | train_step_timing in s: 42.45 | TFLOPS_per_GPU: 36.27'
      units:
        stepTiming: s
    checkpointSave:
      regex: 'Global Checkpoint Save\s*:\s*Rank:\s*\d+\s*:\s*Iteration:\s*(?P<step>\d+)\s*:\s*Save duration:\s*(?P<saveDuration>[\d.]+)s'
      example: '[NeMo I ...] Global Checkpoint Save : Rank: 0 : Iteration: 149 : Save duration: 439.017s'
      units:
        saveDuration: s
    applicationStart:
      regex: 'Application initialized'
      example: '[NeMo I 2026-01-22 10:20:00] Application initialized'
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-goodput-job-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-goodput-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: "Workload is running"
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-goodput-job-workload
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: test-goodput-job-workload-worker-0
  namespace: default
  labels:
    jobset.sigs.k8s.io/jobset-name: test-goodput-job-workload
    batch.kubernetes.io/job-completion-index: "0"
    cre.nvidia.com/job: test-goodput-job
spec:
  containers:
    - name: node
      image: test-image:latest
status:
  phase: Running
---
apiVersion: cre.nvidia.com/v1alpha1
kind: GoodputMeasurement
metadata:
  name: test-goodput
  namespace: default
spec:
  jobRef:
    apiGroup: cre.nvidia.com
    kind: Job
    name: test-goodput-job
  logProfileRef: nemotron-4-nemo
  sampleInterval: 1s
