# The two AICR-style A3 Mega nodes of certification-gcp-h100-nccl-gke-networks,
# plus a third H100 node that advertises only 4 GPUs and none of the GKE
# networks (for example a node still joining). The 8-GPU job can never run on
# it: the controller drops it before sizing the job, and the Workflow filters it
# out again. Detection reads the networks from the capable nodes only, so the
# TrainingRuntime still attaches aicr-uat-gpu-nic-0..7 and no fallback Warning
# is emitted. Had the third node counted, no network would be shared by every
# node and the gpu-nic0..gpu-nic7 fallback would have been rendered.
