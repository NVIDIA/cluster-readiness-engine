# A cordoned-node opt-in clears nodeHealthMonitor even when jobTemplate sets it explicitly.
apiVersion: v1
kind: Node
metadata:
  name: cordon-selected-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100"
    kubernetes.io/hostname: cordon-selected-node-02
spec:
  providerID: "aws://us-east-1a/i-cccc0002"
  unschedulable: true
  taints:
    - key: node.kubernetes.io/unschedulable
      effect: NoSchedule
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-cordoned-selected-explicit
  namespace: default
spec:
  jobTemplate:
    spec:
      nodeHealthMonitor:
        cel:
          expression: "node.spec.unschedulable == true"
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            numNodes: 1
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      taintSelectors:
        - key: node.kubernetes.io/unschedulable
          effect: NoSchedule
