# The regression test for the symptom that motivated ADR-089: a reviewer
# submitted an 8-GPU job against a fleet and got nine concurrent 2-node jobs
# instead of one.
#
# Six nodes, numNodes 2. Under Pinned the partitioner would chunk the fleet into
# three groups and launch all three at once, because PartitionNodes guarantees
# every discovered node lands in some group. Under Unpinned there is exactly one
# group, so the assertion that matters is totalGroups == 1 with totalNodes == 6:
# the other four nodes are deliberately not exercised.
#
# The Job is collected as well as the Workflow, because "one job" is only half
# the fix. The other half is that the job carries no kubernetes.io/hostname
# affinity, so the scheduler picks the machines rather than the controller. The
# golden pins both.
#
# Names are unpinned-node-NN rather than the usual gpu-node-NN. Nodes are
# cluster-scoped, and these names cannot collide with the gpu-node-NN fleet
# other cases create under the generic names.
apiVersion: v1
kind: Node
metadata:
  name: unpinned-node-01
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-01
spec:
  providerID: "aws://us-east-1a/i-0a01"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpinned-node-02
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-02
spec:
  providerID: "aws://us-east-1a/i-0a02"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpinned-node-03
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-03
spec:
  providerID: "aws://us-east-1a/i-0a03"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpinned-node-04
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-04
spec:
  providerID: "aws://us-east-1a/i-0a04"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
kind: Node
metadata:
  name: unpinned-node-05
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-05
spec:
  providerID: "aws://us-east-1a/i-0a05"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: v1
