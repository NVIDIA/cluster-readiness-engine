  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    kubernetes.io/hostname: unpinned-node-06
spec:
  providerID: "aws://us-east-1a/i-0a06"
status:
  allocatable:
    nvidia.com/gpu: "8"
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: unpinned-single
  namespace: default
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            # The requested job size. Under Unpinned this is honored exactly and
            # is never rewritten, because the GB200/GB300 ComputeDomain is sized
            # from the same templated number and the two must stay equal.
            numNodes: 2
  orchestration:
    iterations: 1
    placement: Unpinned
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
