# Two categories miss their performance thresholds and a third fails without
# a threshold verdict: the Certification fails, and its ValidationFailed
# condition names the two categories that missed, in order.
waitFor:
  kind: Certification
  name: test-cert-validation-fail
  namespace: default
  condition: Failed
collect:
  - kind: Certification
    name: test-cert-validation-fail
    namespace: default
