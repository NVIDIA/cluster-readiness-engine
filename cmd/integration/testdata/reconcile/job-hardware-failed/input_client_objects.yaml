apiVersion: v1
kind: Node
metadata:
  name: test-hw-node
  labels:
    nvidia.com/gpu.unhealthy: "true"
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: test-hw-failed-job-workload
  namespace: default
spec:
  runtimeRef:
    kind: TrainingRuntime
    name: test-runtime
  trainer:
    image: test-image:latest
    command:
      - python
      - train.py
    numNodes: 1
---
apiVersion: cre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: test-hw-failed-job
  namespace: default
spec:
  workload:
    trainJob:
      runtimeRef:
        kind: TrainingRuntime
        name: test-runtime
      trainer:
        image: test-image:latest
        command:
          - python
          - train.py
        numNodes: 1
  nodeHealthMonitor:
    cel:
      expression: 'node.metadata.labels["nvidia.com/gpu.unhealthy"] == "true"'
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: "Workload is running"
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-01-22T10:00:00Z"
  workloadRef:
    apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainJob
    name: test-hw-failed-job-workload
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: test-hw-failed-pod
  namespace: default
  labels:
    cre.nvidia.com/job: test-hw-failed-job
spec:
  nodeName: test-hw-node
  containers:
    - name: node
      image: test-image:latest
status:
  phase: Running
