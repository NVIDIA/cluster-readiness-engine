# A loss that no count can describe, whose record is gone.
#
# A truncation record legitimately carries Count 0: a log page that could not be
# fetched gives no way to know how many rows were on it, so the record itself is
# the finding. The sealed truncated-row count is then zero too, which is why the
# magnitude bound cannot see this at all. Delete that one ConfigMap and the row
# count, the shard count and the dropped-row total all still agree, while the
# only statement that the run lost evidence has gone with it.
#
# So the run's own truncated flag is the expectation here. It is set whenever a
# Job recorded a loss, with or without rows behind it, because a Job seals
# Partial if and only if it holds truncation records and those records and the
# written sibling come from the same call.
categories:
  - domain: compute
    variant: cutlass-gemm
    final: true
    sealTruncatedFlag: true
    rows:
      - '{"node":"gpu-node-1","componentID":"GPU-cafe","index":0,"name":"achievedTFLOPS","value":1460,"unit":"TFLOPS","sample":0}'
