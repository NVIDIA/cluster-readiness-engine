# An MPI WorkloadRun registers the launcher with EnsureLauncherTarget before
# applying pull secrets, so both the node and launcher jobs must carry the same
# list. Before this fix only the node job did, and a launcher pulling from a
# private registry failed at image pull (issue #455 follow-up on PR #483).
imagePullSecrets:
  - name: a
registerLauncher: true
spec:
  trainJob: {}
