# A node entry with content may already exist in the controller-owned patch.
# EnsureLauncherTarget must keep that entry (with its content) and add only
# the missing launcher entry, without duplicates.
spec:
  trainJob:
    runtimePatches:
      - manager: nvcre.nvidia.com/controller
        trainingRuntimeSpec:
          template:
            spec:
              replicatedJobs:
                - name: node
                  template:
                    spec:
                      template:
                        spec:
                          nodeSelector:
                            existing: selector
