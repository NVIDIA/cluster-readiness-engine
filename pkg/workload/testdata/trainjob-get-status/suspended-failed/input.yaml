# A TrainJob that failed and was suspended afterwards: Failed wins over the
# suspend flag.
kind: TrainJob
spec:
  suspend: true
status:
  conditions:
    - type: Failed
      status: "True"
      reason: WorkerFailed
      message: "Worker crashed"
