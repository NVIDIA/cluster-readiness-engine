# A TrainJob that finished and was suspended afterwards: terminal conditions
# win over the suspend flag, so the true outcome is reported.
kind: TrainJob
spec:
  suspend: true
status:
  conditions:
    - type: Complete
      status: "True"
      reason: JobCompleted
      message: "All workers completed"
