tolerations:
  - key: "nvidia.com/gpu-unhealthy"
    operator: "Exists"
    effect: "NoSchedule"
spec:
  trainJob:
    runtimeRef:
      name: my-runtime
    trainer:
      image: nemo:latest
      command: ["torchrun"]
      numNodes: 4
      numProcPerNode: 4
