tolerations:
  - operator: "Exists"
spec:
  trainJob:
    runtimeRef:
      name: nemotron5-8b-runtime
      kind: TrainingRuntime
    trainer:
      image: nemo:latest
      command: ["torchrun"]
      numNodes: 4
      numProcPerNode: 8
    runtimePatches:
    - manager: cre.nvidia.com/catalog
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      containers:
                      - name: node
                        volumeMounts:
                        - name: dshm
                          mountPath: /dev/shm
                      volumes:
                      - name: dshm
                        emptyDir:
                          medium: Memory
