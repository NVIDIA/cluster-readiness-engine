tolerations:
  - operator: "Exists"
spec:
  trainJob:
    runtimeRef:
      name: nccl-all-reduce-runtime
      kind: TrainingRuntime
    trainer:
      image: nvcr.io/nvidia/pytorch:26.01-py3
      command: ["mpirun"]
      numNodes: 2
      numProcPerNode: 8
    runtimePatches:
    - manager: nvcre.nvidia.com/catalog
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      containers:
                      - name: node
                        volumeMounts:
                        - name: dshm
                          mountPath: /dev/shm
                      volumes:
                      - name: dshm
                        emptyDir:
                          medium: Memory
            - name: launcher
