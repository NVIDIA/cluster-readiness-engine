# mlnxPerNode: 0 is the ADR-087 opt-out: the rdma.nscale.com claim template
# and both references to it are omitted rather than requested as count 0.
# The GPU claim and the IB env are unaffected.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: nscale-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 8
  mlnxPerNode: 0
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: training
      variant: nemotron5-8b
