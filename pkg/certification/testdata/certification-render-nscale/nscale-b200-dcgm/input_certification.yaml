apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: nscale-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 1
  enableMNNVL: false
  categories:
    - domain: diagnostics
      variant: dcgm-level4
