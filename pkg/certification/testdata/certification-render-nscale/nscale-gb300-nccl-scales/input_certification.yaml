apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: nscale-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  enableMNNVL: true
  categories:
    - domain: communication
      variant: nccl-all-gather
      options:
        testScale: intra-rack
    - domain: communication
      variant: nccl-alltoall
      options:
        testScale: diagnose
