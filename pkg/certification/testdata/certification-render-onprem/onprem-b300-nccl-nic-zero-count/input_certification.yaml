# nicResourceName set with mlnxPerNode: 0 is the ADR-087 opt-out: the HGX
# fragment omits the NIC request instead of rendering a count of zero, and the
# GPU toleration still applies.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  nicResourceName: rdma/rdma_shared_device_a
  mlnxPerNode: 0
  categories:
    - domain: communication
      variant: nccl-all-reduce
