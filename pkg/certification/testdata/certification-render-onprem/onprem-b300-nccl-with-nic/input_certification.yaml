# x86 HGX B300 on-prem (ADR-092): the product label parses to b300, the HGX
# block requests the shared-device pool at the configured count, and the
# per-node nccl-loopback-nvswitch runtime keeps a single torch policy and its
# tolerate-everything toleration. No NVL72 env, no arm64 toleration.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  nicResourceName: rdma/rdma_shared_device_a
  mlnxPerNode: 1
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: communication
      variant: nccl-loopback-nvswitch
