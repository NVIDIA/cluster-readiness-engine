# onprem-gb300-nccl-without-nic with no nvidia.com/gpu.product label, as on a
# DRA-only GPU stack with no GPU Feature Discovery.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 8
  enableMNNVL: true
  categories:
    - domain: communication
      variant: nccl-all-reduce
