# Training entry on HGX B300 with a per-category nicResourceName: the HGX
# training fragment carries the NIC request and the GPU toleration and no env.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-train
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        nicResourceName: rdma/rdma_shared_device_a
        mlnxPerNode: 1
        maxSteps: 10
