# Offline render with no nicResourceName: the HGX block contributes only the
# GPU toleration; the NIC block is absent and nothing else changes.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-gather
