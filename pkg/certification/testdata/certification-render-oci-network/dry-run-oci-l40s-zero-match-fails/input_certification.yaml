# No NAD for nvidia.com/mlnxnics: dry-run fails with the controller's message.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
