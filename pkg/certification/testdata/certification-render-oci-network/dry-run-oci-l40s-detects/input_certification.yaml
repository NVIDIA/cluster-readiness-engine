# --dry-run on AICR's layout: NADs are listed once and the annotation names the
# detected nvidia-network-operator/rdma-net once per NIC.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
