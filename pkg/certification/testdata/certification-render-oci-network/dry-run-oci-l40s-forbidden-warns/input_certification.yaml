# The user's kubeconfig may not list NADs. The controller lists with its own
# service account, so dry-run warns and renders the default instead of failing.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
