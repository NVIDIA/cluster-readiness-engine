# --dry-run of dcgm-level4 on OCI H100: the first pass carries no sentinel, so no
# NAD is listed even though the cluster has none.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: oci-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  nodesPerJob: 2
  categories:
    - domain: diagnostics
      variant: dcgm-level4
