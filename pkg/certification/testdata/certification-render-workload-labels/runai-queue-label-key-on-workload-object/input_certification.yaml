# Run:ai reads runai/queue, so that is the key that lands on the workload
# object and the key the persisted intent carries.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: labels-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  gangScheduler:
    schedulerName: runai-scheduler
    queueLabelKey: runai/queue
    queue: team-a
  categories:
    - domain: communication
      variant: nccl-all-reduce
