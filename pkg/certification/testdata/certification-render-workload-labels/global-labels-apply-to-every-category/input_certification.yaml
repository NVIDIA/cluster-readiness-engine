# Global labels reach every category. Two categories are rendered so the
# golden shows the same map on both rather than only on the first, which is
# what an aliased global map would have produced.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: labels-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  workloadMetadata:
    labels:
      environment: burn-in
      cost-center: "4242"
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: communication
      variant: nccl-all-gather
