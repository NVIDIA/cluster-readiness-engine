# The Run:ai half of the existing-user matrix, alongside
# gang-scheduler-queue-omitted-emits-default which covers KAI. The controller
# fixture certification-workload-labels-runai renders the same configuration,
# so the two must agree.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: labels-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  gangScheduler:
    schedulerName: runai-scheduler
    queueLabelKey: runai/queue
  categories:
    - domain: communication
      variant: nccl-all-reduce
