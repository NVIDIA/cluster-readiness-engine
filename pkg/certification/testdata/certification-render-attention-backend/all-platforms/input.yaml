# Every training entry, rendered on every platform in platform.Names() for each
# architecture below, so an override arm added for any combination is checked
# against megatron's --attention-backend assert (issue #486). Keep this list in
# step with entries/_lib/gpu-defaults.yaml.
#
# nodesPerJob 8 satisfies nemotron5-56b minGPUs 32 on the 4-GPU GB200/GB300
# nodes as well as the 8-GPU ones.
gpuArchs: [a100, h100, h200, l40, l40s, b200, b300, gb200, gb300, rtxpro6000]
nodesPerJob: 8
