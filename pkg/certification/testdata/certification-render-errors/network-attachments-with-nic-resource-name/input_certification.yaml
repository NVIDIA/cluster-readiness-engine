# networkAttachments and nicResourceName in one options block are two
# answers to the same question; the CRD rejects the pair and so does render.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nicResourceName: rdma/ib
  networkAttachments:
    - {network: r0, resourceName: nvidia.com/r0}
  categories:
    - domain: communication
      variant: nccl-all-reduce
