# mlnxPerNode: 0 is the NIC opt-out, which contradicts an explicit list.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  mlnxPerNode: 0
  networkAttachments:
    - {network: r0, resourceName: nvidia.com/r0}
  categories:
    - domain: communication
      variant: nccl-all-reduce
