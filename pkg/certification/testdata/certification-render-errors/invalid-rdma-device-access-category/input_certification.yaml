# The same typo in a category's options rather than at the spec level. Both
# positions resolve into the same BuildConfig field, so both have to be
# checked; ResolveOptions lets the per-category value win.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        rdmaDeviceAccess: hostpath
