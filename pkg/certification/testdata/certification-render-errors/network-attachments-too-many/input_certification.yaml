# 17 entries is one over the cap.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  networkAttachments:
    - {network: r0, resourceName: nvidia.com/r0}
    - {network: r1, resourceName: nvidia.com/r1}
    - {network: r2, resourceName: nvidia.com/r2}
    - {network: r3, resourceName: nvidia.com/r3}
    - {network: r4, resourceName: nvidia.com/r4}
    - {network: r5, resourceName: nvidia.com/r5}
    - {network: r6, resourceName: nvidia.com/r6}
    - {network: r7, resourceName: nvidia.com/r7}
    - {network: r8, resourceName: nvidia.com/r8}
    - {network: r9, resourceName: nvidia.com/r9}
    - {network: r10, resourceName: nvidia.com/r10}
    - {network: r11, resourceName: nvidia.com/r11}
    - {network: r12, resourceName: nvidia.com/r12}
    - {network: r13, resourceName: nvidia.com/r13}
    - {network: r14, resourceName: nvidia.com/r14}
    - {network: r15, resourceName: nvidia.com/r15}
    - {network: r16, resourceName: nvidia.com/r16}
  categories:
    - domain: communication
      variant: nccl-all-reduce
