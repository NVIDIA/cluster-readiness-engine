# The reserved kubernetes.io domain is rejected like nicResourceName.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  networkAttachments:
    - {network: r0, resourceName: example.kubernetes.io/r0}
  categories:
    - domain: communication
      variant: nccl-all-reduce
