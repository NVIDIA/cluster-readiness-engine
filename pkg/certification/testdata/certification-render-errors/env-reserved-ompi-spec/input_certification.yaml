# The OMPI_MCA_* launcher settings carry the hostfile Kubeflow's MPI plugin
# generates and the rsh arguments mpirun uses to reach the workers. A user
# value there does not tune the run, it breaks the launch.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  env:
    - name: OMPI_MCA_orte_default_hostfile
      value: /tmp/hostfile
  categories:
    - domain: communication
      variant: nccl-all-reduce
