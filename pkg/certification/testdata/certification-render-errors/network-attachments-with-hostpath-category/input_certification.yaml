# hostPath RDMA access requests no extended resource, so it cannot
# carry per-rail attachments. Checked per category too.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        rdmaDeviceAccess: hostPath
        networkAttachments:
          - {network: r0, resourceName: nvidia.com/r0}
