# The review case on #510: hostPath at the spec level and the list in a
# category. readCertification checks one options block at a time and passes
# both; render checks the merged options and fails the category.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  rdmaDeviceAccess: hostPath
  mlnxPerNode: 0
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        networkAttachments:
          - {network: nvcre/r0, resourceName: nvidia.com/r0}
