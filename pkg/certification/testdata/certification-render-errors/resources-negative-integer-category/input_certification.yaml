# An unquoted negative integer. The CRD Pattern only binds strings and
# controller-gen cannot emit a minimum on a quantity, so admission accepts it;
# the offline render must refuse it like the controller does.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        resources:
          limits:
            cpu: -1
