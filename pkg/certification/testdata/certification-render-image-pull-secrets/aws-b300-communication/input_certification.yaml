# B300 EFA overrides must preserve the certificate's pull secret on each
# worker and on the launchers of the three multi-node MPI collectives.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: aws-b300-pull-secrets-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  enableMNNVL: false
  imagePullSecrets:
    - name: cert-pull-secret
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: communication
      variant: nccl-all-gather
    - domain: communication
      variant: nccl-alltoall
    - domain: communication
      variant: nccl-loopback
    - domain: communication
      variant: nccl-loopback-nvswitch
