# nicResourceName set per category on deps/azure-a100-ib-training.yaml, the
# a100-plus-training corner. The per-category value replaces the spec-level
# one, so the request is rdma/ib_per_category and never rdma/hca_shared_devices_a
# or the nvidia.com/mlnxnics default.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: azure-a100-training-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  nodesPerJob: 8
  enableMNNVL: false
  nicResourceName: rdma/hca_shared_devices_a
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
        nicResourceName: rdma/ib_per_category
