# Three categories of one domain and variant that differ only in their
# attachments: a different rail set, and the same set in another order (the
# Network Operator pairs by position, so order is configuration). Each must
# get its own Workflow name; sharing one would let a category adopt another
# category's Workflow and report a result for a fabric it never used.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        networkAttachments:
          - {network: nvcre/r0, resourceName: nvidia.com/r0}
          - {network: nvcre/r1, resourceName: nvidia.com/r1}
    - domain: communication
      variant: nccl-all-reduce
      options:
        networkAttachments:
          - {network: nvcre/r2, resourceName: nvidia.com/r2}
          - {network: nvcre/r3, resourceName: nvidia.com/r3}
    - domain: communication
      variant: nccl-all-reduce
      options:
        networkAttachments:
          - {network: nvcre/r1, resourceName: nvidia.com/r1}
          - {network: nvcre/r0, resourceName: nvidia.com/r0}
