# Azure renders nvidia.com/mlnxnics: 8 through its platform override. An entry
# backed by that same resource adds an interface, so the worker requests 9.
# The WorkloadRun render and controller cases of the same name pin the same
# answer on the WorkloadRun path.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: azure-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  nodesPerJob: 2
  enableMNNVL: false
  networkAttachments:
    - {network: nvcre/ib-extra, resourceName: nvidia.com/mlnxnics}
  categories:
    - domain: communication
      variant: nccl-all-reduce
