# TogetherAI reaches its InfiniBand fabric through nvidia.com/mlnxnics, with no
# Multus, and its NCCL environment names those HCAs. The list therefore adds
# to that request rather than replacing it: the worker gets the attachment and
# its resource next to nvidia.com/mlnxnics: 8.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: togetherai-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  nodesPerJob: 2
  enableMNNVL: false
  networkAttachments:
    - {network: nvcre/storage, resourceName: example.com/storage}
  categories:
    - domain: communication
      variant: nccl-all-reduce
