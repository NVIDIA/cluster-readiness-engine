# The spec level sets nicResourceName; the second category lists its own
# attachments. That category renders only the attachments (no
# rdma/rdma_shared_device_a request), while the first keeps the spec NIC.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  nicResourceName: rdma/rdma_shared_device_a
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: communication
      variant: nccl-all-gather
      options:
        networkAttachments:
          - {network: nvcre/r0, resourceName: nvidia.com/r0}
          - {network: nvcre/r1, resourceName: nvidia.com/r1}
