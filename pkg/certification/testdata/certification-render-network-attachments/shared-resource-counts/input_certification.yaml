# count defaults to 1 and entries sharing a resourceName add up: two
# attachments on rdma/shared plus one with count 2 on rdma/extra request
# rdma/shared=2 and rdma/extra=2, while the annotation still lists three
# networks in order.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: onprem-b300-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  nodesPerJob: 2
  networkAttachments:
    - {network: net-a, resourceName: rdma/shared}
    - {network: net-b, resourceName: rdma/shared}
    - {network: other-ns/net-c, resourceName: rdma/extra, count: 2}
  categories:
    - domain: communication
      variant: nccl-all-reduce
