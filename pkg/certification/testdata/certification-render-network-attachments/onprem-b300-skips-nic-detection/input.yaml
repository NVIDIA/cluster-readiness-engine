# The --dry-run path on on-prem HGX B300 nodes that advertise a single NIC
# candidate, rdma/rdma_shared_device_a at 8 per node, which detection would
# otherwise inject as the spec-level nicResourceName. A spec-level
# networkAttachments list owns the wiring, so detection is skipped: the worker
# requests the two rails and no rdma/rdma_shared_device_a, and nicResourceName
# stays unset (with it set beside the list, the merged-options check would
# reject the render).
platform: onprem
nodes:
  - metadata:
      name: b300-0
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    status:
      allocatable:
        rdma/rdma_shared_device_a: "8"
        nvidia.com/r0: "1"
        nvidia.com/r1: "1"
  - metadata:
      name: b300-1
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    status:
      allocatable:
        rdma/rdma_shared_device_a: "8"
        nvidia.com/r0: "1"
        nvidia.com/r1: "1"
