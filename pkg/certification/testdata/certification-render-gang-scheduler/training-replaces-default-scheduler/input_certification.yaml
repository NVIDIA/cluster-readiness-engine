# pkg/catalog/entries/training/nemotron5-8b.yaml hardcodes
# schedulerName: default-scheduler. This case is the reason the helper
# overwrites the field instead of filling it in only when it is empty.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gang-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  gangScheduler:
    schedulerName: kai-scheduler
    queue: high-priority
  categories:
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
