# queue is optional. Every replicatedJob of every category must land in
# default-queue, which is the queue KAI Scheduler ships with.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: gang-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  gangScheduler:
    schedulerName: kai-scheduler
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
