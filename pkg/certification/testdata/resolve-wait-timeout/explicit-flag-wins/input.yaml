# The user passed --timeout 45m explicitly; the dcgm-level4 budget (3h derived)
# must NOT override it.
explicitTimeout: true
flagTimeout: 45m
certification:
  apiVersion: nvcre.nvidia.com/v1alpha1
  kind: Certification
  metadata:
    name: explicit
  spec:
    target:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GB200
    categories:
    - domain: diagnostics
      variant: dcgm-level4
