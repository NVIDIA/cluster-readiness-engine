# Both a spec-level image and a per-category override. The communication
# category takes the per-category value, the training category falls back to
# the spec-level value: per-category wins, exactly like the other options.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: image-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  image: registry.example.com/spec-level/workload:v1
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        image: registry.example.com/per-category/nccl-tests:v2
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
