apiVersion: cre.nvidia.com/v1alpha1
kind: LogProfile
metadata:
  name: megatron-training
spec:
  timestamp:
    layout: "2006-01-02 15:04:05.999999"
  patterns:
    trainingStep:
      regex: '\[(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?)\]\s+iteration\s+(?P<iteration>\d+)/\s*\d+\s*\|.*elapsed time per iteration \(ms\):\s*(?P<elapsedTime>[\d.]+)\s*\|.*throughput per GPU \(TFLOP/s/GPU\):\s*(?P<tflops>[\d.]+)\s*\|.*lm loss:\s*(?P<loss>[\d.eE+\-]+)'
      example: '[2026-03-25 07:30:05] iteration       10/  139100 | consumed samples: 360 | elapsed time per iteration (ms): 5762.2 | throughput per GPU (TFLOP/s/GPU): 129.5 | lm loss: 9.751967E+00'
      units:
        elapsedTime: ms
    applicationStart:
      regex: 'using world size: \d+, data-parallel size: \d+, context-parallel size: \d+,.* tensor-model-parallel size: \d+, pipeline-model-parallel size: \d+'
      example: 'using world size: 16, data-parallel size: 8, context-parallel size: 1, tensor-model-parallel size: 2, pipeline-model-parallel size: 1'
