# The same input as unpinned-exceeds-available-rejected, with the flag off. The
# clamp is correct here: nodesPerJob is a chunk size for a sweep that has to
# cover the fleet, and a chunk larger than the fleet is meaningless. If this
# ever starts erroring, the new mode has leaked into the default path.
availableNodes: 4
nodesPerJob: 8
placement: ""
constraint: none
