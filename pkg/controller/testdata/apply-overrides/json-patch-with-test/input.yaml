platform: "aws"
gpuArchitecture: "h100"
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            name: test-runtime
          trainer:
            image: test-image:latest
            numNodes: 8
  orchestration:
    iterations: 1
  overrides:
    - when:
        gpuArchitecture:
          equals: "h100"
      jobTemplatePatch:
        - op: test
          path: /spec/workload/trainJob/trainer/numNodes
          value: 8
        - op: replace
          path: /spec/workload/trainJob/trainer/numNodes
          value: 16
