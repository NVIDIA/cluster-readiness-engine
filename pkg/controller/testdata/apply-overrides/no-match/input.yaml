platform: "onprem"
gpuArchitecture: "gb200"
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            name: test-runtime
          trainer:
            image: test-image:latest
            command:
              - python
              - train.py
            args:
              - "--nproc-per-node=4"
            numNodes: 1
  orchestration:
    iterations: 1
  overrides:
    - when:
        platform:
          equals: "aws"
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                args:
                  - "--nproc-per-node=8"
