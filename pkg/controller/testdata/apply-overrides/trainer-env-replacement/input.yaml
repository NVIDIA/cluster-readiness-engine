platform: "aws"
gpuArchitecture: "h100"
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            name: test-runtime
          trainer:
            image: test-image:latest
            env:
              - name: NCCL_DEBUG
                value: INFO
              - name: BATCH_SIZE
                value: "32"
            numNodes: 1
  orchestration:
    iterations: 1
  overrides:
    - when:
        gpuArchitecture:
          equals: "h100"
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                env:
                  - name: BATCH_SIZE
                    value: "64"
