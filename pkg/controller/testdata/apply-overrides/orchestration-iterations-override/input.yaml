platform: "aws"
gpuArchitecture: "h100"
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            name: test-runtime
          trainer:
            image: test-image:latest
            numNodes: 1
  orchestration:
    iterations: 1
    execution:
      maxConcurrent: 2
  overrides:
    - when:
        gpuArchitecture:
          equals: "h100"
      orchestration:
        iterations: 5
