# Issue #389 gap 4, second mode. Every group was observed, but the Workflow
# status write that would record the retry fails on pass 1. Collecting loop
# errors would not have saved this one; deleting nothing before the write does.
# Pass 2 records the retry from the same failed Job, and the retirement and
# launch follow as usual.
retryFailedGroups: 1
groupA:
  phase: Running
  retries: 0
oldJob: failed
dep: previous
depTracked: true
statusWriteErrorPasses: [1]
passes: 4
