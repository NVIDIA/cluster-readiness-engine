    generation: 1
    devices:
      - name: rocep201s0
        attributes:
          dra.vpc.amazonaws.com/deviceType: roce
          dra.vpc.amazonaws.com/networkDevName: ens176
  - nodeName: gb300-b
    driver: dra.networking.k8s.aws
    pool: gb300-b
