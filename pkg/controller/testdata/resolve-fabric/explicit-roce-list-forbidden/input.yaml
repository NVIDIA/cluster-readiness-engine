# A refused list cannot check an explicit roce. The failure says the list was
# refused rather than claiming the nodes lack RoCE devices.
field: roce
platform: aws
gpuArchitecture: gb300
nodes:
  - name: gb300-a
    allocatable:
      nvidia.com/gpu: "4"
listError: forbidden
