# The first category succeeds, and the live read of the second category's
# Workflow name fails for its own reasons. Since issue #566 that is the
# adoption read, made before any check or Create runs again. A timeout says
# nothing about the holder, and the name may well be free on the next pass.
# Pin that this requeues instead of burning the whole Certification: no
# category WorkflowRef is recorded on this path, so
# recoverIfWorkflowStillRunning cannot undo it and one 503 would end the run.
# adopt-race-read-error-retries covers the same failure in the AlreadyExists
# handler.
inCache: true
inAPI: true
succeeded: true
adoptHolder: api-only
adoptReadError: "etcdserver: request timed out"
reconciles: 3
