# Candidate pair (A,C) shares node-A with running pair (A,B).
candidate:
  name: pair-ac
  nodes: ["node-A", "node-C"]
  phase: Pending
allGroups:
  - name: pair-ab
    nodes: ["node-A", "node-B"]
    phase: Running
  - name: pair-ac
    nodes: ["node-A", "node-C"]
    phase: Pending
