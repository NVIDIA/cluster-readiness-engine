# An In with an empty value list matches NO node. Emitting the term anyway
# would deadlock scheduling on any fleet whose nodes carry no gpu.product
# label, which is most of the existing testdata. Omit it instead.
placement: Unpinned
groupNodes: []
target:
  nodeSelector:
    nvidia.com/gpu.present: "true"
gpuProducts: ["", ""]
