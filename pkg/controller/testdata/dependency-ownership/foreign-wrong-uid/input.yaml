# An object created for a DIFFERENT Workflow (or a different incarnation of a
# same-named Workflow): owner reference UID, annotation UID, and label name all
# mismatch. Never adopted, never deleted.
workflow:
  name: my-workflow
  uid: 11111111-1111-1111-1111-111111111111
object:
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: my-dep
    namespace: default
    labels:
      nvcre.nvidia.com/workflow: other-workflow
    annotations:
      nvcre.nvidia.com/workflow-uid: 22222222-2222-2222-2222-222222222222
    ownerReferences:
      - apiVersion: nvcre.nvidia.com/v1alpha1
        kind: Workflow
        name: other-workflow
        uid: 22222222-2222-2222-2222-222222222222
