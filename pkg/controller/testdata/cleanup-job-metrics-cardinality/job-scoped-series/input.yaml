# The full set of job-scoped metric names cleanupJobMetrics must clear. This
# list is checked against the hardcoded jobScoped table in the test body, so
# a metric added to one but not the other fails loudly instead of silently
# under-testing.
metricNames:
  - nvcre_job_status
  - nvcre_job_failed_nodes
  - nvcre_hardware_failures_detected_total
  - nvcre_hardware_failed_jobs_total
  - nvcre_nodes_evaluated_total
  - nvcre_workload_created_total
  - nvcre_reconcile_total
  - nvcre_reconcile_duration_seconds
  - nvcre_node_health_check_duration_seconds
