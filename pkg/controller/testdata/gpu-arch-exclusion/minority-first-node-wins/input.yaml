# The odd node sorts first, so its architecture is the one certified and the
# two H100 nodes are excluded. This is why the ordering has to be stable: the
# same cluster used to certify either subset depending on List order.
nodes:
  - name: node-a
    product: NVIDIA-A100-PCIE-40GB
  - name: node-b
    product: NVIDIA-H100-80GB-HBM3
  - name: node-c
    product: NVIDIA-H100-80GB-HBM3
