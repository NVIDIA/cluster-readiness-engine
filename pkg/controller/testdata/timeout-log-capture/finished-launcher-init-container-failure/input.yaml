# The launcher failed in its wait-for-workers init container, as a KAI
# launcher does when a worker never answers, and a worker is still running.
# The record reads the init container the way a failure record does: its log
# names the worker and its exit code is the one the pod failed with. The main
# container never started, so its log is empty.
workloadRef: j-workload
pods:
  - name: j-workload-launcher-0-0
    launcher: true
    failed: true
    initExitCode: 1
    initLog: "[stub] j-workload-node-0-1 did not answer on port 2222\n"
  - name: j-workload-node-0-0
    running: true
    log: "sshd: listening on port 2222\n"
