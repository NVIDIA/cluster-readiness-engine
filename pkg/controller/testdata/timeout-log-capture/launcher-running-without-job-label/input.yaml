# The launcher carries no nvcre.nvidia.com/job label, only the workers do, so
# the capture saw only the workers and recorded the first running worker's sshd
# output, with no NCCL in it (issue #546). The launcher is found by its JobSet
# labels and named over the running workers.
workloadRef: j-workload
pods:
  - name: j-workload-node-0-0
    running: true
    log: "sshd: listening on port 2222\n"
  - name: j-workload-node-0-1
    running: true
    log: "sshd: listening on port 2222\n"
  - name: j-workload-launcher-0-0
    launcher: true
    running: true
    log: "#  out-of-place in-place\n[stub] still running\n"
