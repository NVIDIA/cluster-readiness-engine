# The only launcher already failed and a worker is still running. The
# launcher's log has the diagnosis and the worker's has only sshd output, so the
# finished launcher is named.
workloadRef: j-workload
pods:
  - name: j-workload-launcher-0-0
    launcher: true
    failed: true
    exitCode: 1
    reason: Error
    log: "[stub] launcher exited\n"
  - name: j-workload-node-0-0
    running: true
    log: "sshd: listening on port 2222\n"
