# A launcher that already failed comes before the launcher that is still
# running. The failed one does not stop the search, so the running launcher,
# which has this run's NCCL output, is named.
workloadRef: j-workload
pods:
  - name: j-workload-launcher-0-0
    launcher: true
    failed: true
    exitCode: 1
    reason: Error
    log: "[stub] earlier attempt exited\n"
  - name: j-workload-node-0-0
    running: true
    log: "sshd: listening on port 2222\n"
  - name: j-workload-launcher-0-1
    launcher: true
    running: true
    log: "#  out-of-place in-place\n[stub] still running\n"
