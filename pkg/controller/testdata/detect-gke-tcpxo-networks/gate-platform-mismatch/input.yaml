# H100 on AWS: the gate is GCP H100 only, so detection does not run even when
# GKE-looking resources are present.
platform: aws
gpuArchitecture: h100
nodes:
  - name: gpu-01
    allocatable:
      nvidia.com/gpu: "8"
      networking.gke.io.networks/c1-gpu-nic-0: "1"
