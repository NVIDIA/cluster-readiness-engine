# GB200 on GCP uses the RoCE patch with fixed rdma-N network names, not the
# TCPXO patch, so detection does not run.
platform: gcp
gpuArchitecture: gb200
nodes:
  - name: gpu-01
    allocatable:
      nvidia.com/gpu: "8"
      networking.gke.io.networks/c1-gpu-nic-0: "1"
      networking.gke.io.networks/c1-gpu-nic-0.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-1: "1"
      networking.gke.io.networks/c1-gpu-nic-1.IP: "1"
