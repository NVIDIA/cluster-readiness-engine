# An A3 High (a3-highgpu-8g) pool has four GPU NIC networks, for TCPX, not
# the eight TCPXO needs. Detection refuses rather than attach four networks to
# a TCPXO pod that expects eight.
platform: gcp
gpuArchitecture: h100
nodes:
  - name: gpu-01
    allocatable:
      nvidia.com/gpu: "8"
      networking.gke.io.networks/c1-gpu-nic-0: "1"
      networking.gke.io.networks/c1-gpu-nic-0.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-1: "1"
      networking.gke.io.networks/c1-gpu-nic-1.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-2: "1"
      networking.gke.io.networks/c1-gpu-nic-2.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-3: "1"
      networking.gke.io.networks/c1-gpu-nic-3.IP: "1"
  - name: gpu-02
    allocatable:
      nvidia.com/gpu: "8"
      networking.gke.io.networks/c1-gpu-nic-0: "1"
      networking.gke.io.networks/c1-gpu-nic-0.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-1: "1"
      networking.gke.io.networks/c1-gpu-nic-1.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-2: "1"
      networking.gke.io.networks/c1-gpu-nic-2.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-3: "1"
      networking.gke.io.networks/c1-gpu-nic-3.IP: "1"
