      networking.gke.io.networks/c1-gpu-nic-4: "1"
      networking.gke.io.networks/c1-gpu-nic-4.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-5: "1"
      networking.gke.io.networks/c1-gpu-nic-5.IP: "1"
