# Nine networks on every node cannot be told apart from a non-GPU network
# attached to the same pool, so detection refuses rather than guess which
# eight are the GPU NICs.
platform: gcp
gpuArchitecture: h100
nodes:
  - name: gpu-01
    allocatable:
      nvidia.com/gpu: "8"
      networking.gke.io.networks/c1-gpu-nic-0: "1"
      networking.gke.io.networks/c1-gpu-nic-0.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-1: "1"
      networking.gke.io.networks/c1-gpu-nic-1.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-2: "1"
      networking.gke.io.networks/c1-gpu-nic-2.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-3: "1"
      networking.gke.io.networks/c1-gpu-nic-3.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-4: "1"
      networking.gke.io.networks/c1-gpu-nic-4.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-5: "1"
      networking.gke.io.networks/c1-gpu-nic-5.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-6: "1"
      networking.gke.io.networks/c1-gpu-nic-6.IP: "1"
      networking.gke.io.networks/c1-gpu-nic-7: "1"
      networking.gke.io.networks/c1-gpu-nic-7.IP: "1"
      networking.gke.io.networks/c1-gvnic-1: "1"
      networking.gke.io.networks/c1-gvnic-1.IP: "1"
