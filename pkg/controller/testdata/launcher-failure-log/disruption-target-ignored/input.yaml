# An evicted or preempted launcher carries DisruptionTarget=True. The launcher
# Job's podFailurePolicy ignores that failure and replaces the pod, so nothing
# is recorded while the replacement runs.
workloadRef: j-workload
pods:
  - name: j-workload-launcher-0-0-a
    launcher: true
    disruptionTarget: true
    exitCode: 137
    reason: Error
    finishedAt: 10
    log: "evicted\n"
  - name: j-workload-launcher-0-0-b
    launcher: true
    running: true
