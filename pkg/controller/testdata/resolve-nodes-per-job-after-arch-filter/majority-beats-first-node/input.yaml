# The primary architecture is the most common one, not the first node's
# (issue #77). One h100 sorts first, but the three a100 nodes outnumber it, so
# the h100 node is dropped and the job is sized to the three survivors. Before
# the majority rule, the lone h100 won and the run shrank to a single node.
nodes:
  - {name: n1, product: NVIDIA-H100-80GB-HBM3}
  - {name: n2, product: NVIDIA-A100-PCIE-40GB}
  - {name: n3, product: NVIDIA-A100-PCIE-40GB}
  - {name: n4, product: NVIDIA-A100-PCIE-40GB}
constraint: none
