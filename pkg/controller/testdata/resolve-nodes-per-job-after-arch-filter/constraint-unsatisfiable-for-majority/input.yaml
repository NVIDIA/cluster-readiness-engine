# The constraint check runs against the majority's survivors, not the whole
# target. The three a100 nodes outvote the first-sorting h100 (issue #77), so
# the filter keeps three nodes, still short of the four the constraint
# demands. The error must name the majority architecture and the survivor
# count, proving the constraint-unsatisfiable path composes with the majority
# rule rather than only with an all-tied target.
nodes:
  - {name: n1, product: NVIDIA-H100-80GB-HBM3}
  - {name: n2, product: NVIDIA-A100-PCIE-40GB}
  - {name: n3, product: NVIDIA-A100-PCIE-40GB}
  - {name: n4, product: NVIDIA-A100-PCIE-40GB}
constraint: min4
