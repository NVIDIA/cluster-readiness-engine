# Documents current behaviour, which this change does NOT alter: the primary
# architecture is the first node's, not the most common one. One h100 sorts first,
# so three a100 nodes are dropped and the job is sized to a single node.
#
# Sizing is now correct either way — it matches whatever survives the filter. But
# whether first-node-wins is the RIGHT choice is a separate question from this
# change, and is deliberately left alone here.
nodes:
  - {name: n1, product: NVIDIA-H100-80GB-HBM3}
  - {name: n2, product: NVIDIA-A100-PCIE-40GB}
  - {name: n3, product: NVIDIA-A100-PCIE-40GB}
  - {name: n4, product: NVIDIA-A100-PCIE-40GB}
constraint: none
