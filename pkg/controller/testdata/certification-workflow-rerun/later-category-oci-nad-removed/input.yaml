# As first-category-oci-nad-removed, for a later category whose Workflow
# attaches the RDMA network.
nodes:
  - name: gpu-01
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: diagnostics
      variant: dcgm-level4
    - domain: communication
      variant: nccl-all-reduce
status:
  categoryStatuses:
    - domain: diagnostics
      variant: dcgm-level4
      status: Succeeded
    - domain: communication
      variant: nccl-all-reduce
      status: Pending
existingWorkflow: 1
expectLookup: false
nads: []
