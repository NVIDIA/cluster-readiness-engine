# A cordoned node opted in via taintSelectors is included, not excluded.
nodes:
  - name: node002
    cordoned: true
    taints:
      - key: node.kubernetes.io/unschedulable
        effect: NoSchedule
target:
  taintSelectors:
    - key: node.kubernetes.io/unschedulable
      effect: NoSchedule
