# The case raised in review of #543: dcgm-level4 on OCI H100 resolves mlnxPerNode 8 but
# never includes the OCI fragment, so no NAD is listed even though the
# cluster has none, and the Workflow is created.
nodes:
  - name: gpu-01
    product: NVIDIA-H100-80GB-HBM3
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "8"
  - name: gpu-02
    product: NVIDIA-H100-80GB-HBM3
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "8"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: diagnostics
      variant: dcgm-level4
expectLookup: false
nads: []
