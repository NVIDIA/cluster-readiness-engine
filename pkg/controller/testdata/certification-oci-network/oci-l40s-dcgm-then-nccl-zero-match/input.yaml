# dcgm-level4 attaches no RDMA network and runs first; nccl-all-reduce attaches
# it, and the cluster has no NAD for nvidia.com/mlnxnics. Detection runs for
# every category before the first Workflow, so the Certification fails with
# SecondaryNetworkDetectionFailed before dcgm-level4 starts, not after it.
nodes:
  - name: gpu-01
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: diagnostics
      variant: dcgm-level4
    - domain: communication
      variant: nccl-all-reduce
expectLookup: true
nads: []
