# An explicit networkAttachments list replaces the OCI wiring (ADR-104), so no
# NAD is listed and the Workflow attaches the listed network.
nodes:
  - name: gpu-01
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  networkAttachments:
    - network: nvidia-network-operator/rdma-net
      resourceName: nvidia.com/mlnxnics
    - network: nvidia-network-operator/rdma-net
      resourceName: nvidia.com/mlnxnics
  categories:
    - domain: communication
      variant: nccl-all-reduce
expectLookup: false
nads: []
