# No NAD for nvidia.com/mlnxnics: the Certification fails with
# SecondaryNetworkDetectionFailed and a Warning event, and no Workflow exists.
nodes:
  - name: gpu-01
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: communication
      variant: nccl-all-reduce
expectLookup: true
nads: []
