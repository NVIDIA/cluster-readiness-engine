# AICR's layout on OCI L40S: nccl-all-reduce attaches the RDMA network, so
# NADs are listed once and the Workflow names only the detected
# nvidia-network-operator/rdma-net, once per NIC.
nodes:
  - name: gpu-01
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-L40S
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: communication
      variant: nccl-all-reduce
expectLookup: true
nads:
  - namespace: nvidia-network-operator
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
