# dcgm-level4 on OCI GB300 resolves mlnxPerNode 4 but never includes the OCI
# fragment, so no NAD is listed even though the cluster has none, and the
# Workflow is created.
nodes:
  - name: gpu-01
    product: NVIDIA-GB300
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
  - name: gpu-02
    product: NVIDIA-GB300
    providerID: ocid1.instance.oc1.iad.example
    allocatable:
      nvidia.com/gpu: "4"
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: diagnostics
      variant: dcgm-level4
expectLookup: false
nads: []
