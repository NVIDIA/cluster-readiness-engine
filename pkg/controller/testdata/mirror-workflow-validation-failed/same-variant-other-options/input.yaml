# Two categories of one domain/variant that differ in options run as separate
# Workflows; each is listed with the suffix derived from its options.
index: 1
workflow:
  metadata:
    name: w
  status:
    conditions:
      - type: Failed
        status: "True"
        reason: JobValidationFailed
        message: 1 groups failed across 1 iterations
        lastTransitionTime: "2026-01-22T10:05:00Z"
      - type: ValidationFailed
        status: "True"
        reason: JobValidationFailed
        message: One or more Jobs failed performance threshold validation
        lastTransitionTime: "2026-01-22T10:05:00Z"
certification:
  metadata:
    name: c
  spec:
    target:
      nodeNames:
        - node-a
    categories:
      - domain: communication
        variant: nccl-all-reduce
        options:
          nodesPerJob: 2
      - domain: communication
        variant: nccl-all-reduce
        options:
          nodesPerJob: 8
  status:
    categoryStatuses:
      - domain: communication
        variant: nccl-all-reduce
        status: Failed
      - domain: communication
        variant: nccl-all-reduce
        status: Failed
    conditions:
      - type: InProgress
        status: "True"
        reason: WorkflowRunning
        message: "Workflow for category communication/nccl-all-reduce failed, advancing to next category"
        lastTransitionTime: "2026-01-22T10:00:00Z"
      - type: ValidationFailed
        status: "True"
        reason: ThresholdViolation
        message: "Performance thresholds not met in categories: communication/nccl-all-reduce-n2"
        lastTransitionTime: "2026-01-22T10:00:00Z"
