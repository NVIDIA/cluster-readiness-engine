suffix: "-group-0-iter-1"
# Two deps: ComputeDomain creates a claim template, TrainingRuntime references it.
# "my-cd-claim" is a cross-reference between deps and must be suffixed.
jobSpec: '{"workload":{"trainJob":{"runtimeRef":{"name":"my-runtime"}}}}'
deps:
  - raw: |
      {"apiVersion":"resource.nvidia.com/v1beta1","kind":"ComputeDomain","metadata":{"name":"my-cd"},"spec":{"channel":{"resourceClaimTemplate":{"name":"my-cd-claim"}}}}
  - raw: |
      {"apiVersion":"trainer.kubeflow.org/v1alpha1","kind":"TrainingRuntime","metadata":{"name":"my-runtime"},"spec":{"template":{"spec":{"replicatedJobs":[{"name":"trainer","template":{"spec":{"template":{"spec":{"resourceClaims":[{"name":"cd-channel","resourceClaimTemplateName":"my-cd-claim"}]}}}}}]}}}}
