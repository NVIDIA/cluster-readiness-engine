# Per-tenant copies rendered by a Network Operator CR: same config apart from
# whitespace, key order and name. The first in sorted order is attached.
namespace: default
nads:
  - namespace: tenant-b
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"type": "host-device",  "ipam": {}, "name": "rdma-net", "cniVersion": "0.3.1"}'
  - namespace: tenant-a
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
