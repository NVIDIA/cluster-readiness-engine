# The right value under the wrong key: k8s.cni.cncf.io/resourceName is the DRA
# attribute key, not the annotation Multus reads. It counts as no match, and the
# message points at the key.
namespace: default
nads:
  - namespace: nvidia-network-operator
    name: rdma-net
    annotations:
      k8s.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
