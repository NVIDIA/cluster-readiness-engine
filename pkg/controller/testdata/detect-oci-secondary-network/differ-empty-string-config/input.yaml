# Two NADs whose spec.config is the empty string: Multus reads their configs
# from disk by name, so they are never equivalent and detection fails closed.
namespace: default
nads:
  - namespace: ns-1
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: ''
  - namespace: ns-2
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: ''
