# Two NADs with no spec.config: Multus reads their configs from disk by name,
# which NVCRE cannot see, so they are never equivalent and detection fails closed.
namespace: default
nads:
  - namespace: ns-1
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
  - namespace: ns-2
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
