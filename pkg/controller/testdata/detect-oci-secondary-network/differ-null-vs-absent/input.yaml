# Two candidates whose only difference is a top-level key set to null in one
# and absent from the other: not equivalent, and the message names the key.
namespace: default
nads:
  - namespace: ns-1
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}, "mtu": null}'
  - namespace: ns-2
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
