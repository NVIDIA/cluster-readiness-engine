# The issue #542 workaround: a hand-made network-operator/sriov-net beside the
# platform's own NAD, with a different cniVersion. The message says to delete it.
namespace: default
nads:
  - namespace: network-operator
    name: sriov-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "1.0.0", "name": "sriov-net", "type": "host-device", "ipam": {}}'
  - namespace: nvidia-network-operator
    name: rdma-net
    annotations:
      k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
    config: '{"cniVersion": "0.3.1", "name": "rdma-net", "type": "host-device", "ipam": {}}'
