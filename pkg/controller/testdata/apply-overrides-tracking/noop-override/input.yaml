platform: "aws"
gpuArchitecture: "h100"
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            numNodes: 8
  orchestration:
    execution: {}
  overrides:
    # This override matches but sets numNodes to the same value — no-op
    - when:
        gpuArchitecture:
          equals: "h100"
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                numNodes: 8
