# Only kube-system is read: a pod elsewhere with the plugin image is not the
# installer.
platform: gcp
gpuArchitecture: h100
nodes:
  - gke-a3mega-0
  - gke-a3mega-1
pods:
  - name: nccl-tcpxo-installer-aaaaa
    nodeName: gke-a3mega-0
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
    images:
    - gke.gcr.io/pause:3.8
  - name: copy-of-installer
    namespace: default
    nodeName: gke-a3mega-1
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
    images:
    - gke.gcr.io/pause:3.8
