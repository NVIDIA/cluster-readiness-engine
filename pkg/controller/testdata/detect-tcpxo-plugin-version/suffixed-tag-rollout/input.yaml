# A rolling update from v1.0.17 to its rebuild v1.0.17-1 leaves both tags on
# the target nodes. They are the same release, so detection resolves to it
# instead of refusing as it does for different releases.
platform: gcp
gpuArchitecture: h100
nodes:
  - gke-a3mega-0
  - gke-a3mega-1
pods:
  - name: nccl-tcpxo-installer-aaaaa
    nodeName: gke-a3mega-0
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17-1
    images:
    - gke.gcr.io/pause:3.8
  - name: nccl-tcpxo-installer-bbbbb
    nodeName: gke-a3mega-1
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
    images:
    - gke.gcr.io/pause:3.8
