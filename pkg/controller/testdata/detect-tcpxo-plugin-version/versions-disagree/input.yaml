# Google allows upgrading the plugin one node pool at a time. Target nodes on
# different releases cannot share one image, so detection refuses.
platform: gcp
gpuArchitecture: h100
nodes:
  - gke-a3mega-0
  - gke-a3mega-1
pods:
  - name: nccl-tcpxo-installer-aaaaa
    nodeName: gke-a3mega-0
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.16
    images:
    - gke.gcr.io/pause:3.8
  - name: nccl-tcpxo-installer-bbbbb
    nodeName: gke-a3mega-1
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
    images:
    - gke.gcr.io/pause:3.8
