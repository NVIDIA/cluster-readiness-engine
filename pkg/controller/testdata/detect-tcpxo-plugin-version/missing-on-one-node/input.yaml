# A target node with no installer pod has no known plugin, so detection
# refuses rather than assume it matches the others.
platform: gcp
gpuArchitecture: h100
nodes:
  - gke-a3mega-0
  - gke-a3mega-1
pods:
  - name: nccl-tcpxo-installer-aaaaa
    nodeName: gke-a3mega-0
    initImages:
    - ubuntu
    - us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.17
    images:
    - gke.gcr.io/pause:3.8
