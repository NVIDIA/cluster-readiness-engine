apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: standalone-job
  namespace: default
status:
  conditions:
    - type: InProgress
      status: "True"
      reason: WorkloadRunning
      message: workload is running
    - type: Succeeded
      status: "False"
      reason: NotApplicable
      message: ""
    - type: Failed
      status: "False"
      reason: NotApplicable
      message: ""
