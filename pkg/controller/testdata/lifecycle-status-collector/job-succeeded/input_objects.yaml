apiVersion: nvcre.nvidia.com/v1alpha1
kind: Job
metadata:
  name: train-nccl-job
  namespace: default
  labels:
    nvcre.nvidia.com/workflow: train-nccl
status:
  conditions:
    - type: InProgress
      status: "False"
      reason: NotApplicable
      message: ""
    - type: Succeeded
      status: "True"
      reason: WorkloadCompleted
      message: workload completed
    - type: Failed
      status: "False"
      reason: NotApplicable
      message: ""
