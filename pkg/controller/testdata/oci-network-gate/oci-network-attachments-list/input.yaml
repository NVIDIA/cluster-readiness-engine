# An explicit networkAttachments list gates the OCI fragment off (ADR-104),
# so no entry carries the sentinel and detection never runs.
platform: oci
architectures: [l40s, gb300, h100]
nodesPerJob: [2, 1, 4, 8, 16]
networkAttachments:
  - network: nvidia-network-operator/rdma-net
    resourceName: nvidia.com/mlnxnics
