# node-02 advertises the candidate below the requested count: a request of 8
# would leave node-02's pods permanently Pending, so the candidate is
# disqualified and the message names the candidate and the count.
platform: onprem
gpuArchitecture: gb300
mlnxPerNode: 8
nodes:
  - name: node-01
    allocatable:
      rdma/ib: "8"
  - name: node-02
    allocatable:
      rdma/ib: "1"
