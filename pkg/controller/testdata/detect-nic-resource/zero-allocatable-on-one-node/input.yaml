# node-02 advertises the resource at zero: allocatable must cover the
# requested count on every node, so the candidate is disqualified (a request
# node-02 cannot satisfy would leave its pods permanently Pending).
platform: onprem
gpuArchitecture: gb300
mlnxPerNode: 1
nodes:
  - name: node-01
    allocatable:
      rdma/ib: "1"
  - name: node-02
    allocatable:
      rdma/ib: "0"
