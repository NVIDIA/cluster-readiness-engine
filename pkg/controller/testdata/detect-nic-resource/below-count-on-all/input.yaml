# A shared-device plugin advertising rdma/ib: 1 everywhere, with the gb200/
# gb300 default count of 8: no node can satisfy the request the templates
# would make, so detection refuses and the message points at nicResourceName
# and mlnxPerNode (such sites set mlnxPerNode: 1).
platform: onprem
gpuArchitecture: gb300
mlnxPerNode: 8
nodes:
  - name: node-01
    allocatable:
      rdma/ib: "1"
  - name: node-02
    allocatable:
      rdma/ib: "1"
