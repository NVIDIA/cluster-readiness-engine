# The homogeneous fleet, which is the normal case. The value is kept verbatim:
# OrchestrationStatus.DetectedGPUArchitecture would say "gb200" here, and
# gpu.ParseProduct is one-way, so the architecture cannot be turned back into a
# label match.
nodes:
  - metadata:
      name: node-a
      labels:
        nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  - metadata:
      name: node-b
      labels:
        nvidia.com/gpu.product: NVIDIA-GB200-NVL72
