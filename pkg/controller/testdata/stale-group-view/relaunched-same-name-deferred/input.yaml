# A retry relaunches the group's Job under the same name. If the live group is
# already Running on that relaunch, with retries 1, a cached view still on the
# first attempt (retries 0) must not be taken as agreement just because the Job
# names match.
groups:
  - name: group-0
    cached: {phase: Running, jobRef: g0-job, retries: 0}
    live: {phase: Running, jobRef: g0-job, retries: 1}
    job: absent
