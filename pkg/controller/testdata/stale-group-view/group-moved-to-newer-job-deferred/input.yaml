# The cache is further behind: the live group is Running again, on the Job the
# next iteration launched, while the cached view still names the previous
# iteration's Job. Running is not enough on its own; the Job has to match.
groups:
  - name: group-0
    cached: {phase: Running, jobRef: g0-iter-1}
    live: {phase: Running, jobRef: g0-iter-2}
    job: absent
