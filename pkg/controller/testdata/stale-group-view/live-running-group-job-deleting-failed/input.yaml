# The control for the deleting branch: live and cached views agree, no workload
# pods remain, the drain barrier passes, and the group fails as before.
groups:
  - name: group-0
    cached: {phase: Running, jobRef: g0-job}
    live: {phase: Running, jobRef: g0-job}
    job: deleting
