# The control: the live Workflow agrees the group is Running on this Job and the
# Job really is gone, so this is an external deletion and the group fails as it
# always has.
groups:
  - name: group-0
    cached: {phase: Running, jobRef: g0-job}
    live: {phase: Running, jobRef: g0-job}
    job: absent
