# The same unreadable log, on a Job that has only just gone terminal.
#
# A pod log read fails transiently for ordinary reasons: the API server is
# briefly unavailable, or the pod is terminating and its logs are not servable
# for a moment. Sealing on the first error made every one of those permanent
# and recorded the run as having produced nothing, at the one moment a retry
# was most likely to succeed. So nothing is sealed yet and the pass requeues.
#
# Bounded by componentSealGracePeriod from the Job going terminal, which is how
# long completeTerminalGroup waits for this seal, so the retry cannot outlive
# the thing waiting on it.
producer: structured-rows
containerName: node
truncated: true
log: |
  NVCRE_ROW {"componentID":"GPU-f00d","index":1,"name":"achievedTFLOPS","value":1402.75,"unit":"TFLOPS","sample":0,"timestamp":"2026-01-22T10:04:00Z","outcome":"pass"}
