# This Workflow's own Job under the name being launched, deleted and still held
# by its finalizer while its pods drain. (A retry's previous attempt has a
# different name, so this is not one; something else deleted it.) Adopting it
# would point the group at a Job about to vanish and fail the group on the next
# pass. The name frees up shortly, so the reconcile retries rather than adopting.
holder: own-terminating
inCache: false
