# Azure's WorkloadRun platform override requests nvidia.com/mlnxnics: 8, and
# the Workflow controller applies it after the runtime is built. An entry on
# that same resource adds an interface, so the override must leave 9 rather
# than replace the runtime's sum with its own 8.
platform: azure
gpuArchitecture: h100
nodes:
  - metadata:
      name: azure-h100-0
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    spec:
      providerID: azure:///subscriptions/x/resourceGroups/y/providers/Microsoft.Compute/virtualMachineScaleSets/z/virtualMachines/0
run:
  metadata:
    name: wr-netatt
    namespace: test-ns
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
    networkAttachments:
      - {network: nvcre/ib-extra, resourceName: nvidia.com/mlnxnics}
