# On-prem HGX B300 with a single NIC candidate (rdma/ib at 8 per node), which
# detection would otherwise request. The list owns the wiring here, so
# detection is skipped: the node container requests the two rails and no
# rdma/ib, and the launcher gets neither networks nor resources.
platform: onprem
gpuArchitecture: b300
nodes:
  - metadata:
      name: b300-0
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    status:
      allocatable:
        rdma/ib: "8"
        nvidia.com/r0: "1"
        nvidia.com/r1: "1"
run:
  metadata:
    name: wr-netatt
    namespace: test-ns
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
    networkAttachments:
      - {network: nvcre/r0, resourceName: nvidia.com/r0}
      - {network: nvcre/r1, resourceName: nvidia.com/r1}
