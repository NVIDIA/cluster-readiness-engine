# The user's spec.overrides apply after the list, as they do after every other
# WorkloadRun field, so an override that sets the networks annotation on the
# runtime's node pod replaces the list's value. The list's resource request
# stays, since the override does not touch it.
platform: onprem
gpuArchitecture: b300
nodes:
  - metadata:
      name: b300-0
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    status:
      allocatable:
        rdma/ib: "8"
        nvidia.com/r0: "1"
        nvidia.com/r1: "1"
run:
  metadata:
    name: wr-netatt
    namespace: test-ns
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
    networkAttachments:
      - {network: nvcre/r0, resourceName: nvidia.com/r0}
    overrides:
      - when: {}
        dependencies:
          - apiVersion: trainer.kubeflow.org/v1alpha1
            kind: TrainingRuntime
            metadata:
              name: wr-netatt-runtime
            spec:
              template:
                spec:
                  replicatedJobs:
                    - name: node
                      template:
                        spec:
                          template:
                            metadata:
                              annotations:
                                k8s.v1.cni.cncf.io/networks: site/override
