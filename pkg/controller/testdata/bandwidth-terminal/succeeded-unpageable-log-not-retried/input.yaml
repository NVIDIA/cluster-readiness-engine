# The log fills a page with lines that carry no timestamp to resume from. That
# fails the same way every time, so the measurement completes at once instead
# of retrying through the grace period.
jobCondition: Succeeded
podPhase: Succeeded
logTruncated: true
provisional:
  - {sizeBytes: 8, algBW: "0.00", busBW: "0.00", samples: 5}
  - {sizeBytes: 1048576, algBW: "14.00", busBW: "27.00", samples: 5}
log: |
  a line without a timestamp
