# The timeout elapsed while the pods were unschedulable, so the workload never
# ran on these nodes. They must not be recorded: the condition still says the
# Job timed out, and the message says it was blocked.
schedulingBlocked: true
groupNodes:
  - gpu-node-01
  - gpu-node-02
