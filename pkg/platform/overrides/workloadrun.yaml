      in: [gb200, gb300]
  dependencies:
{{ lib "deps/gcp-gb200-roce-runtime-patch-training.yaml" . | indent 2 }}

# --- Azure (InfiniBand) ---
# The dependency is gated on mlnxPerNode: its only content is the NIC request,
# so at 0 it drops out and the override matches with nothing to apply. The
# "when" block stays either way, mirroring how a lib-sourced dependency that
# renders empty leaves its catalog override entry in place. See ADR-087.
- when:
    platform:
      equals: azure
  dependencies:
{{- if gt (int .MlnxPerNode) 0 }}
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: {{ .EntryName }}-runtime
    spec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    containers:
                    - name: node
                      resources:
                        limits:
                          nvidia.com/mlnxnics: {{ .MlnxPerNode }}
                        requests:
                          nvidia.com/mlnxnics: {{ .MlnxPerNode }}
{{- end }}

