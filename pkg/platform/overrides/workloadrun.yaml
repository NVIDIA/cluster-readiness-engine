# Platform/GPU overrides for WorkloadRun.
# Uses the same _lib/ fragments as catalog entries.
# Template variables: .EntryName, .NodesPerJob, .GpusPerNode, .EnableMNNVL, .FrameworkType

# --- GB200/GB300 (ComputeDomain + DRA) ---
- when:
    gpuArchitecture:
      in: [gb200, gb300]
  dependencies:
{{ lib "deps/gb200-compute-domain-and-dra-torch.yaml" . | indent 2 }}

# --- Topology key per platform (physical rack / T1 leaf switch) ---
# Sets the node label used for intra-rack partitioning and for the
# rack identifier exposed in WorkloadRun status / report.nodeResults[].
# Scoped to GB200/GB300 to match the prior override scope. On these
# architectures the physical rack resolves to the same group as
# nvidia.com/gpu.clique (1 NVL72 per network domain) but uses the
# universally-meaningful platform label so external orchestrators
# can correlate report results back to the rack they targeted.
- when:
    platform:
      equals: aws
    gpuArchitecture:
      in: [gb200, gb300]
  orchestration:
    topology:
      topologyKey: topology.k8s.aws/network-node-layer-1

- when:
    platform:
      equals: gcp
    gpuArchitecture:
      in: [gb200, gb300]
  orchestration:
    topology:
      topologyKey: cloud.google.com/gce-topology-block

- when:
    platform:
      equals: azure
    gpuArchitecture:
      in: [gb200, gb300]
  orchestration:
    topology:
      topologyKey: kubernetes.azure.com/ppg

# --- AWS + GB300 (NCCL plugin cleanup) ---
# The pytorch image ships NCCL_NET_PLUGIN=ofi and /opt/amazon/aws-ofi-nccl.
# AWS GB300 is a RoCE fabric with no EFA providers, so the plugin finds nothing
# eligible and crashes. Scoped to gb300 on purpose: H100 and GB200 on AWS are
# EFA fabrics, and EFA is reachable only through libfabric via this plugin
# (NCCL's built-in net_ib does not drive EFA). Stripping it there silently drops
# NCCL to TCP over eth0 while the requested EFA devices sit unused. Mirrors the
# catalog's nemotron training override.
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  preCommand:
    - "rm -rf /opt/amazon"
    - "unset NCCL_NET_PLUGIN"
    - "unset NCCL_TUNER_PLUGIN"
    - "unset AWS_OFI_NCCL_VERSION"

# --- AWS + GB300 + MPI (NCCL plugin via mpirun -x) ---
# For MPI workloads, preCommand unset on the launcher is not forwarded to
# workers by OpenMPI. Use mpirun -x to explicitly set NCCL_NET_PLUGIN=none
# on each worker process, overriding the pytorch image default of "ofi".
# Scoped to gb300 for the same reason as the preCommand block above: on an EFA
# fabric, NCCL_NET_PLUGIN=none is what forces the socket fallback.
{{- if eq .FrameworkType "mpi" }}
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  mpiArgs:
    - "-x"
    - "NCCL_NET_PLUGIN=none"
{{- end }}

# --- AWS + GB300 + MPI (RoCE transport pins) ---
# Pins OpenMPI's own transport to TCP on eth0 and disables UCC/HCOLL,
# mirroring the catalog's AWS GB300 communication override. Without the pins,
# UCC-enabled OpenMPI builds (e.g. NGC PyTorch's HPC-X) open the mlx5 devices
# during MPI_Init with incorrect GID settings and SIGSEGV before the workload
# runs a single step. NCCL only needs TCP from MPI; it drives RDMA directly
# through the RoCE resource claims added by the AWS + GB300 dependency
# override below. The transport NCCL env rides mpirun -x so it reaches worker
# processes (launcher preCommand does not propagate). Unlike the catalog's
# block, no --prefix, no -x PATH/LD_LIBRARY_PATH, and no env -u launcher
# wrapper: those are specific to the catalog's nccl-tests image, and
# command-line --mca values already outrank image-baked OMPI_MCA_* env vars.
{{- if eq .FrameworkType "mpi" }}
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  mpiArgs:
    - --mca
    - orte_keep_fqdn_hostnames
    - "true"
{{ lib "nccl/roce-tcp-mpi-transport-args.yaml" . | indent 4 }}
{{ lib "nccl/mpi-disable-ucc-hcoll-args.yaml" . | indent 4 }}
{{ lib "nccl/aws-gb300-roce-transport-env.yaml" . | toMpiArgs | indent 4 }}
{{- end }}

# --- AWS + GB200 (EFA) ---
# IPC_LOCK lets the EFA provider pin the memory it registers for RDMA.
# BuildMPIRuntime already adds the capability; BuildTorchRuntime does not, so
# setting it here covers the torch path without duplicating it for MPI (the
# dependency merge matches containers by name and unions nothing).
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb200
  dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: {{ .EntryName }}-runtime
    spec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    containers:
                    - name: node
                      securityContext:
                        capabilities:
                          add:
                          - IPC_LOCK
                      resources:
                        limits:
                          vpc.amazonaws.com/efa: 4
                        requests:
                          vpc.amazonaws.com/efa: 4

# --- AWS + GB200 (EFA transport selection) ---
# Delivered two ways because the two framework paths read env differently.
# MPI: the launcher's container env does not reach worker processes, so the
# values ride mpirun -x. Torch: trainer.env, which Kubeflow upserts by name.
{{- if eq .FrameworkType "mpi" }}
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb200
  mpiArgs:
{{ lib "nccl/aws-efa-transport-env.yaml" . | toMpiArgs | indent 4 }}
{{- end }}
{{- if ne .FrameworkType "mpi" }}
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb200
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/aws-efa-transport-env.yaml" . | indent 12 }}
{{- end }}

# --- AWS + GB300 (RoCE) ---
# Always use the torch variant (claim name "compute-domain") to match
# the generic gb200/gb300 override above. The comm variant would
# create a conflicting "compute-domain-channel" claim alongside the
# generic "compute-domain" claim, causing the DRA driver to fail to
# allocate. The catalog comm entries use a different override stack
# that doesn't include the generic torch ComputeDomain.
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  dependencies:
{{ lib "deps/gb300-roce-torch.yaml" . | indent 2 }}

