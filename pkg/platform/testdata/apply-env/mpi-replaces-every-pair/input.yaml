# Some catalog arms forward a name twice. The OCI GB200 arms list NCCL_DEBUG
# in both oci-roce-env.yaml and gb200-env.yaml; the GB300 arms do the same with
# NCCL_IB_GID_INDEX and NCCL_IB_SPLIT_DATA_ON_QPS, the latter with conflicting
# values.
#
# mpirun takes the last -x for a name, so rewriting only the first occurrence
# would leave the catalog's later pair winning: an operator setting
# NCCL_DEBUG=WARN on OCI GB200 would get INFO on the ranks, with the render
# showing their value and the run ignoring it. Every pair is rewritten.
env:
  - name: NCCL_DEBUG
    value: WARN
jobTemplate:
  spec:
    workload:
      trainJob:
        runtimeRef:
          kind: TrainingRuntime
          name: nccl-all-reduce-runtime
        trainer:
          args:
            - -N
            - "4"
            - -x
            - NCCL_DEBUG=INFO
            - -x
            - NCCL_IB_GID_INDEX=3
            - -x
            - NCCL_DEBUG=INFO
            - /usr/local/bin/all_reduce_perf_mpi
            - -b
            - "8"
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-runtime
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
      template:
        spec:
          replicatedJobs:
            - name: node
            - name: launcher
