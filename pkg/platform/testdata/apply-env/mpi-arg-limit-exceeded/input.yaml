# Kubeflow caps trainer.args at 128 items. Each forwarded variable costs two,
# and the platform arms already render up to 75 on GCP H100, so a Certification
# inside its own 32-entry limit at each level can still push an entry past the
# cap. Caught here, where the render names the entry and the count; without the
# check it would surface as a TrainJob the API server refuses to admit, long
# after the render that caused it.
env:
  - name: TEST_VAR_0
    value: "0"
  - name: TEST_VAR_1
    value: "1"
  - name: TEST_VAR_2
    value: "2"
  - name: TEST_VAR_3
    value: "3"
  - name: TEST_VAR_4
    value: "4"
  - name: TEST_VAR_5
    value: "5"
