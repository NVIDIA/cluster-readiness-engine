# The gate check: only the exact dependency BuildMPIRuntime emits (node reaching
# Ready) is rewritten. An MPI runtime that waits on something else — here for the
# node job to Complete — keeps its gate; the rewrite must not reinterpret it.
gangScheduler:
  schedulerName: kai-scheduler
  queue: nccl-queue
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: mpi-runtime-other-gate
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
          numProcPerNode: 4
        numNodes: 1
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
            - name: launcher
              dependsOn:
                - name: node
                  status: Complete
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
