# queue is optional. Naming only a scheduler must still produce a queue label,
# because KAI Scheduler rejects a pod that names it without one.
gangScheduler:
  schedulerName: kai-scheduler
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: torch-runtime
    spec:
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                metadata:
                  labels:
                    app: torch-runtime
                spec:
                  template:
                    spec:
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/nemo:25.07
