# Under KAI the launcher's wait-for-workers step covers launcher-to-worker
# reachability, so the catalog's one replacement launcher pod (backoffLimit: 1,
# issue #498) would only add a second 20-minute wait while the gang holds its
# GPUs. The first runtime is the catalog shape and comes back with
# backoffLimit: 0. The second carries a backoffLimit an override set on
# purpose (3), which is kept.
gangScheduler:
  schedulerName: kai-scheduler
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-runtime
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
          numProcPerNode: 4
        numNodes: 2
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
            - name: launcher
              dependsOn:
                - name: node
                  status: Ready
              template:
                spec:
                  backoffLimit: 1
                  podFailurePolicy:
                    rules:
                      - action: Ignore
                        onPodConditions:
                          - status: "True"
                            type: DisruptionTarget
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-override-runtime
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
          numProcPerNode: 4
        numNodes: 2
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
            - name: launcher
              dependsOn:
                - name: node
                  status: Ready
              template:
                spec:
                  backoffLimit: 3
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
