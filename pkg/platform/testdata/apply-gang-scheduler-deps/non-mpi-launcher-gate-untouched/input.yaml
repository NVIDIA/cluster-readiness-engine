# The guard: a runtime without spec.mlPolicy.mpi is not an MPI workload, so a
# replicated job that happens to be called "launcher" and carry a dependsOn gate
# keeps its meaning — this rewrite must not reinterpret other people's topology.
gangScheduler:
  schedulerName: kai-scheduler
  queue: nccl-queue
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: some-torch-runtime
    spec:
      mlPolicy:
        numNodes: 1
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
            - name: launcher
              dependsOn:
                - name: node
                  status: Ready
              template:
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.01
