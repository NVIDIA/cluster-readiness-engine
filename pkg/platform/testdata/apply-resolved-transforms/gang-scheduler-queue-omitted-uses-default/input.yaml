# An existing KAI configuration that names no queue: the workload object gets
# the same default-queue the runtime templates get, and the persisted intent
# records it explicitly so later checks compare against a resolved value.
gangScheduler:
  schedulerName: kai-scheduler
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
          trainer:
            image: nvcr.io/nvidia/pytorch:25.01
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      trainer.kubeflow.org/trainjob-ancestor-step: trainer
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
