# The Go mirror of the CRD rule, which is what offline nvcrectl render relies
# on since it never reaches an API server.
workloadLabels:
  nvcre.nvidia.com/job: sneaky
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
          trainer:
            image: nvcr.io/nvidia/pytorch:25.01
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      trainer.kubeflow.org/trainjob-ancestor-step: trainer
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
