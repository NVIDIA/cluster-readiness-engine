# Arbitrary workload-object labels without any gang scheduling. Kueue is never
# inferred from gangScheduler, so this is the only way its queue label is set.
workloadLabels:
  kueue.x-k8s.io/queue-name: gpu-team-a
  environment: burn-in
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
          trainer:
            image: nvcr.io/nvidia/pytorch:25.01
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      trainer.kubeflow.org/trainjob-ancestor-step: trainer
                  spec:
                    template:
                      spec:
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
