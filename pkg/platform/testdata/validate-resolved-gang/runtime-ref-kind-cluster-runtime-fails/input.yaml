# An override flipped runtimeRef.kind to ClusterTrainingRuntime while leaving the
# name alone. Trainer resolves the runtime by group, kind and name together, so
# it would now use a cluster-scoped runtime that is not this Workflow's
# dependency at all. Matching on the name alone would have inspected the
# namespaced TrainingRuntime below and reported a guarantee about a resource the
# workload never touches.
spec:
  gangScheduler:
    schedulerName: kai-scheduler
    queue: queue-a
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kai.scheduler/queue: queue-a
      workload:
        trainJob:
          runtimeRef:
            kind: ClusterTrainingRuntime
            name: nccl-runtime
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
