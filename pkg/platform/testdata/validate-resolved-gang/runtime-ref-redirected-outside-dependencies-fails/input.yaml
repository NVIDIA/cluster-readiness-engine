# An override repointed runtimeRef at a runtime NVCRE was not given. It
# cannot vouch for a runtime it cannot see, and the persisted intent exists
# precisely to promise that the manifests NVCRE submits are consistent.
spec:
  gangScheduler:
    schedulerName: kai-scheduler
    queue: queue-a
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kai.scheduler/queue: queue-a
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: somebody-elses-runtime
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
