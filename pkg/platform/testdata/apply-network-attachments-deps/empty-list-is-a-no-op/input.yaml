# No list: the runtime comes back byte for byte, catalog annotation included.
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-runtime
    spec:
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    metadata:
                      annotations:
                        k8s.v1.cni.cncf.io/networks: network-operator/sriov-net,network-operator/sriov-net
                        example.com/keep: "yes"
                    spec:
                      containers:
                        - name: node
                          image: nccl-tests
                          resources:
                            limits:
                              nvidia.com/gpu: "8"
                            requests:
                              nvidia.com/gpu: "8"
            - name: launcher
              template:
                spec:
                  template:
                    spec:
                      containers:
                        - name: node
                          image: nccl-tests
