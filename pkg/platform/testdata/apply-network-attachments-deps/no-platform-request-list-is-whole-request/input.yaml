# OCI with a list, and any platform with mlnxPerNode: 0: the default
# nvidia.com/mlnxnics wiring is not rendered, so nothing is there to add to and
# the list's count is the whole request (one entry, one device). The list's
# networks annotation replaces the catalog's.
networkAttachments:
  - {network: nvcre/ib0, resourceName: nvidia.com/mlnxnics}
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nccl-all-reduce-runtime
    spec:
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    metadata:
                      annotations:
                        k8s.v1.cni.cncf.io/networks: ib-net
                    spec:
                      containers:
                        - name: node
                          image: nccl-tests
                          resources:
                            limits:
                              nvidia.com/gpu: "8"
                            requests:
                              nvidia.com/gpu: "8"
