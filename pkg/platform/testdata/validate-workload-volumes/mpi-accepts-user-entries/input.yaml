# The issue #455 shape on mpi with spec.config set: hostPath RDMA devices and
# a scratch directory, none of them at a reserved name or path. The config
# volume itself is appended by the call sites after this check runs, so it is
# not in the input.
framework: mpi
hasConfig: true
volumes:
  - name: ib-dev
    hostPath:
      path: /dev/infiniband
      type: Directory
  - name: scratch
    emptyDir: {}
volumeMounts:
  - name: ib-dev
    mountPath: /dev/infiniband
  - name: scratch
    mountPath: /scratch
