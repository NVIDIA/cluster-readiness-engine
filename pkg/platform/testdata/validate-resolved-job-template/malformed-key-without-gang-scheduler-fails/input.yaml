# Key syntax likewise. Admission would catch this for a Job or Workflow that
# reaches an API server; offline render never does.
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          "bad key": x
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
