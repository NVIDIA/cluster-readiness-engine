# The baseline: ordinary labels on a Workflow without gang scheduling are
# accepted and left alone, and nothing is inserted.
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          kueue.x-k8s.io/queue-name: gpu-team-a
          environment: burn-in
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
