# An override introduced a controller-owned key on a Workflow that configures no
# gang scheduling at all. The gang half of the check has nothing to do here, so
# if label validation were gated behind gangScheduler this would pass and offline
# render would emit a label the cluster rejects.
spec:
  jobTemplate:
    spec:
      workloadMetadata:
        labels:
          nvcre.nvidia.com/job: sneaky
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-runtime
  dependencies:
    - apiVersion: trainer.kubeflow.org/v1alpha1
      kind: TrainingRuntime
      metadata:
        name: nccl-runtime
      spec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
              - name: launcher
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: queue-a
                  spec:
                    template:
                      metadata:
                        labels:
                          kai.scheduler/queue: queue-a
                      spec:
                        schedulerName: kai-scheduler
                        containers:
                          - name: node
                            image: nvcr.io/nvidia/pytorch:25.01
