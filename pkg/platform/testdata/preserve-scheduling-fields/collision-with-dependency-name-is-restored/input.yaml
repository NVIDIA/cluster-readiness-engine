# The configured queue happens to equal the runtime's own name, so renaming
# rewrote both queue labels along with the reference. renamedOnly shows the
# damage; preserved shows the configured queue back in place.
gangScheduler:
  schedulerName: kai-scheduler
  queue: shared-runtime
  queueLabelKey: kai.scheduler/queue
replacements:
  shared-runtime: shared-runtime-group-0-job
dependency:
  apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: shared-runtime
  spec:
    template:
      spec:
        replicatedJobs:
          - name: node
            template:
              metadata:
                labels:
                  kai.scheduler/queue: shared-runtime
              spec:
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: shared-runtime
                  spec:
                    schedulerName: kai-scheduler
                    containers:
                      - name: node
                        image: test:latest
