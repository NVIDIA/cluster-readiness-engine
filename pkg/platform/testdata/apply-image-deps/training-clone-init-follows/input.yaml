# The training shape: the node pod provisions Megatron-LM source in the
# megatron-clone init container, which the catalog derives from the workload
# ref (pkg/catalog/entries/training/nemotron5-8b.yaml puts the same
# pytorch:25.08-py3 on both). Because the init carries the exact pre-override
# primary image, the override must replace it along with the training
# container and the trainer image: a prebaked user image that ships the
# source in-image only works if the clone init runs that image too.
image: registry.example.com/prebaked/nemo:v3
jobTemplate:
  spec:
    workload:
      trainJob:
        runtimeRef:
          name: nemotron5-8b-runtime
        trainer:
          image: nvcr.io/nvidia/pytorch:25.08-py3
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: nemotron5-8b-runtime
    spec:
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      schedulerName: default-scheduler
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/pytorch:25.08-py3
                      initContainers:
                        - name: megatron-clone
                          image: nvcr.io/nvidia/pytorch:25.08-py3
