# A renamed controller ClusterRole with the pinned chart's write verbs
# survives after its CRD was deleted. Write verbs on jobset.x-k8s.io are a
# fingerprint whatever the name, so the fresh install refuses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: renamed-jobset-controller
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets, jobsets/finalizers, jobsets/status]
    verbs: [create, delete, get, list, patch, update, watch]
