# GKE's addon-managed JobSet metrics RBAC, copied from a GKE 1.34.11 cluster
# (component clustermetrics-rbac 1.8.5; uid and resourceVersion stripped).
# GKE enables the JobSet metrics package by default from 1.32.1-gke.1357001
# and the addon manager recreates this role if it is deleted. Its only
# jobset.x-k8s.io rule is read-only; its write verbs are on core Events.
# Issue #367.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    components.gke.io/component-name: clustermetrics-rbac
    components.gke.io/component-version: 1.8.5
  creationTimestamp: "2026-09-22T19:38:13Z"
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
  name: system:clustermetrics
rules:
- apiGroups:
  - tenancy.gke.io
  resources:
  - tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - jobset.x-k8s.io
  resources:
  - jobsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - componentstatuses
  - namespaces
  - nodes
  - pods
  - resourcequotas
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - update
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jobset-controller
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets, jobsets/finalizers, jobsets/status]
    verbs: [create, delete, get, list, patch, update, watch]
