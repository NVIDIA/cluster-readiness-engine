apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-trainer-controller-manager
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kubeflow-trainer-2.1.0
    app.kubernetes.io/name: kubeflow-trainer
    app.kubernetes.io/component: manager
  annotations:
    meta.helm.sh/release-name: kubeflow-trainer
    meta.helm.sh/release-namespace: kubeflow-system
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-jobset-controller
  labels:
    helm.sh/chart: jobset-0.10.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jobset
    app.kubernetes.io/instance: external-jobset
    app.kubernetes.io/component: controller
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: jobset-validating-webhook-configuration
  labels:
    helm.sh/chart: jobset-0.10.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jobset
    app.kubernetes.io/instance: external-jobset
    app.kubernetes.io/component: webhook
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
webhooks:
  - name: validate-jobset-x-k8s-io-v1alpha2-jobset.x-k8s.io
    clientConfig:
      service: {name: external-jobset-webhook-service, namespace: external-system}
    rules:
      - apiGroups: [jobset.x-k8s.io]
        resources: [jobsets]
---
apiVersion: v1
kind: Service
metadata:
  name: external-jobset-webhook-service
  namespace: external-system
  labels:
    helm.sh/chart: jobset-0.10.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jobset
    app.kubernetes.io/instance: external-jobset
    app.kubernetes.io/component: webhook
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
spec:
  selector:
    app.kubernetes.io/name: jobset
    app.kubernetes.io/instance: external-jobset
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-jobset-controller
  namespace: external-system
  labels:
    helm.sh/chart: jobset-0.10.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jobset
    app.kubernetes.io/instance: external-jobset
    app.kubernetes.io/component: controller
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jobset
      app.kubernetes.io/instance: external-jobset
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobset
        app.kubernetes.io/instance: external-jobset
        app.kubernetes.io/component: controller
    spec:
      containers: [{name: manager, image: example.invalid/jobset:test}]
