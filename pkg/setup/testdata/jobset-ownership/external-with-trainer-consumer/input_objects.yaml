apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-trainer-controller-manager
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kubeflow-trainer-2.1.0
    app.kubernetes.io/name: kubeflow-trainer
    app.kubernetes.io/component: manager
  annotations:
    meta.helm.sh/release-name: kubeflow-trainer
    meta.helm.sh/release-namespace: kubeflow-system
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-jobset-controller
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: external-jobset-validating
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
webhooks:
  - name: jobsets.external.example
    clientConfig:
      service: {name: external-jobset-webhook, namespace: external-system}
    rules:
      - apiGroups: [jobset.x-k8s.io]
        resources: [jobsets]
---
apiVersion: v1
kind: Service
metadata:
  name: external-jobset-webhook
  namespace: external-system
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
spec:
  selector: {app: external-jobset}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-jobset-controller
  namespace: external-system
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: external-jobset
    meta.helm.sh/release-namespace: external-system
spec:
  selector:
    matchLabels: {app: external-jobset}
  template:
    metadata:
      labels: {app: external-jobset}
    spec:
      containers: [{name: manager, image: example.invalid/jobset:test}]
