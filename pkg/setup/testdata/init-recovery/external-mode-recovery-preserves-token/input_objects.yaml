# An external JobSet outside kubeflow-system. Its controller and CRD both
# survive this recovery, so it must not block: ADR-078 decision 4 exempts
# external instances elsewhere, while any instance inside kubeflow-system
# still blocks because namespace deletion would destroy it.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: tenant-jobset
  namespace: team-a
  uid: tenant-jobset-uid
