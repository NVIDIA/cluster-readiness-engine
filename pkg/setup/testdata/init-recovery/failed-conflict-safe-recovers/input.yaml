# The issue #180 field failure: the release is failed and the retry hits the
# webhook Secret field-ownership conflicts. No TrainJob/JobSet instances
# exist and the only runtime CR is Helm-owned, so the safety gate passes and
# the automatic recovery runs: uninstall, delete the three Trainer CRDs while
# retaining the JobSet CRD, delete the
# namespace, reinstall (ADR-073 decision 3a).
releaseState: failed
chartVersion: ""
releaseManifest: |
  apiVersion: trainer.kubeflow.org/v1alpha1
  kind: ClusterTrainingRuntime
  metadata:
    name: torch-distributed
  ---
  apiVersion: v1
  kind: Secret
  metadata:
    name: kubeflow-trainer-webhook-cert
    namespace: kubeflow-system
  ---
  apiVersion: v1
  kind: Secret
  metadata:
    name: jobset-webhook-server-cert
    namespace: kubeflow-system
installResults:
  - fail: true
    output: |
      Error: UPGRADE FAILED: Unable to continue with update: could not update Secret "kubeflow-trainer-webhook-cert" in namespace "kubeflow-system": Apply failed with 2 conflicts: conflicts with "trainer-controller" using v1: .data.tls.crt, .data.tls.key
      could not update Secret "jobset-webhook-server-cert" in namespace "kubeflow-system": Apply failed with 2 conflicts: conflicts with "jobset-controller" using v1: .data.tls.crt, .data.tls.key
  - fail: false
