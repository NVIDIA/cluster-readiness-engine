---
# Source: crds/widgets.yaml — helm show crds emits a separator per crds/
# file and the files carry leading separators of their own, so blank and
# comment-only documents must be skipped without error.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.fresh.nvcre.example.com
spec:
  group: fresh.nvcre.example.com
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
---
# A non-CRD document must be skipped, not applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-crd
  namespace: default
data:
  key: value
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.fresh.nvcre.example.com
spec:
  group: fresh.nvcre.example.com
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
