# On-prem is the detection fallback: an empty providerID (and no Forge
# hostname or NKE site label) resolves to "onprem".
metadata:
  labels:
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: "NVIDIA-GB300"
spec:
  providerID: ""
