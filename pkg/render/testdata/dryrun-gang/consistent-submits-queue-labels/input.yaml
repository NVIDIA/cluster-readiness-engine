# The control case. The runtime agrees with the persisted queue-a intent, so
# the dry run must get past the check and actually issue requests, and the
# submitted TrainJob must carry the queue label rather than merely exist. The
# runtime must agree at both template levels and on the scheduler name.
runtimeQueue: queue-a
