# Verify AWS RTX mock-node detection and exclusion of the GCP control.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-workflow
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            numNodes: 2
            numProcPerNode: 8
            image: nvcr.io/nvidia/pytorch:26.03-py3
            command: ["/bin/bash", "-c"]
            args: ["torchrun --nnodes 2"]
  orchestration:
    execution: {}
  overrides:
    - when:
        platform: { equals: "aws" }
        gpuArchitecture: { equals: "rtxpro6000" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                env:
                  - name: CRE_TEST_AWS_RTX_MARKER
                    value: "matched"
    - when:
        platform: { equals: "gcp" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                env:
                  - name: FI_EFA_USE_DEVICE_RDMA
                    value: "1"
