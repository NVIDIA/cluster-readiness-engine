# Exercises the onprem-b300 mock node fixture (empty providerID resolves to
# the onprem platform; the product label parses to b300, ADR-094). The first
# override mirrors the shape of the catalog's x86 HGX on-prem block (platform
# equals onprem, gpuArchitecture in b200/b300) and must match; the aws control
# override must not.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-workflow
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            numNodes: 2
            numProcPerNode: 4
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command: ["/bin/bash", "-c"]
            args: ["torchrun --nnodes 2"]
  orchestration:
    execution: {}
  overrides:
    - when:
        platform: { equals: "onprem" }
        gpuArchitecture: { in: ["b200", "b300"] }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                env:
                  - name: CRE_TEST_HGX_MARKER
                    value: "matched"
    - when:
        platform: { equals: "aws" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                env:
                  - name: FI_EFA_USE_DEVICE_RDMA
                    value: "1"
