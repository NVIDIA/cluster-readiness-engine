apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-workflow
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            numNodes: 4
            numProcPerNode: 4
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command: ["/bin/bash", "-c"]
            args: ["torchrun --nnodes 4"]
  orchestration:
    execution: {}
  overrides:
    - when:
        gpuArchitecture: { equals: "h100" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                numNodes: 8
    - when:
        platform: { equals: "aws" }
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-config
          data:
            region: us-east-1
