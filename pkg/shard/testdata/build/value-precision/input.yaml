# Values chosen to expose what json.Marshal does to a float64 on its own.
#
# It emits the shortest form that round trips, so 1500.50 becomes 1500.5, 1200
# becomes 1200, and 0.30000000000000004 keeps all seventeen digits. The byte
# form of a row would then depend on the magnitude of its value, and the
# bundle manifest's sha256 is taken over exactly those bytes. Row.MarshalJSON
# formats to two places explicitly instead, and this case is what pins it.
rows:
  - node: node-000
    componentID: GPU-a000
    index: 0
    name: trailingZero
    value: 1500.50
    unit: TFLOPS
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: pass
  - node: node-000
    componentID: GPU-a000
    index: 0
    name: integral
    value: 1200
    unit: TFLOPS
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: pass
  - node: node-000
    componentID: GPU-a000
    index: 0
    name: repeating
    value: 0.30000000000000004
    unit: ratio
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: pass
  - node: node-000
    componentID: GPU-a000
    index: 0
    name: roundsUp
    value: 1234.567
    unit: TFLOPS
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: pass
  - node: node-000
    componentID: GPU-a000
    index: 0
    name: zero
    value: 0
    unit: TFLOPS
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: fail
