# Rows handed in deliberately against the normative order, varying every key
# including sample, so the golden pins the sort rather than the input order.
#
# The last two rows share (node, componentID, index, name) and differ only in
# sample. Under ADR-090's four field key they would tie, and sort.Slice is not
# stable, so their relative order would not be reproducible and the bundle
# manifest's sha256 would be unverifiable. Appending sample is what fixes that,
# and these two rows are the case that proves it.
# The first two rows make the leading key load bearing. Every other fixture
# happens to name components so that componentID sorts the same way as node,
# which leaves the node comparison redundant: deleting it from rowCompare
# passed the entire suite. Here componentID sorts the opposite way to node, so
# only an order that really compares node first puts node-a00 ahead.
#
# The pair after them does the same for index, which no other fixture exercises
# either: same node, same componentID, differing only in index.
rows:
  - node: node-b00
    componentID: GPU-aaa
    index: 0
    name: achievedTFLOPS
    value: 800.5
    unit: TFLOPS
    sample: 0
    timestamp: "2026-11-03T00:00:00Z"
    outcome: pass
  - node: node-a00
    componentID: GPU-zzz
    index: 0
    name: achievedTFLOPS
