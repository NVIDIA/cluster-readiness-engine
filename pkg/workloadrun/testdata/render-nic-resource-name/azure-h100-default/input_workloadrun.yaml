# The control: without nicResourceName the Azure platform override keeps
# requesting nvidia.com/mlnxnics at the h100 count of 8.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-nic
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
