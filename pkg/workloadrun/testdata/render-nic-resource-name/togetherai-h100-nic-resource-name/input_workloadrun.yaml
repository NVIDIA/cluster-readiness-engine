# The TogetherAI WorkloadRun override reuses deps/togetherai-ib-runtime-patch.yaml,
# so nicResourceName replaces nvidia.com/mlnxnics there too.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-nic
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  nicResourceName: rdma/hca_shared_devices_a
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
