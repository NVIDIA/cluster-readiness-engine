# Issue #583 through the WorkloadRun path: the Azure platform override
# requests rdma/hca_shared_devices_a at the h100 count of 8 instead of
# nvidia.com/mlnxnics.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-nic
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  nicResourceName: rdma/hca_shared_devices_a
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
