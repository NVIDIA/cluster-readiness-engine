# ADR-085: an MPI WorkloadRun on Nscale GB300 must receive the IB NCCL env
# as -x pairs ahead of the user's own mpiArgs. Ranks start under sshd with a
# fresh environment, so NCCL_IB_PCI_RELAXED_ORDERING=1 reaches them only
# through mpirun -x.
run:
  metadata:
    name: wr-mpi-nscale-gb300
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:26.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
        mpiArgs: ["--tag-output"]
platform: nscale
gpuArch: gb300
gpusPerNode: 4
mlnxPerNode: 4
enableMNNVL: true
frameworkType: mpi
