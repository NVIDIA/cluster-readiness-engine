# Issue #175 / ADR-070: an MPI WorkloadRun on AWS GB300 (RoCE) must receive
# the OpenMPI TCP transport pins, the UCC/HCOLL disables, and the -x'd RoCE
# NCCL transport env — prepended ahead of the user's own mpiArgs, together
# with the AWS-wide -x NCCL_NET_PLUGIN=none block.
run:
  metadata:
    name: wr-mpi-gb300
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:26.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
        mpiArgs: ["--tag-output"]
platform: aws
gpuArch: gb300
gpusPerNode: 4
mlnxPerNode: 0
enableMNNVL: true
frameworkType: mpi
