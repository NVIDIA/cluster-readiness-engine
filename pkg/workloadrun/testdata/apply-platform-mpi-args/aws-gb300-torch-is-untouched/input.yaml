# Torch never launches through mpirun: the AWS GB300 transport block is scoped
# to the MPI framework, and a torch run has no spec.framework.mpi to write to.
# The function must be a no-op so the torch render stays unchanged (ADR-070).
run:
  metadata:
    name: wr-torch-gb300
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:26.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
platform: aws
gpuArch: gb300
gpusPerNode: 4
mlnxPerNode: 0
enableMNNVL: true
frameworkType: torch
