# Torch never launches through mpirun: the AWS B300 EFA transport env goes to
# the trainer env block for torch, so the mpiArgs path must be a no-op.
run:
  metadata:
    name: wr-torch-b300
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:26.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
platform: aws
gpuArch: b300
gpusPerNode: 8
mlnxPerNode: 8
enableMNNVL: false
frameworkType: torch
