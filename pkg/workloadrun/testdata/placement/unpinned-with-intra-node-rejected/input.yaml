# intra-node and Unpinned are both requests for a job count, and they disagree:
# intra-node means one job per target node, Unpinned means exactly one job. The
# render must refuse rather than pick a winner, because either silent choice
# discards something the user explicitly wrote.
#
# This is the WorkloadRun tier's version of the strictDomain rejection on the
# Workflow tier, and the two agree by construction rather than by resemblance:
# intra-rack lowers to Topology{StrictDomain: true}, which is literally the
# field the Workflow check rejects.
run:
  metadata:
    name: wr-unpinned-intra-node
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    orchestration:
      placement: Unpinned
      testScale: intra-node
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
