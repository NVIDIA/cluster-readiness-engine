# A networkAttachments list owns the NIC wiring, so the single candidate the
# nodes advertise is not injected and nicResourceName stays unset.
platform: onprem
gpuArchitecture: b300
mlnxPerNode: 8
nodes:
  - metadata:
      name: b300-0
      labels:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
    status:
      allocatable:
        rdma/rdma_shared_device_a: "8"
        nvidia.com/r0: "1"
        nvidia.com/r1: "1"
run:
  metadata:
    name: wr-netatt
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
    networkAttachments:
      - {network: nvcre/r0, resourceName: nvidia.com/r0}
      - {network: nvcre/r1, resourceName: nvidia.com/r1}
