# A list that is set must not be empty, mirroring the CRD MinItems: an empty
# list would disable NIC auto-detection while attaching nothing.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-netatt
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
  networkAttachments: []
