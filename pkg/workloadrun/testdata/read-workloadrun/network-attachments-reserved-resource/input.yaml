# resourceName follows the nicResourceName rules: the kubernetes.io domain is
# reserved, so it is rejected offline as the CRD rejects it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-netatt
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
  networkAttachments:
    - {network: nvcre/r0, resourceName: kubernetes.io/r0}
