# A NetworkAttachmentDefinition name is a DNS-1123 subdomain, so an
# upper-case network is rejected offline as the CRD Pattern rejects it.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-netatt
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  framework:
    mpi:
      binary: /usr/local/bin/all_reduce_perf_mpi
      mpirunPath: /usr/local/mpi/bin/mpirun
  networkAttachments:
    - {network: nvcre/IB-Rail0, resourceName: nvidia.com/r0}
