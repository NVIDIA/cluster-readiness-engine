# An override moved the runtime's Job-template queue label to B. Runtime labels
# are assertions over a dependency payload the operator may own, so this fails
# and is never repaired.
run:
  metadata:
    name: wr-rt-b
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: kai-scheduler
      queue: queue-a
    overrides:
      - when:
          platform:
              equals: aws
        dependencies:
          - apiVersion: trainer.kubeflow.org/v1alpha1
            kind: TrainingRuntime
            metadata:
              name: wr-rt-b-runtime
            spec:
              template:
                spec:
                  replicatedJobs:
                    - name: node
                      template:
                        metadata:
                          labels:
                            kai.scheduler/queue: queue-b
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
platform: aws
gpuArchitecture: NVIDIA-GB200
