# The Go mirror of the reserved-key admission rule, which offline nvcrectl render
# relies on since it never reaches an API server.
run:
  metadata:
    name: wr-reserved
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    workloadMetadata:
      labels:
        nvcre.nvidia.com/job: sneaky
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
