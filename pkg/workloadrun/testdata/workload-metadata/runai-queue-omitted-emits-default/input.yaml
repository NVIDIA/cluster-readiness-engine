# The Run:ai half of the existing-user matrix. A configuration that names the
# custom queue label key but no queue resolves to default-queue under that key,
# not under KAI's, and the persisted intent records both defaults so a rendered
# Workflow submitted on its own checks the same thing.
run:
  metadata:
    name: wr-runai-default
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: runai-scheduler
      queueLabelKey: runai/queue
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
