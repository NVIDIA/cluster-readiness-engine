# Run:ai reads runai/queue, so that is the key on the workload object and in the
# persisted intent.
run:
  metadata:
    name: wr-runai
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: runai-scheduler
      queueLabelKey: runai/queue
      queue: team-a
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
