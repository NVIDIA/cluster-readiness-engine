# An existing configuration that names no queue gets default-queue on the
# workload object, matching what the runtime templates get.
run:
  metadata:
    name: wr-kai-default
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: kai-scheduler
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
