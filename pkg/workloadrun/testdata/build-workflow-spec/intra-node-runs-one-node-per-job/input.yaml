# B6, fixed by PR #61 on the render path.
#
# A testScale of intra-node means that each node is tested on its own.
# Partitioning reads the numNodes of the workload rather than any orchestration
# field, so the setting used to do nothing, and a run over 4 nodes stayed one
# job of 4 nodes. PR #61 added the scale-based sizing to the command line render
# path, and this case records the result. The trainer asks for 1 node even
# though the run asks for 4.
#
# The controller reconcile path applies the same rule since issue #85: both
# paths call controller.NodesPerJobForScale. This case still covers the preview
# only; the on-cluster behaviour is pinned by
# cmd/integration/testdata/reconcile/workloadrun-intra-node, which asserts a
# 4-node run partitions into 4 groups.
run:
  metadata:
    name: wr-intra-node
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 4
    framework:
      torch:
        script: /workspace/train.py
    orchestration:
      testScale: intra-node
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
