# Issue #400 on WorkloadRun: networkAttachments puts the Multus networks
# annotation on the node pod template in list order and requests each rail's
# resource on the node container, and the MPI launcher gets neither.
run:
  metadata:
    name: wr-multirail
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /workspace/all_reduce_perf
        mpirunPath: /usr/local/mpi/bin/mpirun
    networkAttachments:
      - {network: nvcre/r0, resourceName: nvidia.com/r0}
      - {network: nvcre/r1, resourceName: nvidia.com/r1}
      - {network: nvcre/r2, resourceName: nvidia.com/r2, count: 2}
gpusPerNode: 8
mlnxPerNode: 8
enableMNNVL: false
frameworkType: mpi
