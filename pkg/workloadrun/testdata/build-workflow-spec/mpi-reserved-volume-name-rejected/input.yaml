# A volume named mpi-ssh-auth on the mpi framework: the Kubeflow Trainer MPI
# plugin upserts that volume by name on every worker and launcher pod, so the
# user's Secret would be silently replaced by the generated SSH keys. The
# render path must refuse it with the same message as the controller, before
# anything is built.
run:
  metadata:
    name: wr-mpi-reserved
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        binary: /usr/local/bin/all_reduce_perf_mpi
        mpirunPath: /usr/local/mpi/bin/mpirun
    volumes:
      - name: mpi-ssh-auth
        secret:
          secretName: my-ssh-keys
    volumeMounts:
      - name: mpi-ssh-auth
        mountPath: /etc/my-ssh-keys
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: mpi
