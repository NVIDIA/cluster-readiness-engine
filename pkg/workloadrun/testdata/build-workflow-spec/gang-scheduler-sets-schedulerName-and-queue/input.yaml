# A torch WorkloadRun with gangScheduler configured. BuildWorkflowSpec must
# propagate SchedulerName and Queue into the RuntimeConfig so the platform
# builder injects schedulerName into the pod spec and the queue label into
# the pod template metadata.
run:
  metadata:
    name: wr-gang
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: kai-scheduler
      queue: my-queue
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
