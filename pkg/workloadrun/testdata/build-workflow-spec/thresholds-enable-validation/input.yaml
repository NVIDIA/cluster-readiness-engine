# Thresholds are the only thing that turns on the Validation block, and T1
# showed why the block is needed. When no thresholds are set,
# checkPerformanceThresholds returns early, so nothing checks that any data was
# collected. The presence of the block decides whether a run is measured or only
# watched.
#
# Note the spelling of the key. Since issue #52 was fixed, an unknown threshold
# key is rejected outright — by readWorkloadRun at the CLI and by the Job
# controller with ValidationFailed reason UnknownThresholdKey — so the exact
# string here decides whether the run is accepted at all.
run:
  metadata:
    name: wr-thresholds
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    thresholds:
      busBandwidthGBps: "value >= 100"
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
