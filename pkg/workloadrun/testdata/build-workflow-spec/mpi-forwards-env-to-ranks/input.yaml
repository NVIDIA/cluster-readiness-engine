# MPI ranks start under sshd with a fresh environment, so trainer.args must
# forward the merged env (NCCL defaults plus spec.env) with mpirun -x:
#
#   NCCL_SHM_DISABLE=0    spec.env replaces the default NCCL_SHM_DISABLE=1
#   CRE_TEST_MARKER       valueFrom is forwarded by bare name, for mpirun to
#                         read from the launcher env
#   NCCL_DEBUG            not forwarded from env: the user's own -x
#                         NCCL_DEBUG=WARN in mpiArgs takes precedence
run:
  metadata:
    name: wr-mpi-env
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    env:
      - name: NCCL_SHM_DISABLE
        value: "0"
      - name: CRE_TEST_MARKER
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    framework:
      mpi:
        binary: /workspace/all_reduce_perf
        mpirunPath: /usr/local/mpi/bin/mpirun
        mpiArgs: ["-x", "NCCL_DEBUG=WARN"]
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: mpi
