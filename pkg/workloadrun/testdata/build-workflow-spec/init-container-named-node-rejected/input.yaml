# An init container named node, the workload container's name on every
# framework. Kubernetes requires a pod's container names to be unique across
# its init and regular containers, so left alone this fails at pod creation
# with nothing on the WorkloadRun to say why.
run:
  metadata:
    name: wr-torch-reserved-init
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    initContainers:
      - name: node
        image: busybox:1.36
        command: ["sh", "-c", "echo staging"]
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
