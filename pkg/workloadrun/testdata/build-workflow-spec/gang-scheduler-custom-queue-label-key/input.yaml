# The Run:ai combination from ADR-076: GangScheduler.QueueLabelKey moves the
# queue label from kai.scheduler/queue to runai/queue, at both the Job template
# and the pod template metadata of the TrainingRuntime dependency, and
# kai.scheduler/queue must not appear at either level.
run:
  metadata:
    name: wr-runai
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: runai-scheduler
      queueLabelKey: runai/queue
      queue: team-a
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
