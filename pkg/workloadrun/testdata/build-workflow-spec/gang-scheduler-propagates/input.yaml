# Verifies that GangScheduler.SchedulerName and GangScheduler.Queue propagate
# through BuildWorkflowSpec into the TrainingRuntime dependency, so pkg/platform
# injects schedulerName into pod specs and the kai.scheduler/queue label into
# pod template metadata (WR-002-gang).
run:
  metadata:
    name: wr-gang
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      torch:
        script: /workspace/train.py
    gangScheduler:
      schedulerName: kai-scheduler
      queue: high-priority
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
