apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: wr-nscale
  namespace: default
spec:
  image: nvcr.io/nvidia/pytorch:24.01-py3
  numNodes: 2
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B200
  framework:
    torch:
      script: /workspace/train.py
