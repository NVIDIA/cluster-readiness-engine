- name: PATH
  value: "$PATH:/usr/bin:/bin"
- name: LD_LIBRARY_PATH
  value: "/opt/amazon/openmpi/lib:/opt/nccl/build/lib:/usr/local/nvidia/lib:$LD_LIBRARY_PATH"
- name: NCCL_DEBUG
  value: INFO
- name: NCCL_DEBUG_SUBSYS
  value: NET,INIT
- name: NCCL_SOCKET_IFNAME
  value: eth0
- name: NCCL_IB_GID_INDEX
  value: "3"
- name: NCCL_NVLS_ENABLE
  value: "1"
- name: NCCL_CUMEM_ENABLE
  value: "1"
- name: NCCL_NET_GDR_C2C
  value: "1"
- name: NCCL_MNNVL_ENABLE
  value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
