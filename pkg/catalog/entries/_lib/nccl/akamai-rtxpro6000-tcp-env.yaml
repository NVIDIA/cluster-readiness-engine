# Akamai LKE RTX PRO 6000 VMs use eth0 and have no RDMA resources.
- name: NCCL_DEBUG
  value: INFO
- name: NCCL_IB_DISABLE
  value: "1"
# Avoid initializing an image-bundled RDMA plugin on the TCP-only VM network.
- name: NCCL_NET_PLUGIN
  value: none
- name: NCCL_SOCKET_IFNAME
  value: eth0
# Multi-GPU VM PCIe peer-to-peer paths are not qualified. Disable that
# transport rather than enabling paths through the PCIe host bridge.
{{- if gt (int .GpusPerNode) 1 }}
- name: NCCL_P2P_DISABLE
  value: "1"
{{- end }}
