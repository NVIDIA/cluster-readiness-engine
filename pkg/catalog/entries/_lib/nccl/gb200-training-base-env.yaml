# NCCL_NVLS_ENABLE is deliberately omitted. It arrived with the initial
# catalog and no record of being measured; NCCL_DEBUG_SUBSYS below still
# names NVLS, so a run that uses it says so in the log. See BaseNCCLEnvVars
# in pkg/platform/nccl.go for why 1 is the wrong value to assert (#514).

- name: NCCL_DEBUG
  value: INFO
- name: NCCL_DEBUG_SUBSYS
  value: NET,INIT,GRAPH,NVLS
- name: NCCL_SOCKET_IFNAME
  value: eth0
- name: NCCL_IB_TIMEOUT
  value: "19"
- name: NCCL_P2P_NET_CHUNKSIZE
  value: "2097152"
- name: NCCL_CUMEM_ENABLE
  value: "1"
- name: NCCL_NET_GDR_C2C
  value: "1"
- name: NCCL_MNNVL_ENABLE
  value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
