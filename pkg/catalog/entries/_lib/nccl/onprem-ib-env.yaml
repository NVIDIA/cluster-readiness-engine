# Portable InfiniBand NCCL environment for generic on-prem GB200/GB300 NVL72
# deployments (ADR-075). Carries the GB200/GB300 base vars (this fragment
# replaces gb200-env.yaml under lists-replace semantics) plus the
# fabric-portable subset of the Mistral IB set. NCCL_IB_HCA and
# UCX_NET_DEVICES are deliberately omitted: HCA names are per-site facts and
# NCCL auto-detects HCAs when they are unpinned.

- name: NCCL_DEBUG
  value: INFO
- name: NCCL_NVLS_ENABLE
  value: "1"
- name: NCCL_CUMEM_ENABLE
  value: "1"
- name: NCCL_P2P_NET_CHUNKSIZE
  value: "2097152"
- name: NCCL_MNNVL_ENABLE
  value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
- name: NCCL_IB_PCI_RELAXED_ORDERING
  value: "1"
- name: SHARP_COLL_ENABLE_PCI_RELAXED_ORDERING
  value: "1"
- name: OMPI_MCA_btl_openib_warn_default_gid_prefix
  value: "0"
- name: PMIX_MCA_gds
  value: "^ds12"
