# OCI GB300 RoCE mpirun args. Mirrors aws-gb300-roce-mpirun-args.yaml with
# OCI-specific MCA flags. Forces MPI to use TCP for point-to-point transport
# (NCCL handles RDMA directly on OCI GB300; MPI only needs TCP for coordination).
# UCC/HCollective disabled via mpi-disable-ucc-hcoll-args.yaml (see the SIGSEGV
# mechanism documented there).
- -N
- "{{ .GpusPerNode }}"
- --allow-run-as-root
- --mca
- plm_rsh_args
- -o StrictHostKeyChecking=no
{{ lib "nccl/roce-tcp-mpi-transport-args.yaml" . }}
{{ lib "nccl/mpi-disable-ucc-hcoll-args.yaml" . }}
