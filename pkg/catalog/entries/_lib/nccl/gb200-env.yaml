# The shared GB200/GB300 base, composed by the on-prem, OCI GB200 and Azure
# GB200 arms: NCCL_DEBUG plus the NVLink tuning.
#
# An arm that already sets NCCL_DEBUG from a platform profile should compose
# nccl/gb200-tuning-env.yaml instead, so the name is not forwarded twice
# (ADR-100).
#
# NCCL_NVLS_ENABLE is deliberately omitted. It predates any record of being
# measured on this hardware, and NVL72 trays report multicast support through
# the same device attribute everything else does, so NCCL's default decides
# correctly without being told. See BaseNCCLEnvVars in pkg/platform/nccl.go
# for why 1 is the wrong value to assert (#514).

- name: NCCL_DEBUG
  value: INFO
{{ lib "nccl/gb200-tuning-env.yaml" . }}
