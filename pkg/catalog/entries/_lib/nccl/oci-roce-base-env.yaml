# The OCI RoCE settings that hold on every OCI board: the ones GB300 does not
# retune. A profile defined by subtraction, which the name cannot say.
#
# nccl/oci-roce-env.yaml is this plus NCCL_IB_GID_INDEX and
# NCCL_IB_SPLIT_DATA_ON_QPS, and is what an arm wants unless it composes
# nccl/oci-gb300-roce-env.yaml, which carries its own values for both. The
# split exists so neither name is ever forwarded twice (ADR-100): mpirun takes
# the last -x for a name, so two fragments with an opinion about one variable
# resolve by splice order, and that order was a comment rather than a check.
- name: NCCL_DEBUG
  value: INFO
- name: NCCL_IB_PCI_RELAXED_ORDERING
  value: "1"
- name: NCCL_IB_TC
  value: "41"
- name: NCCL_IB_SL
  value: "0"
- name: NCCL_IB_QPS_PER_CONNECTION
  value: "4"
- name: NCCL_SOCKET_IFNAME
  value: eth0
- name: OMPI_MCA_coll_hcoll_enable
  value: "0"
- name: OMPI_MCA_orte_keep_fqdn_hostnames
  value: t
