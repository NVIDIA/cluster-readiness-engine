# Portable InfiniBand NCCL environment for Nscale NKS on the DRA stack
# (ADR-085). NKS nodes are IB-connected (ConnectX-7, ipoib), not the RoCE
# bond fabric the legacy rdmashare integration tuned for. The DRA claim
# injects only the HCAs it actually claims, so — following ADR-075's
# on-prem GB200/GB300 precedent — NCCL_IB_HCA and UCX_NET_DEVICES are
# deliberately omitted: HCA names are a per-fleet fact and NCCL auto-detects
# HCAs when they are unpinned.
#
# NCCL_SOCKET_IFNAME pins bootstrap to the pod network: NCCL prefers ib*
# netdevs, and on B200 nodes those are up with only an IPv6 link-local
# address (no IPoIB), so cross-node bootstrap times out.
#
# NCCL_NET is deliberately unset: pinning it to IB selects NCCL's built-in
# transport over the HPC-X plugin, which disables SHARP (CollNet).

- name: NCCL_SOCKET_IFNAME
  value: eth0
- name: NCCL_DEBUG
  value: INFO
- name: NCCL_NVLS_ENABLE
  value: "1"
- name: NCCL_CUMEM_ENABLE
  value: "1"
- name: NCCL_P2P_NET_CHUNKSIZE
  value: "2097152"
- name: NCCL_MNNVL_ENABLE
  value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
- name: NCCL_IB_PCI_RELAXED_ORDERING
  value: "1"
- name: SHARP_COLL_ENABLE_PCI_RELAXED_ORDERING
  value: "1"
- name: OMPI_MCA_btl_openib_warn_default_gid_prefix
  value: "0"
- name: PMIX_MCA_gds
  value: "^ds12"
