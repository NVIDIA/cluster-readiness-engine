# Per-node hardware defaults for known GPU architectures.
# Loaded at init time by pkg/catalog/gpu_defaults.go.
#
# - defaults: keyed by GPU architecture string (as returned by gpu.ParseProduct).
#   gpusPerNode: GPU count per node.
#   mlnxPerNode: Mellanox NIC count per node (used by IB/RoCE platforms). 0 means
#                "do not set nvidia.com/mlnxnics": every fragment under
#                _lib/deps/ that templates the resource guards it on a positive
#                count, so at 0 it renders neither the resource nor the network
#                attachment annotation. See ADR-087.
#                Also sizes the Nscale rdma.nscale.com DRA claim (omitted at 0).
#
# - platformOverrides: keyed by platform name then GPU architecture. Fields set
#   here override the architecture defaults when a node's detected platform
#   matches. Unspecified fields fall through to the architecture defaults; an
#   explicit 0 overrides, so a platform can drop an architecture's NIC request.
#
# Unknown architectures resolve to {gpusPerNode: 4, mlnxPerNode: 0} via the
# Go-side default — see GPUDefaults().

defaults:
  h100:
    gpusPerNode: 8
    mlnxPerNode: 8
  a100:
    gpusPerNode: 8
    mlnxPerNode: 8
  l40s:
    gpusPerNode: 8
    mlnxPerNode: 8
  l40:
    gpusPerNode: 8
    mlnxPerNode: 4
  b200:
    gpusPerNode: 8
    mlnxPerNode: 8
  h200:
    gpusPerNode: 8
    mlnxPerNode: 8
  gb200:
    gpusPerNode: 4
    mlnxPerNode: 8
  gb300:
    gpusPerNode: 4
    mlnxPerNode: 8
  rtxpro6000:
    # G4 supports multiple sizes. Eight GPUs is the largest node shape;
    # smaller nodes must set gpusPerNode in the Certification.
    gpusPerNode: 8
    mlnxPerNode: 0

platformOverrides:
  oci:
    l40s:
      gpusPerNode: 4
      mlnxPerNode: 2
    gb200:
      gpusPerNode: 4
      # No NIC request by default: OCI GB200 shapes do not consistently expose
      # nvidia.com/mlnxnics, and the sriov-net NetworkAttachmentDefinition the
      # annotation references is not present on a stock cluster. Sites running
      # the SR-IOV device plugin opt in with mlnxPerNode. See ADR-087.
      mlnxPerNode: 0
    gb300:
      gpusPerNode: 4
      mlnxPerNode: 4
  nscale:
    gb300:
      mlnxPerNode: 4
