# GCP H100 NCCL tests need a workload image whose CUDA major matches the TCPXO
# NCCL plugin. GKE's nccl-tcpxo-installer puts that plugin on the node (mounted
# at /usr/local/nvidia by gcp-h100-tcpxo-runtime-patch.yaml) and it loads the
# CUDA runtime from the workload image rather than bundling one, so a mismatch
# fails with "Error loading libnccl-net_internal.so: libcudart.so.<major>".
# The image follows the plugin version the controller detects on the target
# nodes (pkg/catalog/tcpxo.go): pytorch:25.06-py3 (CUDA 12, the last CUDA 12
# NGC PyTorch release) for v1.0.16 and earlier, the entries' CUDA 13 base
# image for v1.0.17. Undetected, it renders the CUDA 12 image. This pins the
# worker, the launcher, and the launcher's fix-ssh-permissions init so every
# MPI process runs one image; the override sets trainer.image to match.
# tcpxo-daemon keeps its own image. Single-node entries use
# gcp-h100-nccl-image-patch-loopback.yaml, which has no launcher to pin.
#
# To override the image, set categories[].options.image on the NCCL
# categories. A top-level spec.image applies to every category in the
# Certification, including ones such as diagnostics/dcgm-level4 whose command
# is not in a PyTorch image. See docs/concepts/platform-detection.md,
# "GCP H100 clusters".
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: launcher
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    image: {{ .GCPH100NCCLImage }}
                  initContainers:
                  - name: fix-ssh-permissions
                    image: {{ .GCPH100NCCLImage }}
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    image: {{ .GCPH100NCCLImage }}
