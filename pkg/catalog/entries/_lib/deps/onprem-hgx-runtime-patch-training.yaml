# TrainingRuntime patch for generic on-prem x86 HGX (B200/B300) training
# entries and WorkloadRuns (ADR-094). Tolerates the GPU taint and injects the
# NIC resource block only when nicResourceName is configured (set or
# auto-detected) and mlnxPerNode is positive (0 is the ADR-087 opt-out); the
# resource name depends on the RDMA device plugin the site runs, so there is
# no safe default. The per-container count comes from
# mlnxPerNode. Deliberately carries no NCCL environment and no arm64
# toleration: those belong to the NVL72 fragment
# (onprem-gb200-gb300-runtime-patch-training.yaml), not to an x86 chassis.

- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
{{- if and .NicResourceName (gt (int .MlnxPerNode) 0) }}
                  containers:
                  - name: node
                    resources:
                      limits:
                        {{ .NicResourceName }}: "{{ .MlnxPerNode }}"
                      requests:
                        {{ .NicResourceName }}: "{{ .MlnxPerNode }}"
{{- end }}
                  tolerations:
                  - key: nvidia.com/gpu
                    operator: Equal
                    value: present
                    effect: NoSchedule
