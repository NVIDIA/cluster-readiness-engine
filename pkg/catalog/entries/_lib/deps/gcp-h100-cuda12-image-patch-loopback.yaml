# The single-node counterpart of gcp-h100-cuda12-image-patch-comm.yaml: pins the
# CUDA 12 workload image on the only replicated job. Even single-node, the TCPXO
# patch and FastRak env make NCCL load GKE's host-installed TCPXO plugin, which
# links libcudart.so.12. A launcher entry must not appear here: replicated jobs
# merge by name, so it would be appended to a runtime that has no launcher.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    image: nvcr.io/nvidia/pytorch:25.06-py3
