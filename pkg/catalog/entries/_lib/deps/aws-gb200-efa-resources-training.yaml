- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
                    resources:
                      limits:
                        vpc.amazonaws.com/efa: 4
                        hugepages-2Mi: 10256Mi
                      requests:
                        vpc.amazonaws.com/efa: 4
                        hugepages-2Mi: 10256Mi
