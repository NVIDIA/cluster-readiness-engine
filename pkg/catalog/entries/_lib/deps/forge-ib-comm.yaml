- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    mlPolicy:
      mpi:
        numProcPerNode: {{ .GpusPerNode }}
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
