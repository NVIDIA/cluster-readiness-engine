# The NIC resource name is nicResourceName when set, else nvidia.com/mlnxnics,
# the name the Mellanox host-device plugin advertises; the name is not
# auto-detected on this platform (issue #583).
#
# Only the two NIC request lines are gated on mlnxPerNode. limits and
# requests also carry nvidia.com/gpu, so the parent keys must survive at 0: an
# empty resources block unmarshals to nil, and the override merge deletes
# nil-valued keys, which would drop the GPU request too. See ADR-087.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    mlPolicy:
      mpi:
        numProcPerNode: {{ .GpusPerNode }}
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
{{- if gt (int .MlnxPerNode) 0 }}
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
{{- end }}
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
{{- if gt (int .MlnxPerNode) 0 }}
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
{{- end }}
