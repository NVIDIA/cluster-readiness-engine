# GCP H100 NCCL tests need a CUDA 12 workload image. The TCPXO NCCL plugin that
# GKE's nccl-tcpxo-installer puts on the node (mounted at /usr/local/nvidia by
# gcp-h100-tcpxo-runtime-patch.yaml) links libcudart.so.12, so it cannot load
# in the CUDA 13 base image (pytorch:26.01-py3): NCCL fails with "Error loading
# libnccl-net_internal.so: libcudart.so.12". pytorch:25.06-py3 is the last
# CUDA 12 NGC PyTorch release (CUDA 12.9.1, OpenMPI 4.1.7) and ships the
# *_perf_mpi binaries. This pins the worker, the launcher, and the launcher's
# fix-ssh-permissions init so every MPI process runs one image; the override
# sets trainer.image to match. tcpxo-daemon keeps its GCP-provided image.
# Single-node entries use gcp-h100-cuda12-image-patch-loopback.yaml, which has
# no launcher to pin.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: launcher
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    image: nvcr.io/nvidia/pytorch:25.06-py3
                  initContainers:
                  - name: fix-ssh-permissions
                    image: nvcr.io/nvidia/pytorch:25.06-py3
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    image: nvcr.io/nvidia/pytorch:25.06-py3
