# The NIC resource name is nicResourceName when set, else nvidia.com/mlnxnics,
# the name the Mellanox host-device plugin advertises. Sites whose device plugin
# advertises another name (the Network Operator's shared RDMA plugin advertises
# rdma/hca_shared_devices_a) set nicResourceName (issue #583). Azure does not
# auto-detect the name; that runs only on the on-prem overrides (ADR-075).
#
# The NIC request is the only entry under limits and requests, so the
# resources key itself is gated on mlnxPerNode: leaving it behind childless
# would unmarshal to nil, and the override merge deletes nil-valued keys. The
# securityContext, the volume mounts and the topology ConfigMap are outside the
# guard and are emitted at any count. See ADR-087.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
{{- if gt (int .MlnxPerNode) 0 }}
                    resources:
                      limits:
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
                      requests:
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
{{- end }}
                    volumeMounts:
                    - mountPath: /etc/nccl
                      name: nccl-topo
                  volumes:
                  - configMap:
                      name: {{ .EntryName }}-azure-h100-topo
                    name: nccl-topo
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: {{ .EntryName }}-azure-h100-topo
  data:
    topo.xml: |
{{ lib "topo/azure-h100.xml" . | indent 6 }}
