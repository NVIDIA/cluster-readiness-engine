- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
                    resources:
                      limits:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                    volumeMounts:
                    - mountPath: /etc/nccl
                      name: nccl-topo
                  volumes:
                  - configMap:
                      name: {{ .EntryName }}-azure-h100-topo
                    name: nccl-topo
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: {{ .EntryName }}-azure-h100-topo
  data:
    topo.xml: |
{{ lib "topo/azure-h100.xml" . | indent 6 }}
