# nvidia.com/mlnxnics is the only entry under limits and requests, so the
# resources key itself is gated on mlnxPerNode: leaving it behind childless
# would unmarshal to nil, and the override merge deletes nil-valued keys. The
# securityContext, the volume mounts and the topology ConfigMap are outside the
# guard and are emitted at any count. See ADR-087.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
{{- if gt (int .MlnxPerNode) 0 }}
                    resources:
                      limits:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
{{- end }}
                    volumeMounts:
                    - mountPath: /etc/nccl
                      name: nccl-topo
                  volumes:
                  - configMap:
                      name: {{ .EntryName }}-azure-a100-topo
                    name: nccl-topo
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: {{ .EntryName }}-azure-a100-topo
  data:
    topo.xml: |
{{ lib "topo/azure-a100-sxm4.xml" . | indent 6 }}
