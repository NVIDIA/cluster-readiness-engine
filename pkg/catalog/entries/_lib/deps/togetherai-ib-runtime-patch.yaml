# The NIC resource name is nicResourceName when set, else nvidia.com/mlnxnics,
# the name the Mellanox host-device plugin advertises; the name is not
# auto-detected on this platform (issue #583).
#
# The whole document is gated on mlnxPerNode because the runtime patch exists
# only to add the NIC request: at 0 it renders empty and the call site's
# "dependencies:" key resolves to an empty list. See ADR-087.
{{- if gt (int .MlnxPerNode) 0 }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
                      requests:
                        {{ or .NicResourceName "nvidia.com/mlnxnics" }}: "{{ .MlnxPerNode }}"
{{- end }}
