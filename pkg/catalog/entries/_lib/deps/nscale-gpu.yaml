# GPU-only DRA claim for Nscale NKS (ADR-085), for entries that use no NIC.
# diagnostics/dcgm-level4 runs hostNetwork, so an rdma.nscale.com (dra.net)
# claim would have no pod network namespace to move a netdev into, and
# level-4 diagnostics (including nvbandwidth) are intra-node.
# communication/nccl-loopback-nvswitch exercises NVLink only, so claiming the
# rail NICs would block concurrent NIC users for no benefit.
# Unlike nscale-gpu-rdma.yaml this fragment sets no tolerations: the base
# entry's tolerate-everything toleration (operator: Exists) already covers
# the arm64 and GPU taints, and an unnamed toleration list here would replace
# it rather than merge.

- apiVersion: resource.k8s.io/v1
  kind: ResourceClaimTemplate
  metadata:
    name: {{ .EntryName }}-gpu
    labels:
      app: {{ .EntryName }}
  spec:
    spec:
      devices:
        requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            count: {{ .GpusPerNode }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  resourceClaims:
                  - name: gpu
                    resourceClaimTemplateName: {{ .EntryName }}-gpu
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/gpu: null
                      requests:
                        nvidia.com/gpu: null
                      claims:
                      - name: gpu
