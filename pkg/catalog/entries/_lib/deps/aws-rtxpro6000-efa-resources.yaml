# The g7e's four EFA devices are independent of the global RTX GPU defaults.
# This patch also serves caller-supplied WorkloadRun images.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        vpc.amazonaws.com/efa: "4"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        vpc.amazonaws.com/efa: "4"
