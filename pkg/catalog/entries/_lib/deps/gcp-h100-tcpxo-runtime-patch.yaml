- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    devices.gke.io/container.tcpxo-daemon: |
                      - path: /dev/nvidia0
                      - path: /dev/nvidia1
                      - path: /dev/nvidia2
                      - path: /dev/nvidia3
                      - path: /dev/nvidia4
                      - path: /dev/nvidia5
                      - path: /dev/nvidia6
                      - path: /dev/nvidia7
                      - path: /dev/nvidiactl
                      - path: /dev/nvidia-uvm
                      - path: /dev/dmabuf_import_helper
                    networking.gke.io/default-interface: eth0
                    networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"eth1","network":"gpu-nic0"},{"interfaceName":"eth2","network":"gpu-nic1"},{"interfaceName":"eth3","network":"gpu-nic2"},{"interfaceName":"eth4","network":"gpu-nic3"},{"interfaceName":"eth5","network":"gpu-nic4"},{"interfaceName":"eth6","network":"gpu-nic5"},{"interfaceName":"eth7","network":"gpu-nic6"},{"interfaceName":"eth8","network":"gpu-nic7"}]'
                spec:
                  containers:
                  - name: node
                    volumeMounts:
                    - name: nvtcpxo-libraries
                      mountPath: /usr/local/nvidia
                      readOnly: true
                    - name: nvtcpxo-aperture-devices
                      mountPath: /dev/aperture_devices
                  initContainers:
                  - name: tcpxo-daemon
                    image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/tcpgpudmarxd-dev:v1.0.8
                    imagePullPolicy: Always
                    restartPolicy: Always
                    command: ["/bin/sh", "-c"]
                    args:
                    - |
                      set -ex
                      chmod 755 /fts/entrypoint_rxdm_container.sh
                      /fts/entrypoint_rxdm_container.sh --num_hops=2 --num_nics=8 --uid= --alsologtostderr --enforce_kernel_ipv6_support=false
                    securityContext:
                      capabilities:
                        add: ["CAP_NET_ADMIN", "CAP_NET_BIND_SERVICE"]
                    volumeMounts:
                    - name: nvtcpxo-libraries
                      mountPath: /usr/local/nvidia
                      readOnly: true
                    - name: nvtcpxo-sys
                      mountPath: /hostsysfs
                      readOnly: true
                    # /hostprocsysfs is mounted read-write because the RxDM daemon
                    # writes kernel network sysctls at startup to tune GPUDirect TCPxo
                    # throughput. Specifically it sets:
                    #   net.core.rmem_max, net.core.wmem_max          (socket buffer limits)
                    #   net.ipv4.tcp_rmem, net.ipv4.tcp_wmem          (per-socket TCP buffers)
                    #   net.core.netdev_max_backlog                    (NIC receive queue depth)
                    # These are written once during init and are required for correct
                    # GPUDirect TCPX operation; they cannot be applied via a privileged
                    # initContainer without the /proc/sys bind-mount.
                    - name: nvtcpxo-proc-sys
                      mountPath: /hostprocsysfs
                    env:
                    - name: LD_LIBRARY_PATH
                      value: "/usr/local/nvidia/lib64"
                  volumes:
                  - name: nvtcpxo-libraries
                    hostPath:
                      path: /home/kubernetes/bin/nvidia
                  - name: nvtcpxo-sys
                    hostPath:
                      path: /sys
                  - name: nvtcpxo-proc-sys
                    hostPath:
                      path: /proc/sys
                  - name: nvtcpxo-aperture-devices
                    hostPath:
                      path: /dev/aperture_devices
                  tolerations:
                  - key: nvidia.com/gpu
                    operator: Equal
                    value: present
                    effect: NoSchedule
