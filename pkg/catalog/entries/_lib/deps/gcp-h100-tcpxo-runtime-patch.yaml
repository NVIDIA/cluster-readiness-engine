- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    devices.gke.io/container.tcpxo-daemon: |
                      - path: /dev/nvidia0
                      - path: /dev/nvidia1
                      - path: /dev/nvidia2
                      - path: /dev/nvidia3
                      - path: /dev/nvidia4
                      - path: /dev/nvidia5
                      - path: /dev/nvidia6
                      - path: /dev/nvidia7
                      - path: /dev/nvidiactl
                      - path: /dev/nvidia-uvm
                      - path: /dev/dmabuf_import_helper
                    networking.gke.io/default-interface: eth0
                    networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"}{{ range $i, $n := .GKETCPXONetworks }},{"interfaceName":"eth{{ add $i 1 }}","network":"{{ $n }}"}{{ end }}]'
                spec:
                  containers:
                  - name: node
                    volumeMounts:
                    - name: nvtcpxo-libraries
                      mountPath: /usr/local/nvidia
                      readOnly: true
                    - name: nvtcpxo-aperture-devices
                      mountPath: /dev/aperture_devices
                  initContainers:
                  - name: tcpxo-daemon
                    image: {{ .TCPXODaemonImage }}
                    imagePullPolicy: Always
                    restartPolicy: Always
                    command: ["/bin/sh", "-c"]
                    args:
                    - |
                      set -ex
                      chmod 755 /fts/entrypoint_rxdm_container.sh
                      /fts/entrypoint_rxdm_container.sh {{ .TCPXODaemonArgs }}
                    # Kubernetes capability names carry no CAP_ prefix:
                    # containerd silently drops "CAP_NET_ADMIN". Daemon
                    # v1.0.21 and later tune the GPU NICs with ethtool at
                    # start and exit on the resulting EPERM without it.
                    securityContext:
                      capabilities:
                        add: ["NET_ADMIN", "NET_BIND_SERVICE"]
                    volumeMounts:
                    - name: nvtcpxo-libraries
                      mountPath: /usr/local/nvidia
                      readOnly: true
                    - name: nvtcpxo-sys
                      mountPath: /hostsysfs
                    - name: nvtcpxo-proc-sys
                      mountPath: /hostprocsysfs
                    env:
                    - name: LD_LIBRARY_PATH
                      value: "/usr/local/nvidia/lib64"
                  volumes:
                  - name: nvtcpxo-libraries
                    hostPath:
                      path: /home/kubernetes/bin/nvidia
                  - name: nvtcpxo-sys
                    hostPath:
                      path: /sys
                  - name: nvtcpxo-proc-sys
                    hostPath:
                      path: /proc/sys
                  - name: nvtcpxo-aperture-devices
                    hostPath:
                      path: /dev/aperture_devices
                  tolerations:
                  - key: nvidia.com/gpu
                    operator: Equal
                    value: present
                    effect: NoSchedule
