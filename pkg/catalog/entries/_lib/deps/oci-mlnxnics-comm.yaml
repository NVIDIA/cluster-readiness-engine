# Requests SR-IOV NICs and attaches the matching secondary networks. The whole
# document is gated on mlnxPerNode: at 0 it renders empty, so neither the
# resource nor the annotation is emitted and the call site's "dependencies:"
# key resolves to an empty list. The annotation must not outlive the resource:
# attaching sriov-net without requesting nvidia.com/mlnxnics is not a valid
# configuration. See ADR-087.
{{- if gt (int .MlnxPerNode) 0 }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    k8s.v1.cni.cncf.io/networks: {{ repeat (int .MlnxPerNode) "network-operator/sriov-net," | trimSuffix "," }}
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
{{- end }}
