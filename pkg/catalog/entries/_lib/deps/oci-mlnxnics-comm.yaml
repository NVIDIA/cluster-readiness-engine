- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    k8s.v1.cni.cncf.io/networks: {{ repeat (int .MlnxPerNode) "network-operator/sriov-net," | trimSuffix "," }}
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
