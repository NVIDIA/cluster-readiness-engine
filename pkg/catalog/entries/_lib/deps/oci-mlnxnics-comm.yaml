# Requests RDMA NICs and attaches the matching secondary network once per NIC.
# The whole document is gated on mlnxPerNode: at 0 it renders empty, so neither
# the resource nor the annotation is emitted and the call site's "dependencies:"
# key resolves to an empty list. The annotation must not outlive the resource:
# attaching the network without requesting nvidia.com/mlnxnics is not a valid
# configuration. See ADR-087. An explicit networkAttachments list replaces this
# default wiring entirely, resource and annotation together (issue #400), so the
# document is also gated on its absence.
#
# The network is .OCISecondaryNetwork, never a fixed name. The controller
# detects the NetworkAttachmentDefinition annotated
# k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics, and builds with a
# sentinel first so it only looks when this document survives overlay
# application; offline render names network-operator/sriov-net. See ADR-103.
{{- if and (gt (int .MlnxPerNode) 0) (not .HasNetworkAttachments) }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    k8s.v1.cni.cncf.io/networks: {{ repeat (int .MlnxPerNode) (printf "%s," .OCISecondaryNetwork) | trimSuffix "," }}
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
                      requests:
                        nvidia.com/mlnxnics: "{{ .MlnxPerNode }}"
{{- end }}
