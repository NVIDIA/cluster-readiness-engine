# TrainingRuntime patch for GCP GB200/GB300 communication entries: the GKE
# RDMA network resources plus the arm64 taint toleration.
# Carries no mlPolicy: the MPI entries' base runtimes already set
# mlPolicy.mpi.numProcPerNode, and the per-node loopback entries use
# mlPolicy.torch, which a merged mlPolicy.mpi collides with (the
# TrainingRuntime CRD allows exactly one policy; ADR-092). Tolerations have
# no merge key, so the list below replaces the base list; the loopback entries
# append tolerate-all-runtime-patch.yaml after this fragment to restore theirs.

- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            metadata:
              annotations:
                networking.gke.io/default-interface: "eth0"
                networking.gke.io/interfaces: |
                  [
                    {"interfaceName":"eth0","network":"default"},
                    {"interfaceName":"rdma0","network":"rdma-0"},
                    {"interfaceName":"rdma1","network":"rdma-1"},
                    {"interfaceName":"rdma2","network":"rdma-2"},
                    {"interfaceName":"rdma3","network":"rdma-3"}
                  ]
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        networking.gke.io.networks/rdma-0: "1"
                        networking.gke.io.networks/rdma-1: "1"
                        networking.gke.io.networks/rdma-2: "1"
                        networking.gke.io.networks/rdma-3: "1"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        networking.gke.io.networks/rdma-0: "1"
                        networking.gke.io.networks/rdma-1: "1"
                        networking.gke.io.networks/rdma-2: "1"
                        networking.gke.io.networks/rdma-3: "1"
                  tolerations:
                  - key: kubernetes.io/arch
                    operator: Equal
                    value: arm64
                    effect: NoSchedule
                  - key: nvidia.com/gpu
                    operator: Equal
                    value: present
                    effect: NoSchedule
