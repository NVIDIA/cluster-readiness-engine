            - uint8
{{ lib "nccl/nccl-perf-args.yaml" . | indent 12 }}
# --- Forge + L40 (InfiniBand; no topo file, no NVLink/NVSwitch) ---
# Forge does not ship a topology XML and L40 has no NVLink/NVSwitch,
# so this block uses a stripped-down env-var baseline and a mlnxnics-only dependency
