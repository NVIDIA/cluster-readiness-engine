{{ lib "deps/gb300-roce-comm.yaml" . | indent 2 }}
# --- AWS + GB300 (RoCE) ---
# Uses nccl-tests image (sshd pre-installed) with OpenMPI at /opt/amazon/openmpi.
# Removes EFA/OFI plugins that segfault on RoCE, keeps OpenMPI for orted.
# MCA transport explicitly set to TCP on eth0 for RoCE connectivity.
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  dependencies:
{{ lib "deps/gb300-roce-comm.yaml" . | indent 2 }}
{{ lib "deps/aws-gb300-roce-runtime-patch-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            image: public.ecr.aws/hpc-cloud/nccl-tests:latest
            command:
{{ lib "nccl/aws-gb300-roce-command.yaml" . | indent 12 }}
            args:
{{ lib "nccl/aws-gb300-roce-mpirun-args.yaml" . | indent 12 }}
{{ lib "nccl/aws-gb300-roce-env.yaml" . | toMpiArgs | indent 12 }}
            - /opt/nccl-tests/build/alltoall_perf
            - -d
            - uint8
{{ lib "nccl/nccl-perf-args.yaml" . | indent 12 }}
# --- OCI + GB300 (RoCE) ---
# Must come AFTER the GB200/GB300 base block and AWS+GB300 so this override's
# trainer.args (atomic replacement) wins. Adds SR-IOV NIC resources via
# oci-mlnxnics-comm.yaml and sets OCI-specific GID index + MNNVL env vars.
# trainer.env carries UCX_IB_GID_INDEX for the MPI launcher (rank 0), which
# initializes UCX from its container env, not from mpirun -x args.
- when:
    platform:
      equals: oci
    gpuArchitecture:
      equals: gb300
  dependencies:
{{ lib "deps/oci-mlnxnics-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/oci-gb300-roce-env.yaml" . | indent 12 }}
            args:
{{ lib "nccl/oci-roce-mpirun-args.yaml" . | indent 12 }}
{{ lib "nccl/oci-roce-env.yaml" . | toMpiArgs | indent 12 }}
{{ lib "nccl/oci-gb300-roce-env.yaml" . | toMpiArgs | indent 12 }}
            - /usr/local/bin/alltoall_perf_mpi
            - -d
            - uint8
{{ lib "nccl/nccl-perf-args.yaml" . | indent 12 }}
# --- Mistral + GB300 (InfiniBand) ---
- when:
    platform:
      equals: mistral
    gpuArchitecture:
      equals: gb300
