dependencies:
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    labels:
      app: nccl-alltoall
      trainer.kubeflow.org/framework: mpi
    name: nccl-alltoall-runtime
  spec:
    mlPolicy:
      mpi:
        mpiImplementation: OpenMPI
        numProcPerNode: {{ .GpusPerNode }}
        sshAuthMountPath: /tmp/mpi-ssh-raw
      numNodes: 1
    template:
      spec:
        network:
          publishNotReadyAddresses: true
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - args:
                    - |-
                      set -x &&
                      apt-get update &&
                      apt-get install -y --no-install-recommends openssh-server  &&
                      mkdir -p /var/run/sshd  &&
                      chmod 0755 /var/run/sshd  &&
                      mkdir -p /root/.ssh &&
                      chmod 700 /root/.ssh &&
                      cp /tmp/mpi-ssh-raw/* /root/.ssh/ &&
                      chmod 600 /root/.ssh/id_rsa &&
                      chmod 644 /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys &&
                      /usr/sbin/sshd -De
                    command:
                    - sh
                    - -c
                    image: nvcr.io/nvidia/pytorch:26.01-py3
                    name: node
                    readinessProbe:
                      initialDelaySeconds: 5
                      tcpSocket:
                        port: 22
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
                    volumeMounts:
                    - mountPath: /tmp/mpi-ssh-raw
                      name: mpi-ssh-auth
                      readOnly: true
                  restartPolicy: OnFailure
        - name: launcher
          dependsOn:
          - name: node
            status: Ready
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  containers:
                  - image: nvcr.io/nvidia/pytorch:26.01-py3
                    name: node
                    resources:
                      limits:
                        cpu: "2"
                        memory: 1Gi
                    volumeMounts:
                    - mountPath: /tmp/mpi-ssh-raw
                      name: mpi-ssh-auth
                      readOnly: true
                    - mountPath: /root/.ssh
                      name: ssh-keys
                  initContainers:
                  - args:
                    - |-
                      set -x &&
                      cp /tmp/mpi-ssh-raw/* /root/.ssh/ &&
                      chmod 600 /root/.ssh/id_rsa &&
                      chmod 644 /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys
                    command:
                    - sh
                    - -c
                    image: nvcr.io/nvidia/pytorch:26.01-py3
                    name: fix-ssh-permissions
                    volumeMounts:
                    - mountPath: /tmp/mpi-ssh-raw
                      name: mpi-ssh-auth
                      readOnly: true
                    - mountPath: /root/.ssh
                      name: ssh-keys
                  restartPolicy: OnFailure
                  volumes:
                  - emptyDir: {}
                    name: ssh-keys
        successPolicy:
          operator: All
          targetReplicatedJobs:
          - launcher
jobTemplate:
  spec:
    bandwidthMeasurement:
      logProfileRef: nccl-bandwidth
      sampleInterval: 30s
      testType: alltoall
    nodeHealthMonitor:
      cel:
        expression: node.spec.unschedulable == true
    workload:
      trainJob:
        runtimePatches:
        - manager: cre.nvidia.com/catalog
          trainingRuntimeSpec:
            template:
              spec:
                replicatedJobs:
                - name: node
                  template:
                    spec:
                      template:
                        spec:
                          containers:
                          - name: node
                            volumeMounts:
                            - mountPath: /dev/shm
                              name: dshm
                          volumes:
                          - emptyDir:
                              medium: Memory
                            name: dshm
                - name: launcher
        runtimeRef:
          kind: TrainingRuntime
          name: nccl-alltoall-runtime
        trainer:
          args:
{{ lib "nccl/mpi-leading-args.yaml" . | indent 10 }}
          - -x
          - NCCL_DEBUG=INFO
          - -x
          - NCCL_MNNVL_ENABLE={{ if .EnableMNNVL }}1{{ else }}0{{ end }}
          - /usr/local/bin/alltoall_perf_mpi
          - -d
          - uint8
{{ lib "nccl/nccl-perf-args.yaml" . | indent 10 }}
          command:
          - timeout
          - "3600"
          - /usr/local/mpi/bin/mpirun
          image: nvcr.io/nvidia/pytorch:26.01-py3
          numNodes: {{ .NodesPerJob }}
          numProcPerNode: {{ .GpusPerNode }}
orchestration:
{{- if eq .TestScale "intra-node" }}
  execution: {}
{{- else if eq .TestScale "intra-rack" }}
  topology:
    topologyKey: nvidia.com/gpu.clique
    strictDomain: true
{{- else if eq .TestScale "diagnose" }}
  diagnose:
    minGroupSize: {{ .MinGroupSize }}
    topologyKey: nvidia.com/gpu.clique
{{- end }}
{{- if gt .MaxConcurrent 0 }}
  execution:
    maxConcurrent: {{ .MaxConcurrent }}
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- else }}
  execution:
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- end }}
  iterations: 1
{{- if .Thresholds }}
validation:
  performance:
    enabled: true
{{- if .MeasurementTimeout }}
    measurementTimeout: {{ .MeasurementTimeout }}
{{- end }}
    thresholds:
      thresholds:
{{- range $k, $v := .Thresholds }}
        {{ $k }}: "{{ $v }}"
{{- end }}
{{- end }}
overrides:
# --- AWS + H100 (EFA) ---
- when:
    platform:
      equals: aws
    gpuArchitecture:
      notIn: [gb200, gb300]
  dependencies:
{{ lib "deps/aws-efa-runtime-patch-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            args:
{{ lib "nccl/mpi-leading-args.yaml" . | indent 12 }}
{{ lib "nccl/aws-h100-efa-env.yaml" . | toMpiArgs | indent 12 }}
            - -x
            - LD_LIBRARY_PATH
            - /opt/nccl-tests/build/alltoall_perf
            - -d
            - uint8
{{ lib "nccl/nccl-perf-args.yaml" . | indent 12 }}
            command:
            - timeout
            - "3600"
            - /opt/amazon/openmpi/bin/mpirun
            image: public.ecr.aws/hpc-cloud/nccl-tests:cuda12.8.1-efa1.43.2-ofiv1.16.3-ncclv2.27.7-1-testsv2.16.9
            numNodes: {{ .NodesPerJob }}
            numProcPerNode: {{ .GpusPerNode }}
# --- GCP + H100 (FastRak/TCPXO) ---
