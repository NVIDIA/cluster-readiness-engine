dependencies:
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    labels:
      app: nccl-loopback-nvswitch
    name: nccl-loopback-nvswitch-runtime
  spec:
    mlPolicy:
      numNodes: 1
      torch:
        numProcPerNode: 1
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  containers:
                  - image: nvcr.io/nvidia/pytorch:26.01-py3
                    name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
                  restartPolicy: OnFailure
                  tolerations:
                  - operator: Exists
jobTemplate:
  spec:
    bandwidthMeasurement:
      logProfileRef: nccl-loopback
      sampleInterval: 30s
      testType: loopback_all_reduce
    nodeHealthMonitor:
      cel:
        expression: node.spec.unschedulable == true
    workload:
      trainJob:
        runtimePatches:
        - manager: cre.nvidia.com/catalog
          trainingRuntimeSpec:
            template:
              spec:
                replicatedJobs:
                - name: node
                  template:
                    spec:
                      template:
                        spec:
                          containers:
                          - name: node
                            volumeMounts:
                            - mountPath: /dev/shm
                              name: dshm
                          volumes:
                          - emptyDir:
                              medium: Memory
                            name: dshm
        runtimeRef:
          kind: TrainingRuntime
          name: nccl-loopback-nvswitch-runtime
        trainer:
          args:
          - -b
          - "8"
          - -e
          - {{ .MaxBytes }}
          - -f
          - "2"
          - -g
          - "{{ .GpusPerNode }}"
          - -n
          - "{{ .NumIterations }}"
          - -N
          - "{{ .NumCycles }}"
          command:
          - /usr/local/bin/all_reduce_perf_mpi
          env:
          - name: NCCL_DEBUG
            value: INFO
          - name: NCCL_MNNVL_ENABLE
            value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
          image: nvcr.io/nvidia/pytorch:26.01-py3
          numNodes: 1
          numProcPerNode: 1
orchestration:
{{- if gt .MaxConcurrent 0 }}
  execution:
    maxConcurrent: {{ .MaxConcurrent }}
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- else }}
  execution:
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- end }}
  iterations: 1
{{- if .Thresholds }}
validation:
  performance:
    enabled: true
{{- if .MeasurementTimeout }}
    measurementTimeout: {{ .MeasurementTimeout }}
{{- end }}
    thresholds:
      thresholds:
{{- range $k, $v := .Thresholds }}
        {{ $k }}: "{{ $v }}"
{{- end }}
{{- end }}
overrides:
# --- AWS + H100 (EFA) ---
- when:
    platform:
      equals: aws
    gpuArchitecture:
      notIn: [gb200, gb300]
  dependencies:
{{ lib "deps/aws-efa-runtime-patch-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            image: public.ecr.aws/hpc-cloud/nccl-tests:cuda12.8.1-efa1.43.2-ofiv1.16.3-ncclv2.27.7-1-testsv2.16.9
            command:
            - /opt/nccl-tests/build/all_reduce_perf
            env:
            - name: NCCL_DEBUG
              value: INFO
{{ lib "nccl/aws-h100-efa-comm-env.yaml" . | indent 12 }}
            - name: NCCL_MNNVL_ENABLE
              value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
# --- GCP + H100 (FastRak/TCPXO) ---
- when:
    platform:
      equals: gcp
    gpuArchitecture:
      equals: h100
  dependencies:
{{ lib "deps/gcp-h100-tcpxo-runtime-patch.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/gcp-h100-fastrak-env.yaml" . | indent 12 }}
            - name: NCCL_MNNVL_ENABLE
              value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
# --- Azure (InfiniBand) ---
- when:
