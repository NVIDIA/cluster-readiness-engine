# --- TogetherAI (InfiniBand) ---
- when:
    platform:
      equals: togetherai
  dependencies:
{{ lib "deps/togetherai-ib-runtime-patch.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/togetherai-ib-env.yaml" . | indent 12 }}
            - name: NCCL_MNNVL_ENABLE
              value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
# --- GB200/GB300 (ComputeDomain + DRA) ---
- when:
    gpuArchitecture:
      in: [gb200, gb300]
  dependencies:
{{ lib "deps/gb200-compute-domain-and-dra-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/gb200-env.yaml" . | indent 12 }}
# --- AWS + GB200 (EFA) — must come AFTER GB200/GB300 ComputeDomain ---
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb200
  dependencies:
{{ lib "deps/aws-gb200-efa-runtime-patch-loopback.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            image: public.ecr.aws/hpc-cloud/nccl-tests:cuda12.8.1-efa1.43.2-ofiv1.16.3-ncclv2.27.7-1-testsv2.16.9
            command:
            - /opt/nccl-tests/build/all_reduce_perf
            env:
{{ lib "nccl/aws-gb200-efa-env.yaml" . | indent 12 }}
# --- GCP + GB200/GB300 (RoCE) ---
# jobTemplatePatch appends the GCP-specific GDR-level tuning to the env array
# set by the GB200/GB300 base override, preserving NCCL_NVLS_ENABLE and
# NCCL_CUMEM_ENABLE. NCCL_DEBUG and NCCL_MNNVL_ENABLE are already present
# in the base env (gb200-env.yaml) and need not be repeated.
- when:
    platform:
      equals: gcp
    gpuArchitecture:
      in: [gb200, gb300]
  dependencies:
{{ lib "deps/gcp-gb200-roce-runtime-patch-comm.yaml" . | indent 2 }}
  jobTemplatePatch:
  - op: add
    path: /spec/workload/trainJob/trainer/env/-
    value:
      name: NCCL_NET_GDR_LEVEL
      value: "5"
# --- GB300 (RoCE) ---
# --- AWS + GB300 (RoCE) ---
# jobTemplate sets command/args only (atomic array replacement is fine for these).
# jobTemplatePatch appends NCCL_MAX_BYTES to the env array established by the
# GB200/GB300 base override so that NCCL_NVLS_ENABLE and NCCL_CUMEM_ENABLE
# set by that override are preserved.
- when:
    platform:
      equals: aws
    gpuArchitecture:
      equals: gb300
  dependencies:
{{ lib "deps/gb300-roce-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            command:
            - sh
            - -c
            args:
            - |
              rm -rf /opt/amazon
              unset NCCL_NET_PLUGIN
              unset NCCL_TUNER_PLUGIN
              /usr/local/bin/all_reduce_perf_mpi -b 8 -e "$NCCL_MAX_BYTES" -f 2 -g {{ .GpusPerNode }} -n {{ .NumIterations }} -N {{ .NumCycles }}
  jobTemplatePatch:
  - op: add
    path: /spec/workload/trainJob/trainer/env/-
    value:
      name: NCCL_MAX_BYTES
      value: {{ .MaxBytes }}
# --- Mistral + GB300 (InfiniBand) ---
- when:
    platform:
      equals: mistral
    gpuArchitecture:
      equals: gb300
  dependencies:
{{ lib "deps/mistral-gb300-ib-runtime-patch-comm.yaml" . | indent 2 }}
  jobTemplate:
    spec:
      workload:
        trainJob:
          trainer:
            env:
{{ lib "nccl/mistral-ib-env.yaml" . | indent 12 }}
