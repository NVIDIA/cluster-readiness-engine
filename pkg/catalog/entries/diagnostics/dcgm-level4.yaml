dependencies:
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    labels:
      app: dcgm-level4
    name: dcgm-level4-runtime
  spec:
    mlPolicy:
      numNodes: 1
      torch:
        numProcPerNode: 1
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  containers:
                  - image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
                    name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                    securityContext:
                      privileged: true
                  dnsPolicy: ClusterFirstWithHostNet
                  hostNetwork: true
                  restartPolicy: Never
                  tolerations:
                  - operator: Exists
jobTemplate:
  spec:
    nodeHealthMonitor:
      cel:
        expression: node.spec.unschedulable == true
    workload:
      trainJob:
        runtimeRef:
          kind: TrainingRuntime
          name: dcgm-level4-runtime
        trainer:
          args:
          - diag
          - --host
          - nvidia-dcgm.gpu-operator.svc:5555
          - --run
          - "4"
          - --json
          - --verbose
          - -p
          - targeted_power.test_duration=1200s
          - -p
          - targeted_stress.test_duration=1200s
          - -p
          - nvbandwidth.is_allowed=true
          command:
          - dcgmi
          image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
          numNodes: 1
          numProcPerNode: 1
orchestration:
{{- if gt .MaxConcurrent 0 }}
  execution:
    maxConcurrent: {{ .MaxConcurrent }}
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- else }}
  execution:
    timeoutPerJob: {{ .TimeoutPerJob }}
{{- end }}
  iterations: 1
overrides:
{{ lib "overrides/gb200-topology-key.yaml" . }}
- when:
    gpuArchitecture:
      in: [a100]
# --- OCI (DGXC / CRI-O) ---
# CRI-O rejects privileged containers with device plugin GPU injection
# (device paths already exist on host). Replace privileged with SYS_ADMIN.
- when:
    platform:
      equals: oci
  dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: dcgm-level4-runtime
    spec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    containers:
                    - name: node
                      securityContext:
                        privileged: false
# --- Nscale NKS (GPU DRA claim; ADR-085) ---
# GPU-only claim: the pod is hostNetwork, so a dra.net RDMA claim has no pod
# network namespace to inject into, and level-4 diagnostics are intra-node.
# The fragment sets no tolerations, so the base tolerate-everything toleration
# survives. NKS runs the DRA-flavoured DCGM hostengine as
# nvidia-platform/nvidia-dcgm-dra, not gpu-operator/nvidia-dcgm, so --host is
# repointed; the test op fails the render if the base args ever move.
- when:
    platform:
      equals: nscale
    gpuArchitecture:
      in: [b200, gb300]
  dependencies:
{{ lib "deps/nscale-gpu.yaml" . | indent 2 }}
  jobTemplatePatch:
  - op: test
    path: /spec/workload/trainJob/trainer/args/2
    value: nvidia-dcgm.gpu-operator.svc:5555
  - op: replace
    path: /spec/workload/trainJob/trainer/args/2
    value: nvidia-dcgm-dra.nvidia-platform.svc:5555
# --- Nscale + GB300 topology key (ADR-085) ---
# Nscale runs no GFD, so nvidia.com/gpu.clique from the arch-only block above
# never exists there; the NVLink domain is published as
# topology.nks.nscale.com/accelerator-domain instead.
- when:
    platform:
      equals: nscale
    gpuArchitecture:
      equals: gb300
  orchestration:
    topology:
      topologyKey: topology.nks.nscale.com/accelerator-domain
