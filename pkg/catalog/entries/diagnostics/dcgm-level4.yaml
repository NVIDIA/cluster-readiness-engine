dependencies:
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    labels:
      app: dcgm-level4
    name: dcgm-level4-runtime
  spec:
    mlPolicy:
      numNodes: 1
      torch:
        numProcPerNode: 1
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  containers:
                  - image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
                    name: node
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                    securityContext:
                      capabilities:
                        add: [SYS_ADMIN]
                  restartPolicy: Never
                  tolerations:
                  - operator: Exists
jobTemplate:
  spec:
    nodeHealthMonitor:
      cel:
        expression: node.spec.unschedulable == true
    workload:
      trainJob:
        runtimeRef:
          kind: TrainingRuntime
          name: dcgm-level4-runtime
        trainer:
          args:
          - diag
          - --host
          - nvidia-dcgm.gpu-operator.svc:5555
          - --run
          - "4"
          - --json
          - --verbose
          - -p
          - targeted_power.test_duration=1200s
          - -p
          - targeted_stress.test_duration=1200s
          - -p
          - nvbandwidth.is_allowed=true
          command:
          - dcgmi
          image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
          numNodes: 1
          numProcPerNode: 1
orchestration:
  execution: {}
  iterations: 1
overrides:
{{ lib "overrides/gb200-topology-key.yaml" . }}
- when:
    gpuArchitecture:
      in: [a100]
