# The case every other catalog golden depends on. An unset placement must write
# nothing at all, which is what keeps the existing rendered output byte-identical
# and is why the API field deliberately has no +kubebuilder:default=Pinned: a
# non-empty string default would materialize into every spec on its next write.
#
# If placement ever comes back non-empty here, the guard in loader.go is gone
# and a large number of unrelated goldens are about to move.
category: communication
subcategory: nccl-all-reduce
target:
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
nodesPerJob: 2
gpusPerNode: 8
