apiVersion: "nvcre.nvidia.com/v1alpha1"
kind: "Certification"
metadata:
  name: "cert"
  namespace: "burn-in"
  uid: "cert-uid"
  generation: 1
spec:
  categories:
    - domain: "communication"
      variant: "nccl-all-reduce"
status:
  conditions:
    - type: "Failed"
      status: "True"
      observedGeneration: 1
      reason: "WorkflowFailed"
      message: "A category failed"
      lastTransitionTime: "2026-09-30T10:00:00Z"
  categoryStatuses:
    - domain: "communication"
      variant: "nccl-all-reduce"
      status: "Failed"
      workflowRef:
        name: "wf"
        namespace: "burn-in"
      failedNodesRef:
        kind: "ConfigMap"
        name: "failed-nodes"
---
apiVersion: "nvcre.nvidia.com/v1alpha1"
kind: "Workflow"
metadata:
  name: "wf"
  namespace: "burn-in"
  uid: "wf-uid"
  generation: 1
  ownerReferences:
    - apiVersion: "nvcre.nvidia.com/v1alpha1"
      kind: "Certification"
      name: "cert"
      uid: "cert-uid"
      controller: true
spec:
  orchestration:
    iterations: 1
status:
  conditions:
    - type: "Failed"
      status: "True"
      observedGeneration: 1
      reason: "IterationsFailed"
      message: "One group failed"
      lastTransitionTime: "2026-09-30T10:00:00Z"
  orchestration:
    totalNodes: 2
    nodesPerJob: 2
    totalGroups: 1
    currentIteration: 1
    completedIterations: 1
    detectedPlatform: "onprem"
    detectedGPUArchitecture: "h100"
    groups:
      - name: "group-0"
        phase: "Failed"
        nodes:
          - "node-a"
          - "node-b"
        jobRef:
          name: "job"
          namespace: "burn-in"
        startTime: "2026-09-30T10:00:00Z"
        completionTime: "2026-09-30T10:01:00Z"
  failedNodesRef:
    kind: "ConfigMap"
    name: "failed-nodes"
---
apiVersion: "nvcre.nvidia.com/v1alpha1"
kind: "Job"
metadata:
  name: "job"
  namespace: "burn-in"
  uid: "job-uid"
  generation: 1
  ownerReferences:
    - apiVersion: "nvcre.nvidia.com/v1alpha1"
      kind: "Workflow"
      name: "wf"
      uid: "wf-uid"
      controller: true
  labels:
    nvcre.nvidia.com/workflow: "wf"
    nvcre.nvidia.com/group: "group-0"
  annotations:
    nvcre.nvidia.com/group-nodes: "node-a,node-b"
spec:
  bandwidthMeasurement:
    logProfileRef: "nccl"
status:
  conditions:
    - type: "Failed"
      status: "True"
      observedGeneration: 1
      reason: "WorkloadFailed"
      message: "Workload failed"
      lastTransitionTime: "2026-09-30T10:00:00Z"
  workloadRef:
    kind: "TrainJob"
    name: "trainjob"
---
apiVersion: "nvcre.nvidia.com/v1alpha1"
kind: "BandwidthMeasurement"
metadata:
  name: "bw"
  namespace: "burn-in"
  uid: "bw-uid"
  generation: 1
  ownerReferences:
    - apiVersion: "nvcre.nvidia.com/v1alpha1"
      kind: "Workflow"
      name: "wf"
      uid: "wf-uid"
      controller: true
spec:
  jobRef:
    kind: "Job"
    name: "job"
  logProfileRef: "nccl"
status:
  conditions:
    - type: "Complete"
      status: "True"
      observedGeneration: 1
      reason: "Completed"
      message: "Finished"
      lastTransitionTime: "2026-09-30T10:00:00Z"
  results:
    - sizeBytes: 1048576
      algBW: "100"
      busBW: "90"
      samples: 2
