# Neither source exists: the group's Job CR is gone and there is no
# failed-nodes ConfigMap. The reason must stay empty — the report never
# invents a cause — and nothing crashes: the JSON carries "reason": "" and
# the human card prints the group line without a reason line.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: cert-noreason
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  categories:
    - domain: training
      variant: nemotron5-8b
status:
  conditions:
    - type: Failed
      status: "True"
      reason: WorkflowsFailed
      message: 1 of 1 certification categories failed
      lastTransitionTime: "2026-08-07T01:00:00Z"
  categoryStatuses:
    - domain: training
      variant: nemotron5-8b
      status: Failed
      workflowRef:
        name: cert-noreason-training-nemotron5-8b
        namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: cert-noreason-training-nemotron5-8b
  namespace: default
  labels:
    nvcre.nvidia.com/certification: cert-noreason
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: rt
          trainer:
            image: img:latest
            numNodes: 2
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  orchestration:
    totalNodes: 2
    nodesPerJob: 2
    totalGroups: 1
    currentIteration: 1
    detectedPlatform: onprem
    detectedGPUArchitecture: h100
    groups:
      - name: group-0
        nodes:
          - node001
          - node002
        phase: Failed
        jobRef:
          apiVersion: nvcre.nvidia.com/v1alpha1
          kind: Job
          name: cert-noreason-training-nemotron5-8b-job-group-0
          namespace: default
        startTime: "2026-08-07T00:00:00Z"
        completionTime: "2026-08-07T00:10:00Z"
  conditions:
    - type: Failed
      status: "True"
      reason: GroupsFailed
      message: 1 groups failed across 1 iterations
      lastTransitionTime: "2026-08-07T00:10:00Z"
