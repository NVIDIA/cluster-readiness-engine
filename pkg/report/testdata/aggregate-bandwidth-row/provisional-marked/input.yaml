# The only measurement completed as LogsUnavailable, so its result is
# provisional. The row is kept and marked rather than shown as final.
measurements:
  - spec:
      jobRef: {apiGroup: nvcre.nvidia.com, kind: Job, name: j0}
    status:
      conditions:
        - type: Complete
          status: "True"
          reason: LogsUnavailable
          message: Referenced Job no longer exists; results are provisional and are not used for threshold evaluation
          lastTransitionTime: "2026-10-01T00:00:00Z"
      results:
        - {sizeBytes: 1048576, algBW: "14.00", busBW: "27.00", samples: 3}
