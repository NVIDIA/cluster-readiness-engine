# The INCOMPLETE rule was narrowed, not disabled. A cordoned node is a
# configuration accident the operator should hear about whatever the placement
# is: it means a machine they believe is in the fleet was not available, which
# is true independent of how many jobs ran.
#
# So this run reports INCOMPLETE even though its untested nodes are intentional.
# The pairing with unpinned-untested-nodes-not-incomplete is the point: one
# shows scope is not an exclusion, the other shows an exclusion is still an
# exclusion.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: cert-unpinned-cordon
  namespace: default
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  placement: Unpinned
  categories:
    - domain: communication
      variant: nccl-all-reduce
status:
  conditions:
    - type: Succeeded
      status: "True"
      reason: AllWorkflowsSucceeded
      message: All certification categories completed successfully
      lastTransitionTime: "2026-08-07T00:00:00Z"
  categoryStatuses:
    - domain: communication
      variant: nccl-all-reduce
      status: Succeeded
      workflowRef:
        name: cert-unpinned-cordon-communication-nccl-all-reduce
        namespace: default
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: cert-unpinned-cordon-communication-nccl-all-reduce
  namespace: default
  labels:
    nvcre.nvidia.com/certification: cert-unpinned-cordon
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: rt
          trainer:
            image: img:latest
            numNodes: 2
  orchestration:
    iterations: 1
    placement: Unpinned
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
status:
  orchestration:
    totalNodes: 17
    nodesPerJob: 2
    totalGroups: 1
    placement: Unpinned
    detectedPlatform: onprem
    detectedGPUArchitecture: h100
    excludedNodes:
      - node018
    exclusionReason: "node is cordoned (unschedulable)"
    # Backfilled from live pod placement, as on every succeeded unpinned run.
    # The exercised count comes from here; the cordoned node is excluded from
    # the target total above, which is why the line reads 2 of 17 rather than
    # 2 of 18.
    groups:
      - name: group-0
        nodes:
          - node001
          - node002
        phase: Succeeded
  conditions:
    - type: Succeeded
      status: "True"
      reason: AllGroupsSucceeded
      message: done
      lastTransitionTime: "2026-08-07T00:00:00Z"
