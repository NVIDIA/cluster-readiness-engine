# Both groups are 2-node groups in clique-a, so both get the label
# "clique-a (2 nodes)". group-1 failed with no measurement. It used to be
# dropped because the measured group-0 had already claimed that label (#449).
groups:
  - name: group-0
    nodes: [n0, n1]
    domains: [clique-a]
    phase: Succeeded
    jobRef: {name: j0}
  - name: group-1
    nodes: [n2, n3]
    domains: [clique-a]
    phase: Failed
    jobRef: {name: j1}
measurements:
  - spec:
      jobRef: {apiGroup: nvcre.nvidia.com, kind: Job, name: j0}
    status:
      conditions:
        - {type: Complete, status: "True", reason: JobSucceeded, message: Job succeeded, lastTransitionTime: "2026-10-01T00:00:00Z"}
      results:
        - {sizeBytes: 1073741824, algBW: "400.00", busBW: "400.00", samples: 1}
