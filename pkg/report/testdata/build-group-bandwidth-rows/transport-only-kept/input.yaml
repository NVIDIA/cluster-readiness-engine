# group-0 finished with a transport but no bandwidth rows. It keeps its row
# with an empty BusBW and is not judged against the threshold.
minBusBandwidthGBps: "300"
groups:
  - name: group-0
    nodes: [node-0, node-1]
    domains: [clique-0]
    phase: Succeeded
    jobRef: {name: job-0}
  - name: group-1
    nodes: [node-2, node-3]
    domains: [clique-1]
    phase: Succeeded
    jobRef: {name: job-1}
measurements:
  - spec:
      jobRef: {apiGroup: nvcre.nvidia.com, kind: Job, name: job-0}
    status:
      transport: [IB]
  - spec:
      jobRef: {apiGroup: nvcre.nvidia.com, kind: Job, name: job-1}
    status:
      transport: [Socket]
      results:
        - {sizeBytes: 1024, algBW: "0.50", busBW: "1.0", samples: 1}
        - {sizeBytes: 17179869184, algBW: "180.0", busBW: "350.0", samples: 1}
