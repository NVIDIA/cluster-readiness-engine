# The slow stub keeps the workers running long enough to delete the Certification mid-run.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: computedomain-delete
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  image: nvcre-nccl-stub:slow
  categories:
    - domain: communication
      variant: nccl-all-reduce
