# Two nodes, the passing stub: the replayed log yields a full BandwidthMeasurement.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: nccl-pass
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  image: nvcre-nccl-stub:pass
  categories:
    - domain: communication
      variant: nccl-all-reduce
