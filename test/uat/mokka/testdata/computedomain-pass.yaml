# On gb200 and gb300 the catalog adds a ComputeDomain, which the real DRA driver must make Ready before the workers start.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: computedomain-pass
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  image: nvcre-nccl-stub:pass
  categories:
    - domain: communication
      variant: nccl-all-reduce
