# GPU Feature Discovery, reading nvml-mock, so nvidia.com/gpu.product and the
# other labels NVCRE detects from are written by the real producer (ADR-096).
#
# GFD only writes a feature file under features.d; NFD turns it into node
# labels, so setup.sh installs NFD first. The standalone gpu-feature-discovery
# image stops at v0.8.2, which has no driver-root flag, so this runs the
# gpu-feature-discovery binary shipped in the device plugin image. The same
# fix is proposed for Mokka's own e2e asset in NVIDIA/k8s-test-infra#1083.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gfd-mock
  namespace: kube-system
  labels:
    app.kubernetes.io/name: gpu-feature-discovery
    app.kubernetes.io/component: gfd
spec:
  selector:
    matchLabels:
      name: nvidia-gfd-mock
  template:
    metadata:
      labels:
        name: nvidia-gfd-mock
    spec:
      # Same placement as device-plugin-mock.yaml: only nodes that run the mock
      # have an NVML to read. Elsewhere GFD exits with ERROR_LIBRARY_NOT_FOUND
      # and the DaemonSet never reports ready.
      nodeSelector:
        mokka.nvidia.com/type: sgpu
      tolerations:
        - operator: Exists
      serviceAccountName: nvidia-gfd-mock
      containers:
        - name: gpu-feature-discovery
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
          imagePullPolicy: IfNotPresent
          command: ["gpu-feature-discovery"]
          args:
            - "--driver-root-ctr-path=/var/lib/nvml-mock/driver"
            - "--device-discovery-strategy=nvml"
            # Kind has no DMI product name to own; the node agent stages the
            # machine type in the driver config instead.
            - "--machine-type-file=/var/lib/nvml-mock/driver/config/machine-type"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GFD_SLEEP_INTERVAL
              value: "60s"
          securityContext:
            privileged: true
          volumeMounts:
            - name: mock-root
              mountPath: /var/lib/nvml-mock
              readOnly: true
            - name: output-dir
              mountPath: /etc/kubernetes/node-feature-discovery/features.d
            - name: host-sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: mock-root
          hostPath:
            path: /var/lib/nvml-mock
        - name: output-dir
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-gfd-mock
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-gfd-mock
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-gfd-mock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-gfd-mock
subjects:
  - kind: ServiceAccount
    name: nvidia-gfd-mock
    namespace: kube-system
