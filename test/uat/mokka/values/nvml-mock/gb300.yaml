# nvml-mock values for the gb300 profile (ADR-096). GPUs are allocated by the
# device plugin; ComputeDomains by the DRA driver (values/dra-driver.yaml).
# setup.sh adds a topology overlay that puts the cluster's sgpu workers in one
# NVLink clique, because the node names depend on the cluster name.
gpu:
  profile: gb300
nodeSelector:
  mokka.nvidia.com/type: sgpu
imex:
  mockChannels:
    enabled: true
