    networking.gke.io.networks/nvcre-uat-gpu-nic-7: "1"
    networking.gke.io.networks/nvcre-uat-gpu-nic-7.IP: "1"
    nvidia.com/gpu: "8"
    pods: "110"
  conditions:
  - type: Ready
    status: "True"
    reason: KubeletReady
    message: kubelet is posting ready status
  phase: Running
