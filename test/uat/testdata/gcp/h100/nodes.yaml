# Key labels for CRE detection:
#   nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3  -> GPU arch "h100"
#   nvidia.com/gpu.present: "true"                  -> nvcrectl GPU discovery
#   spec.providerID: "gce://..."                    -> platform "gcp" (workflow_detect.go)
