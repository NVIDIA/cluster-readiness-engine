    nvidia.com/gpu: "8"
    pods: "110"
  allocatable:
    cpu: 207410m
    ephemeral-storage: "5642136341201"
    memory: 1885805196Ki
    networking.gke.io.networks/nvcre-uat-gpu-nic-0: "1"
    networking.gke.io.networks/nvcre-uat-gpu-nic-0.IP: "1"
    networking.gke.io.networks/nvcre-uat-gpu-nic-1: "1"
    networking.gke.io.networks/nvcre-uat-gpu-nic-1.IP: "1"
    networking.gke.io.networks/nvcre-uat-gpu-nic-2: "1"
