spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - nscale-b200-node-01
            - nscale-b200-node-02
          - key: nvidia.com/gpu.present
            operator: In
            values:
            - "true"
  containers:
  - args:
    - -N
    - "8"
    - --allow-run-as-root
    - --mca
    - plm_rsh_args
    - -o StrictHostKeyChecking=no
    - -x
    - NCCL_SOCKET_IFNAME=eth0
    - -x
    - NCCL_DEBUG=INFO
    - -x
    - NCCL_NVLS_ENABLE=1
    - -x
    - NCCL_CUMEM_ENABLE=1
    - -x
    - NCCL_P2P_NET_CHUNKSIZE=2097152
    - -x
    - NCCL_MNNVL_ENABLE=0
    - -x
    - NCCL_IB_PCI_RELAXED_ORDERING=1
    - -x
    - SHARP_COLL_ENABLE_PCI_RELAXED_ORDERING=1
    - -x
    - OMPI_MCA_btl_openib_warn_default_gid_prefix=0
    - -x
    - PMIX_MCA_gds=^ds12
    - -x
    - NCCL_IB_QPS_PER_CONNECTION=8
    - -x
    - NCCL_MIN_NCHANNELS=32
    - -x
    - NCCL_MIN_CTAS=64
    - /usr/local/bin/all_reduce_perf_mpi
    - -b
    - "8"
    - -e
    - 16G
    - -f
    - "2"
    - -n
    - "100"
    - -N
    - "10"
    command:
    - timeout
    - "3600"
    - /usr/local/mpi/bin/mpirun
    env:
    - name: OMPI_MCA_orte_default_hostfile
      value: /etc/mpi/hostfile
    - name: OMPI_MCA_orte_keep_fqdn_hostnames
      value: "true"
    - name: OMPI_MCA_orte_set_default_slots
      value: "8"
    - name: OMPI_MCA_plm_rsh_args
      value: -o ConnectionAttempts=10
    - name: JOB_COMPLETION_INDEX
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
    image: nvcr.io/nvidia/pytorch:26.01-py3
    imagePullPolicy: IfNotPresent
    name: node
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: "2"
        memory: 1Gi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /tmp/mpi-ssh-raw
      name: mpi-ssh-auth
    - mountPath: /root/.ssh
      name: ssh-keys
    - mountPath: /etc/mpi
      name: mpi-hostfile
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
