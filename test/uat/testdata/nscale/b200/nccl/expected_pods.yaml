    - sh
    - -c
    env:
    - name: JOB_COMPLETION_INDEX
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
    image: nvcr.io/nvidia/pytorch:26.01-py3
    imagePullPolicy: IfNotPresent
    name: fix-ssh-permissions
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /tmp/mpi-ssh-raw
      name: mpi-ssh-auth
      readOnly: true
    - mountPath: /root/.ssh
      name: ssh-keys
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access
      readOnly: true
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: OnFailure
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  subdomain: nscale-b200-nccl-communic-64ca7-job-workload
  terminationGracePeriodSeconds: 30
  tolerations:
  - operator: Exists
  volumes:
  - emptyDir: {}
    name: ssh-keys
  - name: mpi-ssh-auth
    secret:
      defaultMode: 420
      items:
      - key: ssh-privatekey
        path: id_rsa
      - key: ssh-publickey
        path: id_rsa.pub
      - key: ssh-publickey
        path: authorized_keys
      secretName: nscale-b200-nccl-communic-64ca7-job-workload-mpi-ssh-auth
  - configMap:
      defaultMode: 420
      items:
      - key: hostfile
        mode: 292
        path: hostfile
      name: nscale-b200-nccl-communic-64ca7-job-workload-mpi-hostfile
    name: mpi-hostfile
  - name: kube-api-access
