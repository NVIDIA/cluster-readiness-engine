    node.kubernetes.io/instance-type: p7-gb300.72xlarge
    topology.k8s.aws/network-node-layer-1: nn-aws-gb300-rack-01
spec:
  providerID: "aws:///us-east-1a/i-0000000000000002"
status:
  capacity:
    cpu: "192"
    ephemeral-storage: 21455242Mi
    memory: 1542553600Ki
    nvidia.com/gpu: "4"
