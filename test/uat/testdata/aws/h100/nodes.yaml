# KWOK-simulated AWS H100 GPU nodes.
#
# Key labels for CRE detection:
#   nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3  -> GPU arch "h100" (workflow_detect.go)
#   nvidia.com/gpu.present: "true"                  -> ncrectl GPU discovery
#   spec.providerID: "aws:///..."                   -> platform "aws" (workflow_detect.go)
#
# Modeled after real AWS p5.48xlarge nodes from node.yaml.
# KWOK annotation kwok.x-k8s.io/node: fake marks these as KWOK-managed.
# No taint so the scheduler places pods freely on these nodes.
---
apiVersion: v1
kind: Node
metadata:
  name: aws-h100-node-01
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: aws-h100-node-01
    kubernetes.io/os: linux
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    nvidia.com/gpu.count: "8"
    nvidia.com/gpu.family: hopper
    node.kubernetes.io/instance-type: p5.48xlarge
spec:
  providerID: "aws:///us-east-1e/i-0000000000000001"
status:
  capacity:
    cpu: "192"
    memory: 2052347172Ki
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "32"
    pods: "100"
  allocatable:
    cpu: "192"
    memory: 2052347172Ki
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "32"
    pods: "100"
  conditions:
  - type: Ready
    status: "True"
    reason: KubeletReady
    message: kubelet is posting ready status
  phase: Running
---
apiVersion: v1
kind: Node
metadata:
  name: aws-h100-node-02
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: aws-h100-node-02
    kubernetes.io/os: linux
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    nvidia.com/gpu.count: "8"
    nvidia.com/gpu.family: hopper
    node.kubernetes.io/instance-type: p5.48xlarge
spec:
  providerID: "aws:///us-east-1e/i-0000000000000002"
status:
  capacity:
    cpu: "192"
    memory: 2052347172Ki
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "32"
    pods: "100"
  allocatable:
    cpu: "192"
    memory: 2052347172Ki
    nvidia.com/gpu: "8"
    vpc.amazonaws.com/efa: "32"
    pods: "100"
  conditions:
  - type: Ready
    status: "True"
    reason: KubeletReady
    message: kubelet is posting ready status
  phase: Running
