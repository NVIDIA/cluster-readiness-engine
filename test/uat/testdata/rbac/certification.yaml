# Applied with the API, not nvcrectl, into a namespace that has no run
# RoleBinding, to exercise the controller's wait for access (ADR-092).
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: rbac-kubectl-apply
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
