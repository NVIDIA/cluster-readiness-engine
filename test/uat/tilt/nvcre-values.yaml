# Keep the manager on the real Kind node. UAT GPU nodes are simulated by KWOK
# and may remain in a reused cluster after an interrupted test run.
manager:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
