# Custom KWOK Stage: auto-complete Job-owned pods after 30 seconds.
#
# Overrides the default pod-complete from stage-fast.yaml (same metadata.name = replace).
# The default stage completes pods immediately; this adds a 30s delay so that
# NVCRE's health monitoring and status propagation have time to observe Running pods.
#
# Lifecycle: Pod Created -> Running (instant, pod-ready stage) -> Succeeded (30s, this stage)
# Triggers:  Jobs complete -> JobSet completes -> Trainer marks TrainJob Complete ->
#            NVCRE Job -> Workflow -> Certification Succeeded
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-complete
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
    - key: '.metadata.deletionTimestamp'
      operator: 'DoesNotExist'
    - key: '.status.phase'
      operator: 'In'
      values:
      - 'Running'
    - key: '.metadata.ownerReferences.[].kind'
      operator: 'In'
      values:
      - 'Job'
  delay:
    durationMilliseconds: 10000
    jitterDurationMilliseconds: 5000
  next:
    statusTemplate: |
      {{ $now := Now }}
      {{ $root := . }}
      containerStatuses:
      {{ range $index, $item := .spec.containers }}
      - image: {{ $item.image | Quote }}
        name: {{ $item.name | Quote }}
        ready: false
        restartCount: 0
        started: false
        state:
          terminated:
            exitCode: 0
            finishedAt: {{ $now | Quote }}
            reason: Completed
            startedAt: {{ $now | Quote }}
      {{ end }}
      phase: Succeeded
