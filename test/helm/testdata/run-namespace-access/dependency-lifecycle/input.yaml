# Access the controller needs in a namespace it runs a Workflow in, checked
# against what a run namespace holds: nvcre-manager-role plus nvcre-run-role,
# which is also everything rbac.scope: cluster grants.
#
# Every kind a Workflow can create as a dependency: the kinds in
# pkg/catalog/entries and pkg/platform/overrides, plus the ConfigMap and PVC
# the WorkloadRun controller builds. Any of them becomes job-scoped when the
# Job template references its name, so each needs the full set:
#   create  createDependencies / createJobDependencies
#   get     getDependencyObject, setDependencyOwners
#   update  setDependencyOwners stamps the Job owner on job-scoped dependencies
#   delete  handleDeletion and scoped-dependency cleanup
# A new dependency kind belongs here as well as in the chart's run role.
#
# Then the writes that are not dependencies: the Job controller creates and
# deletes the TrainJob, and the measurement controllers read pod logs.
# pkg/controller's requiredNamespaceAccess asks for the same set before a
# Workflow writes anything.
required:
- group: ""
  resource: configmaps
  verbs: [create, get, update, delete]
- group: ""
  resource: persistentvolumeclaims
  verbs: [create, get, update, delete]
- group: trainer.kubeflow.org
  resource: trainingruntimes
  verbs: [create, get, update, delete]
- group: resource.k8s.io
  resource: resourceclaimtemplates
  verbs: [create, get, update, delete]
- group: resource.nvidia.com
  resource: computedomains
  verbs: [create, get, update, delete]
- group: trainer.kubeflow.org
  resource: trainjobs
  verbs: [create, delete]
- group: ""
  resource: pods/log
  verbs: [get]
