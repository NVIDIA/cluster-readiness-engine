# =============================================================================
# Workflow with Platform/GPU Overrides
# =============================================================================
#
# Demonstrates using spec.overrides to conditionally patch the jobTemplate
# and append dependencies based on auto-detected platform and GPU architecture.
#
# The controller detects:
#   - Platform: from node.spec.providerID (aws, gcp, azure, oci, onprem)
#   - GPU architecture: from nvidia.com/gpu.product label (h100, gb200, a100, l40s, etc.)
#
# Overrides use JSON merge patch semantics:
#   - Maps merge recursively (only specified fields are changed)
#   - Lists replace entirely (args, command, env, etc.)
#
# =============================================================================
apiVersion: cre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  labels:
    app.kubernetes.io/name: cluster-readiness-engine
  name: nccl-multi-platform
spec:
  # Base job template — works on any platform with 4 GPUs per node.
  jobTemplate:
    spec:
      nodeHealthMonitor:
        cel:
          expression: "node.spec.unschedulable == true"
      workload:
        trainJob:
          runtimeRef:
            kind: ClusterTrainingRuntime
            name: nccl-test-runtime
          trainer:
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command:
              - /bin/bash
              - -c
            args:
              - |
                exec torchrun \
                  --nnodes 8 \
                  --nproc-per-node 4 \
                  /workspace/nccl-tests/build/all_reduce_perf \
                  -b 8 -e 8G -f 2 -g 1
            numNodes: 8
            numProcPerNode: 4

  orchestration:
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    iterations: 3

  # Conditional overrides applied based on detected environment.
  overrides:
    # H100 nodes have 8 GPUs — override nproc-per-node.
    - when:
        gpuArchitecture: { equals: "h100" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                args:
                  - |
                    exec torchrun \
                      --nnodes 8 \
                      --nproc-per-node 8 \
                      /workspace/nccl-tests/build/all_reduce_perf \
                      -b 8 -e 8G -f 2 -g 1
                numProcPerNode: 8

    # GB200 nodes have 4 GPUs but need larger message sizes.
    - when:
        gpuArchitecture: { equals: "gb200" }
      jobTemplate:
        spec:
          workload:
            trainJob:
              trainer:
                args:
                  - |
                    exec torchrun \
                      --nnodes 8 \
                      --nproc-per-node 4 \
                      /workspace/nccl-tests/build/all_reduce_perf \
                      -b 8 -e 16G -f 2 -g 1

    # AWS-specific: add EFA network configuration.
    - when:
        platform: { equals: "aws" }
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: nccl-multi-platform-aws-config
          data:
            NCCL_NET_GDR_LEVEL: "PHB"
            FI_EFA_USE_DEVICE_RDMA: "1"

    # GCP-specific: add GKE network configuration.
    - when:
        platform: { equals: "gcp" }
      dependencies:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: nccl-multi-platform-gcp-config
          data:
            NCCL_SOCKET_IFNAME: "eth0"
            NCCL_NET: "gRPC"
